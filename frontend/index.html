<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRODE MUNDIAL 2026 ⚽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta Grupo Gestión: naranja + gris + verde lima */
    --naranja: #FC9935;
    --naranja-dark: #D17715;
    --naranja-light: #FFB066;
    --verde-lima: #BACA48;
    --verde-lima-dark: #95A52E;
    --gris-claro: #CBCBCA;
    /* Aliases por compatibilidad: rojo y celeste ahora son naranja, dorado pasa a ser verde lima */
    --rojo: var(--naranja);
    --rojo-dark: var(--naranja-dark);
    --celeste: var(--naranja);
    --celeste-dark: var(--naranja-dark);
    --celeste-light: var(--naranja-light);
    --dorado: var(--verde-lima);
    --dorado-dark: var(--verde-lima-dark);
    --azul: #2F2F2F;
    --negro: #0A0A0A;
    --gris: #1a1a1a;
    --gris-2: #2a2a2a;
    --blanco: #FFFFFF;
    --verde: #00C853;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--negro);
    color: var(--blanco);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse at top left, rgba(252, 153, 53, 0.15), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(186, 202, 72, 0.08), transparent 50%),
      repeating-linear-gradient(90deg, transparent 0, transparent 80px, rgba(255,255,255,0.015) 80px, rgba(255,255,255,0.015) 81px);
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px, 70px 70px;
  }

  /* === HEADER === */
  .header {
    background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-dark) 100%);
    padding: 14px 20px;
    box-shadow: 0 4px 20px rgba(252, 153, 53, 0.4);
    position: sticky; top: 0; z-index: 100;
    border-bottom: 3px solid var(--dorado);
  }
  .header-content {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px; cursor: pointer; flex-wrap: wrap;
  }
  .logo-img {
    height: 56px; width: auto;
    filter: drop-shadow(0 3px 10px rgba(186, 202, 72, 0.3)) drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .logo-text {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    line-height: 1;
  }
  .logo-author {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #000;
    letter-spacing: 1px;
    margin-top: 5px;
    font-style: italic;
    text-transform: none;
  }
  .logo-text small {
    display: block;
    font-size: 10px;
    color: #ffffff;
    letter-spacing: 2.5px;
    margin-top: 3px;
  }
  /* Separador entre logo Mundial y logo Grupo Gestión en el header */
  .logo-divider {
    width: 1px;
    height: 42px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 4px;
  }
  .logo-gg {
    height: 36px; width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    opacity: 0.95;
  }
  /* El logo de Carrefour es casi cuadrado: lo escalamos a más alto
     que el de GG (que es muy alargado por el texto) para que se vean parejos */
  .logo-carrefour {
    height: 72px; width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  }
  .user-info {
    display: flex; align-items: center; gap: 10px; font-size: 14px;
  }
  /* Apila el row clásico (nombre+badges+Salir) y la mini-card de stats debajo */
  .user-info-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .user-badge {
    background: rgba(0,0,0,0.3);
    padding: 6px 12px; border-radius: 20px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* Mini-card con: pts · General · Empresa · Sede */
  .user-stats {
    display: flex; align-items: stretch; gap: 0;
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px; padding: 4px 2px; overflow: hidden;
  }
  .user-stat {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 56px; padding: 3px 10px;
    border-left: 1px solid rgba(255,255,255,0.08);
  }
  .user-stat:first-child { border-left: none; }
  .user-stat-value { font-weight: 900; font-size: 15px; color: #fff; line-height: 1; }
  .user-stat-label { font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); margin-top: 2px; }
  .user-stat.points .user-stat-value { color: #ffd0a8; }
  .user-stat.pos-general .user-stat-value { color: #ffffff; }
  .user-stat.pos-company .user-stat-value { color: #d6e394; }
  .user-stat.pos-city .user-stat-value { color: #74acdf; }
  .user-stat .user-stat-value.dash { color: rgba(255,255,255,0.35); }

  @media (max-width: 900px) {
    .user-stat { min-width: 44px; padding: 2px 6px; }
    .user-stat-value { font-size: 13px; }
    .user-stat-label { font-size: 8px; }
  }
  @media (max-width: 600px) {
    .user-info-stack { gap: 5px; }
    .user-stat { min-width: 38px; padding: 2px 5px; }
    .user-stat-value { font-size: 12px; }
    .user-stat-label { font-size: 8px; letter-spacing: 0.3px; }
  }
  .btn-logout {
    background: var(--negro); color: var(--blanco);
    border: none; padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-weight: 600; font-size: 12px; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .btn-logout:hover { background: var(--dorado); color: var(--negro); }

  /* === TABS === */
  .tabs {
    display: flex; max-width: 1200px; margin: 20px auto 0;
    gap: 4px; padding: 0 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--gris); color: rgba(255,255,255,0.6);
    border: 2px solid transparent;
    padding: 12px 18px; cursor: pointer;
    font-family: 'Anton', sans-serif;
    font-size: 14px; letter-spacing: 1.5px;
    border-radius: 8px 8px 0 0;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab:hover { color: var(--blanco); background: var(--gris-2); }
  .tab.active {
    background: var(--rojo); color: var(--blanco);
    border-color: var(--dorado);
    box-shadow: 0 -4px 16px rgba(252, 153, 53, 0.3);
  }

  .container {
    max-width: 1200px; margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* === AUTH === */
  .auth-screen {
    min-height: calc(100vh - 80px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: linear-gradient(145deg, var(--gris) 0%, #0f0f0f 100%);
    border: 2px solid rgba(186, 202, 72, 0.3);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(252, 153, 53, 0.15);
    position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--rojo), var(--dorado), var(--rojo));
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .auth-hero { text-align: center; margin-bottom: 24px; }
  .auth-logo {
    width: auto; height: 160px;
    margin: 0 auto 12px;
    display: block;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 12px 28px rgba(186, 202, 72, 0.4)) drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .auth-title {
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    line-height: 1;
  }
  .auth-title .red { color: var(--rojo); }
  .auth-title .gold { color: var(--dorado); }
  .auth-subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 11px; letter-spacing: 2.5px;
    margin-top: 8px; text-transform: uppercase;
  }
  .auth-author {
    color: var(--dorado);
    font-size: 12px;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 1.5px;
    margin-top: 6px;
    opacity: 0.85;
  }
  /* Bloque "Presenta: GRUPO GESTIÓN" debajo del logo */
  .powered-by {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .powered-by-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    font-weight: 600;
  }
  .powered-by-logo {
    height: 36px; width: auto;
    filter: drop-shadow(0 2px 8px rgba(252, 153, 53, 0.2));
    opacity: 0.95;
  }
  .auth-toggle {
    display: flex; background: var(--negro);
    border-radius: 8px; padding: 4px; margin-bottom: 22px;
  }
  .auth-toggle button {
    flex: 1; background: transparent; color: rgba(255,255,255,0.5);
    border: none; padding: 10px; cursor: pointer;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    border-radius: 6px; transition: all 0.2s;
  }
  .auth-toggle button.active { background: var(--rojo); color: var(--blanco); }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; margin-bottom: 6px;
    color: rgba(255,255,255,0.7); text-transform: uppercase;
  }
  .form-group input, .form-group select {
    width: 100%; background: var(--negro);
    border: 2px solid var(--gris-2); color: var(--blanco);
    padding: 11px 14px; border-radius: 8px;
    font-size: 15px; font-family: inherit;
    transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--dorado);
    box-shadow: 0 0 0 3px rgba(186, 202, 72, 0.15);
  }
  .category-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .category-option {
    background: var(--negro); border: 2px solid var(--gris-2);
    color: var(--blanco); padding: 14px 10px;
    border-radius: 8px; cursor: pointer; text-align: center;
    transition: all 0.2s; font-size: 13px; font-weight: 600;
  }
  .category-option .emoji { display: block; font-size: 24px; margin-bottom: 4px; }
  .category-option:hover { border-color: rgba(186, 202, 72, 0.5); }
  .category-option.selected {
    border-color: var(--dorado);
    background: rgba(186, 202, 72, 0.1);
    box-shadow: 0 0 0 3px rgba(186, 202, 72, 0.15);
  }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-dark) 100%);
    color: var(--blanco); border: none; padding: 14px;
    border-radius: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    cursor: pointer; margin-top: 10px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(252, 153, 53, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(252, 153, 53, 0.5);
  }
  .alert {
    background: rgba(227, 6, 19, 0.15); border: 1px solid #E30613;
    color: #FFB3B8; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; margin-bottom: 14px;
  }
  .alert.success {
    background: rgba(0, 200, 83, 0.15); border-color: var(--verde);
    color: #B3F5C9;
  }

  /* === STATS BAR === */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 16px 12px;
    text-align: center; transition: all 0.2s;
  }
  .stat-card:hover { border-color: var(--dorado); transform: translateY(-2px); }
  .stat-value {
    font-family: 'Anton', sans-serif;
    font-size: 28px; color: var(--dorado); line-height: 1;
  }
  .stat-label {
    font-size: 10px; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5); margin-top: 6px; text-transform: uppercase;
  }

  /* === FILTROS === */
  .phase-filter {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .phase-btn {
    background: var(--gris); color: rgba(255,255,255,0.6);
    border: 1px solid var(--gris-2);
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    transition: all 0.2s;
  }
  .phase-btn:hover { color: var(--blanco); border-color: var(--dorado); }
  .phase-btn.active {
    background: var(--dorado); color: var(--negro); border-color: var(--dorado);
  }
  /* Pestaña "Hoy" — late suavemente cuando hay partidos del día y no está activa */
  .phase-btn.phase-today {
    background: rgba(255, 76, 76, 0.12);
    border-color: rgba(255, 76, 76, 0.55);
    color: #ffd4d4;
  }
  .phase-btn.phase-today:hover { color: #fff; border-color: #ff7a7a; background: rgba(255, 76, 76, 0.22); }
  .phase-btn.phase-today.active { background: #ff4c4c; color: #fff; border-color: #ff4c4c; }
  .phase-btn.phase-today.beats {
    animation: phaseTodayBeat 1.8s ease-in-out infinite;
  }
  @keyframes phaseTodayBeat {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 76, 76, 0.45); }
    50%      { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(255, 76, 76, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .phase-btn.phase-today.beats { animation: none; }
  }

  /* === MATCHES === */
  .match-group { margin-bottom: 28px; }
  .match-group-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 2px;
    color: var(--dorado);
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 2px solid var(--gris-2);
    display: flex; align-items: center; gap: 10px;
  }
  .match-group-title::before {
    content: ''; width: 4px; height: 24px;
    background: var(--rojo); border-radius: 2px;
  }
  .match-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 16px;
    margin-bottom: 12px; transition: all 0.2s;
    position: relative;
  }
  .match-card:hover {
    border-color: rgba(186, 202, 72, 0.4);
    transform: translateX(2px);
  }
  .match-card.predicted {
    border-color: rgba(0, 200, 83, 0.4);
    background: linear-gradient(145deg, rgba(0, 200, 83, 0.05), #141414);
  }
  .match-card.finished {
    border-color: rgba(186, 202, 72, 0.5);
  }
  .match-meta {
    display: flex; justify-content: space-between;
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;
    gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .match-meta .group-tag {
    background: var(--rojo); color: var(--blanco);
    padding: 2px 8px; border-radius: 10px; font-weight: 700;
  }
  .match-meta .match-datetime strong {
    color: var(--dorado); font-weight: 700;
  }
  .match-venue {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 12px;
    letter-spacing: 0.3px;
    border-left: 2px solid var(--gris-2);
    padding-left: 8px;
  }
  /* === BOTÓN DE TEST (ingreso rápido como admin) === */
  .btn-test {
    width: 100%;
    margin-top: 14px;
    background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 100%);
    color: var(--dorado);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    padding: 10px;
    border-radius: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 13px; letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-test:hover {
    border-color: var(--dorado);
    background: linear-gradient(135deg, #5a5a5a 0%, #3a3a3a 100%);
    transform: translateY(-1px);
  }
  .test-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 4px;
    font-size: 10px; letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
  }
  .test-divider::before, .test-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.1);
  }
  /* === WORKPLACE PICKER === */
  .workplace-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .workplace-option {
    background: var(--negro); border: 2px solid var(--gris-2);
    color: var(--blanco); padding: 12px 8px;
    border-radius: 8px; cursor: pointer; text-align: center;
    transition: all 0.2s; font-size: 12px; font-weight: 600;
    line-height: 1.3;
  }
  .workplace-option .emoji { display: block; font-size: 22px; margin-bottom: 4px; }
  .workplace-option:hover { border-color: rgba(0, 47, 108, 0.7); }
  .workplace-option.selected {
    border-color: var(--azul);
    background: rgba(0, 47, 108, 0.25);
    box-shadow: 0 0 0 3px rgba(0, 47, 108, 0.2);
  }
  /* === SELECTOR DE EMPRESA (registro) === */
  .company-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .company-option {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px 8px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    cursor: pointer; transition: all 0.18s ease; min-height: 110px;
    opacity: 0.6;
  }
  .company-option img { height: 56px; max-width: 100%; object-fit: contain; }
  /* El logo de Carrefour es casi cuadrado: para equiparar visualmente al de GG,
     forzamos un alto mayor (el PNG sigue siendo el original, no recortado). */
  .company-option img[alt="Carrefour"] {
    height: 96px; max-width: 90%;
  }
  .company-option .company-name { font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; color: rgba(255,255,255,0.85); font-weight: 700; }
  .company-option:hover { border-color: rgba(255,138,76,0.55); opacity: 0.9; }
  .company-option.selected {
    border-color: var(--naranja, #ff8a4c);
    background: rgba(255,138,76,0.10);
    box-shadow: 0 0 0 3px rgba(255,138,76,0.18), 0 8px 24px rgba(255,138,76,0.25);
    opacity: 1;
  }
  .form-group input[disabled], .form-group select[disabled] {
    opacity: 0.45; cursor: not-allowed;
  }
  .form-group .hint { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 4px; display: block; }
  .ranking-company-tag {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255,138,76,0.18); color: #ffb98a; border: 1px solid rgba(255,138,76,0.35);
  }
  .ranking-company-tag.carrefour {
    background: rgba(0,113,206,0.18); color: #8ec8ff; border-color: rgba(0,113,206,0.35);
  }

  .workplace-badge {
    background: rgba(0, 47, 108, 0.4);
    color: #B3D4FF;
    padding: 3px 8px; border-radius: 8px;
    font-size: 10px; letter-spacing: 1px;
    font-weight: 700; text-transform: uppercase;
  }
  .match-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 12px;
  }
  .team { display: flex; align-items: center; gap: 10px; }
  .team.home { justify-content: flex-end; text-align: right; }
  .team.away { justify-content: flex-start; }
  .team-flag {
    width: 36px; height: 26px; object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    flex-shrink: 0;
    background: var(--gris-2);
  }
  .team-flag-placeholder {
    width: 36px; height: 26px;
    border-radius: 4px;
    background: var(--gris-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; color: rgba(255,255,255,0.4);
    flex-shrink: 0;
  }
  .team-name {
    font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
  }
  .score-input {
    width: 44px; height: 44px;
    background: var(--negro);
    border: 2px solid var(--gris-2);
    color: var(--blanco); text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 22px; border-radius: 8px;
    transition: all 0.2s;
  }
  .score-input:focus {
    outline: none; border-color: var(--dorado);
    background: rgba(186, 202, 72, 0.05);
  }
  .score-input:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Display de score guardado (no editable) */
  .score-display {
    width: 44px; height: 44px;
    background: rgba(0, 200, 83, 0.12);
    border: 2px solid rgba(0, 200, 83, 0.5);
    color: var(--blanco); text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 22px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .score-display.locked {
    background: rgba(186, 202, 72, 0.08);
    border-color: rgba(186, 202, 72, 0.5);
    color: var(--dorado);
  }
  .vs {
    font-family: 'Anton', sans-serif;
    color: var(--dorado); font-size: 14px; padding: 0 4px;
  }
  .score-block { display: flex; align-items: center; gap: 6px; }
  .match-footer {
    margin-top: 12px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .btn-save {
    background: var(--rojo); color: var(--blanco);
    border: none; padding: 8px 16px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .btn-save:hover { background: var(--dorado); color: var(--negro); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Botón Modificar (re-abrir un pronóstico ya guardado) */
  .btn-modify {
    background: transparent;
    color: var(--dorado);
    border: 1px solid var(--dorado);
    padding: 7px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .btn-modify:hover {
    background: var(--dorado); color: var(--negro);
  }
  /* Botón Cancelar (volver al modo bloqueado sin guardar) */
  .btn-cancel {
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 1px solid var(--gris-2);
    padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.2s;
  }
  .btn-cancel:hover {
    color: var(--blanco);
    border-color: rgba(255,255,255,0.4);
  }
  /* Pildoras de estado */
  .status-pill {
    padding: 4px 10px; border-radius: 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .status-pill.saved {
    background: rgba(0, 200, 83, 0.15);
    color: var(--verde);
    border: 1px solid rgba(0, 200, 83, 0.4);
  }
  .status-pill.locked {
    background: rgba(186, 202, 72, 0.12);
    color: var(--dorado);
    border: 1px solid rgba(186, 202, 72, 0.4);
  }
  .status-pill.missed {
    background: rgba(227, 6, 19, 0.15);
    color: #FFB3B8;
    border: 1px solid rgba(227, 6, 19, 0.4);
  }
  /* Banner de fase cerrada */
  .phase-locked-banner {
    background: rgba(186, 202, 72, 0.08);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--dorado);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.3px;
  }
  .match-card.predicted.locked {
    border-color: rgba(186, 202, 72, 0.4);
    background: linear-gradient(145deg, rgba(186, 202, 72, 0.04), #141414);
  }
  .points-badge {
    background: var(--verde); color: var(--negro);
    padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
  }
  .points-badge.zero { background: var(--gris-2); color: rgba(255,255,255,0.5); }
  .official-result {
    background: rgba(186, 202, 72, 0.1);
    border: 1px dashed var(--dorado);
    padding: 6px 10px; border-radius: 6px;
    font-size: 11px; color: var(--dorado); font-weight: 600;
  }
  /* Bloque de "pasa por penales" en eliminatorias */
  .pen-block {
    margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: rgba(255, 76, 76, 0.06); border: 1px solid rgba(255, 76, 76, 0.18);
  }
  .pen-label {
    font-size: 11px; font-weight: 800; color: #ffd4d4;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
  }
  .pen-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .pen-opt {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    font-size: 12px; color: #fff; transition: all 0.15s;
  }
  .pen-opt:hover { background: rgba(255, 76, 76, 0.12); border-color: rgba(255, 76, 76, 0.4); }
  .pen-opt.selected { background: rgba(255, 76, 76, 0.2); border-color: #ff4c4c; color: #fff; font-weight: 700; }
  .pen-opt input[type="radio"] { margin: 0; cursor: pointer; }
  .pen-hint { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 6px; font-style: italic; }
  .pen-display {
    margin-top: 6px; padding: 5px 10px; border-radius: 6px;
    background: rgba(255, 76, 76, 0.08); border: 1px dashed rgba(255, 76, 76, 0.3);
    font-size: 11px; color: #ffd4d4; font-weight: 600;
  }

  /* === RANKING === */
  .ranking-tabs {
    display: flex; gap: 4px;
    background: var(--gris);
    padding: 4px; border-radius: 10px;
    margin-bottom: 20px;
  }
  .ranking-tab {
    flex: 1; background: transparent; color: rgba(255,255,255,0.5);
    border: none; padding: 12px 8px; cursor: pointer;
    font-family: 'Anton', sans-serif;
    font-size: 13px; letter-spacing: 1.2px;
    border-radius: 6px; transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .ranking-tab small {
    font-size: 10px;
    opacity: 0.7;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0;
  }
  .ranking-tab.active { background: var(--rojo); color: var(--blanco); }
  .podium {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; align-items: end;
    margin-bottom: 24px; min-height: 200px;
  }
  .podium-spot {
    background: linear-gradient(180deg, var(--gris) 0%, #141414 100%);
    border: 2px solid var(--gris-2);
    border-radius: 12px 12px 0 0;
    padding: 16px 8px 12px; text-align: center;
    position: relative;
    animation: rise 0.6s ease-out backwards;
  }
  @keyframes rise {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .podium-spot.first {
    border-color: var(--dorado);
    background: linear-gradient(180deg, rgba(186, 202, 72, 0.2) 0%, #141414 100%);
    min-height: 200px; animation-delay: 0.4s;
  }
  .podium-spot.second {
    border-color: #C0C0C0;
    background: linear-gradient(180deg, rgba(192, 192, 192, 0.15) 0%, #141414 100%);
    min-height: 170px; animation-delay: 0.2s;
  }
  .podium-spot.third {
    border-color: #CD7F32;
    background: linear-gradient(180deg, rgba(205, 127, 50, 0.15) 0%, #141414 100%);
    min-height: 140px; animation-delay: 0s;
  }
  .podium-medal { font-size: 36px; display: block; margin-bottom: 6px; }
  .podium-name {
    font-weight: 700; font-size: 13px;
    margin-bottom: 4px; word-break: break-word;
  }
  .podium-points {
    font-family: 'Anton', sans-serif;
    font-size: 24px; color: var(--dorado);
  }
  .podium-cat {
    font-size: 9px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px; margin-top: 4px; text-transform: uppercase;
  }
  .ranking-list {
    background: var(--gris); border-radius: 12px; overflow: hidden;
  }
  .ranking-row {
    display: grid;
    grid-template-columns: 50px 1fr auto auto;
    align-items: center; padding: 14px 16px; gap: 12px;
    border-bottom: 1px solid var(--gris-2); transition: all 0.15s;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row:hover { background: var(--gris-2); }
  .ranking-row.me {
    background: rgba(252, 153, 53, 0.1);
    border-left: 3px solid var(--rojo);
  }
  .ranking-pos {
    font-family: 'Anton', sans-serif;
    font-size: 18px; color: rgba(255,255,255,0.5);
  }
  .ranking-user { font-weight: 600; font-size: 14px; }
  .ranking-username {
    font-weight: 600; font-size: 14px;
    line-height: 1.2;
  }
  .ranking-sector {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.3px;
    margin-top: 2px;
    font-weight: 400;
  }
  .ranking-tags {
    display: flex; flex-direction: column; gap: 3px;
    align-items: flex-end;
  }
  .ranking-cat-tag {
    font-size: 9px; background: var(--gris-2);
    padding: 3px 8px; border-radius: 8px;
    letter-spacing: 1px; color: rgba(255,255,255,0.6); text-transform: uppercase;
    white-space: nowrap;
  }
  .ranking-cat-tag.fc {
    background: rgba(252, 153, 53, 0.25);
    color: var(--celeste);
    border: 1px solid rgba(252, 153, 53, 0.4);
  }
  .ranking-cat-tag.pe {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .ranking-cat-tag.wp {
    background: rgba(186, 202, 72, 0.15);
    color: var(--dorado);
    letter-spacing: 0.5px;
  }
  .podium-wp {
    font-size: 9px;
    color: var(--dorado);
    letter-spacing: 0.5px;
    margin-top: 2px;
    opacity: 0.85;
  }
  .ranking-pts {
    font-family: 'Anton', sans-serif;
    font-size: 22px; color: var(--dorado);
    min-width: 60px; text-align: right;
  }

  /* === REGLAS / CARDS === */
  .rules-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 24px; margin-bottom: 16px;
  }
  .rules-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 1.5px;
    color: var(--dorado); margin-bottom: 16px;
  }
  .rule-item {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 12px;
    font-size: 14px; line-height: 1.5;
  }
  .rule-points {
    background: var(--rojo); color: var(--blanco);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 14px; flex-shrink: 0;
  }
  .empty-state {
    text-align: center; padding: 40px 20px;
    color: rgba(255,255,255,0.4);
  }
  /* Tabla de resultados oficiales con timestamps (Transparencia) */
  .results-audit { display: flex; flex-direction: column; gap: 6px; }
  .results-audit-row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 12px; align-items: center;
    padding: 10px 12px;
    background: rgba(255,255,255,0.035); border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .results-audit-match { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .results-audit-match strong { font-size: 13px; color: #fff; }
  .results-audit-id { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.5px; }
  .results-audit-score { font-weight: 900; font-size: 16px; color: #ffd0a8; white-space: nowrap; }
  .results-audit-when { font-size: 11px; color: rgba(255,255,255,0.6); white-space: nowrap; }
  @media (max-width: 600px) {
    .results-audit-row { grid-template-columns: 1fr auto; row-gap: 4px; }
    .results-audit-when { grid-column: 1 / -1; font-size: 10px; }
  }
  /* Auditoría de actividad por usuario */
  .audit-users-list { display: flex; flex-direction: column; gap: 4px; }
  .audit-users-row {
    display: grid; grid-template-columns: 1.5fr 1fr 1.5fr; gap: 12px;
    align-items: center;
    padding: 8px 12px; font-size: 12.5px;
    background: rgba(255,255,255,0.03); border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .audit-users-head {
    background: transparent; border: none; padding: 2px 12px 4px;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); font-weight: 700;
  }
  .audit-users-name { color: #fff; font-weight: 700; display: flex; flex-direction: column; min-width: 0; }
  .audit-users-username { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 400; }
  .audit-users-count { text-align: right; color: #ffd0a8; font-weight: 800; }
  .audit-users-when { text-align: right; color: rgba(255,255,255,0.7); white-space: nowrap; font-size: 11.5px; }
  .audit-phase-chips {
    grid-column: 1 / -1;
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 4px; padding-top: 6px;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }
  .audit-phase-chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: rgba(255,138,76,0.10);
    border: 1px solid rgba(255,138,76,0.22);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 10.5px;
  }
  .audit-phase-label {
    font-weight: 800; letter-spacing: 0.3px; color: #ffd0a8;
    text-transform: uppercase; font-size: 9.5px;
  }
  .audit-phase-when { color: rgba(255,255,255,0.85); white-space: nowrap; }
  @media (max-width: 600px) {
    .audit-users-row { grid-template-columns: 1fr auto; row-gap: 4px; }
    .audit-users-head { display: none; }
    .audit-users-when { grid-column: 1 / -1; text-align: left; font-size: 10.5px; }
    .audit-phase-chip { font-size: 10px; padding: 2px 6px; }
    .audit-phase-label { font-size: 9px; }
  }
  .empty-state .icon {
    font-size: 56px; display: block; margin-bottom: 12px; opacity: 0.5;
  }

  /* === CAMPEÓN / SUBCAMPEÓN === */
  .champion-card {
    background: linear-gradient(145deg, rgba(186, 202, 72, 0.08), #0f0f0f);
    border: 2px solid rgba(186, 202, 72, 0.3);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .champion-card::after {
    content: ''; position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(186, 202, 72, 0.15), transparent 70%);
    pointer-events: none;
  }
  .champion-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
  }
  .champion-trophy {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--dorado), var(--dorado-dark));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 14px rgba(186, 202, 72, 0.5);
    flex-shrink: 0;
  }
  .champion-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 2px;
    color: var(--dorado);
    line-height: 1;
  }
  .champion-subtitle {
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 1.5px;
    margin-top: 4px; text-transform: uppercase;
  }
  .champion-select-wrap {
    background: var(--negro);
    border: 2px solid var(--gris-2);
    border-radius: 10px;
    padding: 4px;
    position: relative;
    z-index: 1;
  }
  .champion-select-wrap select {
    width: 100%;
    background: transparent;
    color: var(--blanco);
    border: none;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23BACA48'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 22px;
    padding-right: 38px;
  }
  .champion-select-wrap select:focus { outline: none; }
  .champion-select-wrap select option {
    background: var(--gris); color: var(--blanco);
  }
  .champion-current {
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
    position: relative; z-index: 1;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .champion-current.saved {
    background: rgba(0, 200, 83, 0.1);
    border-color: rgba(0, 200, 83, 0.4);
  }
  .champion-current.locked {
    background: rgba(186, 202, 72, 0.08);
    border-color: rgba(186, 202, 72, 0.4);
  }
  .champion-current img {
    width: 44px; height: 32px; border-radius: 4px; object-fit: cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .champion-current-name {
    font-weight: 700; font-size: 16px;
    flex: 1;
  }
  .champion-current .status-pill {
    margin-left: auto;
  }
  .champion-info-banner {
    background: rgba(186, 202, 72, 0.08);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: rgba(186, 202, 72, 0.9);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .champion-info-banner strong { color: var(--dorado); }

  .admin-banner {
    background: linear-gradient(90deg, rgba(186, 202, 72, 0.15), transparent);
    border: 1px solid var(--dorado);
    padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 13px;
  }
  .admin-banner strong { color: var(--dorado); }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--verde); color: var(--negro);
    padding: 12px 24px; border-radius: 30px;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    box-shadow: 0 8px 24px rgba(0, 200, 83, 0.4);
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-transform: uppercase;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error {
    background: #E30613; color: var(--blanco);
    box-shadow: 0 8px 24px rgba(227, 6, 19, 0.4);
  }

  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === RESPONSIVE === */
  @media (max-width: 640px) {
    .header-content { flex-direction: column; gap: 10px; }
    .logo-text { font-size: 18px; }
    .logo-img { height: 40px; }
    .logo-gg { height: 28px; }
    .logo-carrefour { height: 52px; }
    .logo-divider { height: 32px; }
    .powered-by-logo { height: 30px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .match-row { gap: 6px; }
    .team-name { font-size: 12px; }
    .team-flag, .team-flag-placeholder { width: 30px; height: 22px; }
    .score-input { width: 38px; height: 38px; font-size: 18px; }
    .podium { gap: 4px; }
    .podium-spot { padding: 10px 4px 8px; }
    .podium-medal { font-size: 28px; }
    .podium-points { font-size: 18px; }
    .podium-name { font-size: 11px; }
    .ranking-row { grid-template-columns: 36px 1fr auto; padding: 12px; gap: 8px; }
    .ranking-tags { display: none; }
    .ranking-tab { font-size: 11px; padding: 10px 4px; letter-spacing: 0.5px; }
    .ranking-tab small { font-size: 9px; }
    .container { padding: 16px 12px 40px; }
    .auth-card { padding: 28px 20px; }
    .auth-title { font-size: 26px; }
    .auth-logo { height: 130px; width: auto; }
    .tab { font-size: 12px; padding: 10px 14px; }
    .champion-title { font-size: 17px; }
  }
  /* === SEDE / CITY PICKER === */
  .city-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .city-option {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 14px 8px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    cursor: pointer; transition: all 0.18s ease; min-height: 88px; opacity: 0.7;
  }
  .city-emoji { font-size: 22px; }
  .city-name { font-size: 11.5px; letter-spacing: 0.4px; text-transform: uppercase; color: rgba(255,255,255,0.85); font-weight: 700; text-align: center; }
  .city-option:hover { border-color: rgba(255,138,76,0.5); opacity: 0.95; }
  .city-option.selected {
    border-color: var(--naranja, #ff8a4c);
    background: rgba(255,138,76,0.10);
    box-shadow: 0 0 0 2px rgba(255,138,76,0.18);
    opacity: 1;
  }

  /* === COMMENTS PANEL === */
  .comments-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 800;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff8a4c, #ff6a2c);
    color: #fff; font-size: 22px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(255,138,76,0.45);
    transition: transform 0.18s ease;
  }
  .comments-fab:hover { transform: scale(1.05); }
  .comments-fab .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--rojo, #c0392b); color: #fff; font-size: 10px;
    border-radius: 10px; padding: 2px 6px; font-weight: 800;
  }
  .comments-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
    background: linear-gradient(180deg, #15102a 0%, #0c0820 100%);
    border-left: 1px solid rgba(255,138,76,0.18);
    box-shadow: -20px 0 60px rgba(0,0,0,0.45);
    z-index: 850; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.32s cubic-bezier(0.2,0.8,0.2,1);
  }
  .comments-panel.open { transform: translateX(0); }
  .comments-header {
    padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .comments-header h3 { margin: 0; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #ffd0a8; }
  .comments-close { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 22px; cursor: pointer; }
  .comments-list { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .comment-card {
    background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .comment-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .comment-name { font-weight: 800; font-size: 13px; color: #fff; }
  .comment-meta { font-size: 10px; color: rgba(255,255,255,0.45); margin-left: auto; }
  .comment-body { font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.88); word-wrap: break-word; }
  .comment-tag {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 5px;
    background: rgba(255,138,76,0.16); color: #ffb98a; border: 1px solid rgba(255,138,76,0.3);
  }
  .comment-tag.carrefour { background: rgba(0,113,206,0.16); color: #8ec8ff; border-color: rgba(0,113,206,0.3); }
  .comment-tag.sede { background: rgba(186,202,72,0.14); color: #d6e394; border-color: rgba(186,202,72,0.28); }
  .comment-edited { font-size: 10px; color: rgba(255,255,255,0.45); font-style: italic; margin-left: 2px; }
  .comment-actions {
    display: inline-flex; gap: 4px;
    margin-left: auto; opacity: 0.55; transition: opacity 0.15s ease;
  }
  .comment-card:hover .comment-actions { opacity: 1; }
  .comment-action-btn {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #fff; border-radius: 6px; padding: 2px 7px; cursor: pointer;
    font-size: 12px; line-height: 1.1;
  }
  .comment-action-btn:hover { background: rgba(255,138,76,0.15); border-color: rgba(255,138,76,0.4); }
  .comment-edit-form { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .comment-edit-input {
    width: 100%; resize: vertical; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,0.06); color: #fff;
    border: 1px solid rgba(255,138,76,0.4);
    font-family: inherit; font-size: 13px; min-height: 50px; max-height: 200px;
    box-sizing: border-box;
  }
  .comment-edit-buttons { display: flex; gap: 6px; justify-content: flex-end; }
  .comment-edit-save { background: var(--naranja, #ff8a4c); border-color: var(--naranja, #ff8a4c); color: #fff; font-weight: 700; }
  .comment-edit-cancel { color: rgba(255,255,255,0.7); }
  .comment-card.editing { border-color: rgba(255,138,76,0.35); background: rgba(255,138,76,0.05); }
  .comment-footer { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .comment-like-btn, .comment-likers-btn, .comment-reply-btn {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.75); border-radius: 14px; padding: 3px 9px; cursor: pointer;
    font-size: 11px; line-height: 1.2; display: inline-flex; align-items: center; gap: 4px;
    font-family: inherit;
  }
  .comment-like-btn:hover, .comment-likers-btn:hover, .comment-reply-btn:hover {
    background: rgba(255,138,76,0.12); border-color: rgba(255,138,76,0.35); color: #fff;
  }
  .comment-like-btn.liked {
    background: rgba(255,76,108,0.14); border-color: rgba(255,76,108,0.4); color: #ffb6c4;
  }
  .comment-like-btn.liked:hover { background: rgba(255,76,108,0.22); border-color: rgba(255,76,108,0.55); }
  .comment-likes-count { font-weight: 700; }
  .comment-reply-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .comment-depth-0 { margin-left: 0; }
  .comment-depth-1 { margin-left: 18px; border-left: 2px solid rgba(255,138,76,0.18); padding-left: 10px; }
  .comment-depth-2 { margin-left: 18px; border-left: 2px solid rgba(255,138,76,0.16); padding-left: 10px; }
  .comment-depth-3 { margin-left: 18px; border-left: 2px solid rgba(255,138,76,0.14); padding-left: 10px; }
  .comment-depth-4 { margin-left: 18px; border-left: 2px solid rgba(255,138,76,0.12); padding-left: 10px; }
  .comment-depth-5 { margin-left: 18px; border-left: 2px solid rgba(255,138,76,0.10); padding-left: 10px; }
  .comment-card.comment-depth-1, .comment-card.comment-depth-2,
  .comment-card.comment-depth-3, .comment-card.comment-depth-4,
  .comment-card.comment-depth-5 { background: rgba(255,255,255,0.025); }
  .comments-form { padding: 10px 14px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; gap: 6px; }
  .comments-form textarea {
    flex: 1; resize: none; padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.04); color: #fff; border: 1px solid rgba(255,255,255,0.1);
    font-family: inherit; font-size: 13px; min-height: 42px; max-height: 100px;
  }
  .comments-form button {
    background: var(--naranja, #ff8a4c); color: #fff; border: none;
    border-radius: 10px; padding: 0 14px; font-weight: 800; cursor: pointer;
    font-size: 13px;
  }
  .comments-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (max-width: 600px) {
    .comments-panel { width: 100%; }
    .comments-fab { right: 14px; bottom: 14px; }
  }

  /* === LIVE WIDGET === */
  .live-widget {
    background: linear-gradient(135deg, rgba(204, 41, 54, 0.18), rgba(204, 41, 54, 0.04));
    border: 1px solid rgba(204, 41, 54, 0.45);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .live-widget.next { background: linear-gradient(135deg, rgba(186,202,72,0.12), rgba(186,202,72,0.03)); border-color: rgba(186,202,72,0.35); }
  .live-widget-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: #ff8a8a;
  }
  .live-widget.next .live-widget-title { color: #d6e394; }
  .live-widget-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3838;
    animation: liveDot 1.2s ease-in-out infinite;
  }
  .live-widget.next .live-widget-title .dot { background: #bacab8; animation: none; }
  @keyframes liveDot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; font-size: 13px;
  }
  .live-row + .live-row { border-top: 1px solid rgba(255,255,255,0.06); }
  .live-teams { font-weight: 700; flex: 1; min-width: 0; }
  .live-score { font-weight: 900; font-size: 16px; color: #ffd0a8; white-space: nowrap; }
  .live-minute { font-size: 11px; color: rgba(255,255,255,0.6); }
  .live-countdown { font-weight: 900; color: #d6e394; }

  /* === CONFETTI === */
  .confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9000; }

  /* Shake + borde rojo para campo en error (ej: username ya tomado) */
  .field-error-flash {
    border-color: #ff3838 !important;
    box-shadow: 0 0 0 3px rgba(255,56,56,0.25) !important;
    animation: fieldShake 0.45s ease;
  }
  @keyframes fieldShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .field-error-flash { animation: none; }
  }

  /* === 3-COL APP SHELL: sidebars + content === */
  .app-shell {
    display: flex; gap: 16px;
    max-width: 1500px; margin: 0 auto;
    padding: 0 16px;
    align-items: flex-start;
  }
  .app-shell .container {
    flex: 1; min-width: 0;
    max-width: none; margin: 0;
    padding: 16px 8px 60px;
  }
  .sidebar {
    width: 280px; flex-shrink: 0;
    position: sticky; top: 12px;
    max-height: calc(100vh - 24px);
    display: flex; flex-direction: column; gap: 12px;
  }
  .sidebar-right { width: 340px; height: calc(100vh - 24px); max-height: calc(100vh - 24px); }
  .side-block {
    background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
    padding: 12px 12px 10px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,138,76,0.85); font-weight: 800; margin-bottom: 8px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .side-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3838;
    animation: liveDot 1.2s ease-in-out infinite;
  }
  .upcoming-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 0; font-size: 12.5px;
  }
  .upcoming-row + .upcoming-row { border-top: 1px solid rgba(255,255,255,0.05); }
  .upcoming-teams { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upcoming-countdown { font-size: 11px; color: #d6e394; font-weight: 800; white-space: nowrap; }
  .side-empty { font-size: 12px; color: rgba(255,255,255,0.45); text-align: center; padding: 14px 0; }

  /* Cronograma Argentina */
  .arg-match {
    padding: 9px 0 9px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .arg-match:first-of-type { border-top: none; padding-top: 4px; }
  .arg-match-teams { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .arg-match-teams strong { color: #74acdf; }
  .arg-match-meta { font-size: 11px; color: rgba(255,255,255,0.6); }
  .arg-match-tv { font-size: 10.5px; color: #d6e394; margin-top: 2px; letter-spacing: 0.3px; }
  .arg-match-note { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 8px; font-style: italic; line-height: 1.35; }
  .arg-match-phase { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: rgba(116,172,223,0.85); font-weight: 700; margin-bottom: 2px; }
  .arg-match-phase strong { color: #d6e394; }
  .arg-match-next { background: rgba(116,172,223,0.1); border: 1px solid rgba(116,172,223,0.35); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .arg-match-next.arg-match { border-top: 1px solid rgba(116,172,223,0.35); }
  .arg-match-result { font-size: 11px; color: #7bd97b; font-weight: 800; margin-top: 2px; }
  /* Sponsor side block — Viva la Vida */
  .sponsor-side-block { padding: 0; overflow: hidden; border-color: rgba(236,29,140,0.35); }
  .sponsor-side-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,138,76,0.85); font-weight: 800;
    padding: 10px 12px 0; display: block;
  }
  .sponsor-side-img-wrap {
    display: block; margin: 8px 12px 10px; border-radius: 10px; overflow: hidden;
    background: #ec1d8c; line-height: 0;
  }
  .sponsor-side-img { display: block; width: 100%; height: auto; }
  .sponsor-side-img-fallback {
    display: none; padding: 26px 14px; text-align: center;
    color: #fff; font-weight: 800; letter-spacing: 1.2px; font-size: 13px;
  }
  .sponsor-side-img.errored { display: none; }
  .sponsor-side-img.errored + .sponsor-side-img-fallback { display: block; }
  .sponsor-side-ctas { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 12px; }
  .sponsor-side-cta {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border-radius: 8px;
    font-family: inherit; font-weight: 700; font-size: 11.5px; letter-spacing: 0.3px;
    text-decoration: none; transition: background 0.18s ease, transform 0.18s ease;
  }
  .sponsor-side-cta:hover { transform: translateY(-1px); }
  .sponsor-side-cta-ig { background: #fff; color: #ec1d8c; }
  .sponsor-side-cta-ig:hover { background: #ffe2f1; }
  .sponsor-side-cta-wa { background: #25d366; color: #fff; }
  .sponsor-side-cta-wa:hover { background: #1ebe5d; }

  /* Partidos de hoy */
  .today-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 0; font-size: 12.5px;
  }
  .today-row + .today-row { border-top: 1px solid rgba(255,255,255,0.05); }
  .today-teams { font-weight: 700; color: #fff; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .today-vs { color: rgba(255,255,255,0.45); font-weight: 500; font-size: 11px; margin: 0 3px; }
  .today-status { font-size: 11px; font-weight: 800; white-space: nowrap; }
  .today-live { color: #ff8a8a; animation: liveDot 1.4s ease-in-out infinite; }
  .today-done { color: rgba(255,255,255,0.45); }
  .today-upcoming { color: #d6e394; }

  /* Sidebar right: comments inline */
  .comments-side { display: flex; flex-direction: column; min-height: 0; height: 100%; }
  .comments-side .comments-header { padding: 4px 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
  .comments-side .comments-header h3 { margin: 0; font-size: 13px; letter-spacing: 2px; color: #ffd0a8; }
  .comments-side .comments-list { flex: 1 1 auto; overflow-y: auto; padding: 0 2px; display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
  .comments-side .comments-form { padding: 0 0 10px; border-top: 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-top: 0; margin-bottom: 10px; }

  /* Tabs visibles solo en mobile */
  .tab.mobile-only { display: none; }

  @media (max-width: 1099px) {
    .sidebar { display: none; }
    .tab.mobile-only { display: inline-flex; }
    .app-shell { padding: 0; }
  }
  /* Cuando estamos en mobile y la vista 'comments'/'live' está activa,
     el contenedor del tab usa todo el ancho */
  .tab-fullview { padding: 12px 16px; }
  .tab-fullview .comments-side { height: 88vh; }
  .tab-fullview .comments-list { max-height: 82vh; }

  /* === SPLASH / INTRO (logo GG CUP + botón Entrar + música) === */
  .splash-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 28px 18px;
    background: radial-gradient(ellipse at center, #1a1530 0%, #0a0518 65%, #000 100%);
    transition: opacity 0.7s ease;
  }
  .splash-overlay.dismissed { opacity: 0; pointer-events: none; }
  .splash-logo {
    max-width: min(80vw, 520px);
    max-height: 62vh;
    object-fit: contain;
    filter: drop-shadow(0 0 28px rgba(255, 138, 76, 0.35));
    animation: splashLogoIn 1.2s cubic-bezier(0.2,0.8,0.2,1) backwards;
    transition: transform 0.9s cubic-bezier(0.2,0.8,0.2,1), filter 0.9s ease;
    will-change: transform, filter;
  }
  .splash-overlay.exploding .splash-logo {
    transform: scale(2.4);
    filter: drop-shadow(0 0 90px rgba(255, 210, 130, 0.95)) drop-shadow(0 0 30px rgba(255, 138, 76, 0.7));
  }
  @keyframes splashLogoIn {
    0%   { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  .splash-tagline {
    color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; text-align: center; margin: 0;
    animation: splashFadeUp 1.0s 0.5s cubic-bezier(0.2,0.8,0.2,1) backwards;
  }
  .splash-overlay.exploding .splash-tagline { opacity: 0; transition: opacity 0.35s ease; }
  .splash-enter-btn {
    font-family: inherit; font-size: 15px; font-weight: 900; letter-spacing: 3px;
    padding: 16px 52px; border: 2px solid #ff8a4c; color: #ffd0a8;
    background: linear-gradient(135deg, rgba(255,138,76,0.18), rgba(255,138,76,0.05));
    border-radius: 32px; cursor: pointer; text-transform: uppercase;
    animation: splashFadeUp 1.0s 0.8s cubic-bezier(0.2,0.8,0.2,1) backwards,
               splashPulse 1.9s 2s infinite;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .splash-enter-btn:hover { transform: translateY(-2px) scale(1.02); background: linear-gradient(135deg, rgba(255,138,76,0.28), rgba(255,138,76,0.10)); }
  .splash-enter-btn:active { transform: translateY(0) scale(0.98); }
  .splash-overlay.exploding .splash-enter-btn {
    opacity: 0; transform: scale(0.85);
    transition: opacity 0.3s ease, transform 0.3s ease;
    animation: none;
  }
  @keyframes splashFadeUp {
    0%   { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes splashPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,76,0.55); }
    50%      { box-shadow: 0 0 0 18px rgba(255,138,76,0); }
  }
  @media (max-width: 480px) {
    .splash-logo { max-width: 88vw; max-height: 55vh; }
    .splash-enter-btn { padding: 14px 40px; font-size: 14px; letter-spacing: 2.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash-logo, .splash-tagline, .splash-enter-btn { animation: none !important; }
    .splash-overlay.exploding .splash-logo { transform: none; }
  }
  /* Modal publicitario Viva la Vida */
  .promo-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.62);
    display: flex; align-items: center; justify-content: center;
    z-index: 9998; padding: 20px; box-sizing: border-box;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
    backdrop-filter: blur(2px);
  }
  .promo-modal-overlay.visible { opacity: 1; pointer-events: auto; }
  .promo-modal-card {
    position: relative; width: 280px; max-width: 90vw;
    background: #ec1d8c; border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    overflow: hidden;
    transform: scale(0.92) translateY(8px); opacity: 0;
    transition: transform 0.38s cubic-bezier(0.2,0.8,0.2,1), opacity 0.32s ease;
  }
  .promo-modal-overlay.visible .promo-modal-card { transform: scale(1) translateY(0); opacity: 1; }
  .promo-modal-img { display: block; width: 100%; height: auto; user-select: none; }
  .promo-modal-fallback {
    display: none; padding: 36px 20px; text-align: center;
    color: #fff; font-weight: 800; letter-spacing: 1.5px; font-size: 14px;
    background: #ec1d8c;
  }
  .promo-modal-fallback small { display: block; font-size: 11px; opacity: 0.85; margin-top: 6px; letter-spacing: 0.5px; font-weight: 600; }
  .promo-modal-img.errored { display: none; }
  .promo-modal-img.errored + .promo-modal-fallback { display: block; }
  .promo-modal-cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; box-sizing: border-box; padding: 13px 16px;
    background: #fff; color: #ec1d8c; text-decoration: none;

// DEADLINES POR FASE — se cierra al inicio del primer partido de la fase
// =================================================================
// Devuelve un Date con el inicio del primer partido de la fase dada (en hora ARG / UTC-3)
function phaseDeadline(phase) {
  // Preferí siempre la deadline del backend (fuente de verdad)
  const iso = state.cache.deadlinesUtc[phase];
  if (iso) return new Date(iso);
  // Fallback (antes de que la API responda): cálculo local
  const phMatches = FIXTURE.filter(m => m.phase === phase);
  if (phMatches.length === 0) return null;
  // Ordenar por fecha+hora y tomar el primero
  const sorted = phMatches.slice().sort((a, b) => {
    const ta = a.date + 'T' + (a.time || '00:00');
    const tb = b.date + 'T' + (b.time || '00:00');
    return ta.localeCompare(tb);
  });
  const first = sorted[0];
  // Construir Date interpretando como hora ARG (UTC-3)
  return new Date(`${first.date}T${first.time || '00:00'}:00-03:00`);
}

// True si la fase ya está cerrada (su primer partido ya empezó)
function isPhaseLocked(phase) {
  const dl = phaseDeadline(phase);
  if (!dl) return false;
  return Date.now() >= dl.getTime();
}

// Deadline INDIVIDUAL de cada partido = kickoff − 1h. Es la fuente de verdad
// para decidir si una card está editable. El backend hace el mismo cálculo
// en /api/fixtures.match_deadlines_utc y nos lo cachea.
function matchDeadline(matchId) {
  const iso = state.cache && state.cache.matchDeadlinesUtc && state.cache.matchDeadlinesUtc[matchId];
  if (iso) return new Date(iso);
  // Fallback local (antes de que la API responda): calculamos desde el FIXTURE
  const m = FIXTURE.find(x => x.id === matchId);
  if (!m) return null;
  const ko = new Date(`${m.date}T${m.time || '00:00'}:00-03:00`);
  return new Date(ko.getTime() - 60 * 60 * 1000);
}

function isMatchLocked(matchId) {
  const dl = matchDeadline(matchId);
  if (!dl) return false;
  return Date.now() >= dl.getTime();
}

// Deadline del campeón/subcampeón = 1h antes del primer partido del Mundial.
// Usa la respuesta del backend; si aún no está, calcula local.
function finalPickDeadline() {
  const iso = state.cache && state.cache.finalPickDeadlineUtc;
  if (iso) return new Date(iso);
  let earliest = null;
  for (const m of FIXTURE) {
    const ko = (typeof _matchKickoffMs === 'function')
      ? _matchKickoffMs(m)
      : new Date(`${m.date}T${m.time || '00:00'}:00-03:00`).getTime();
    if (Number.isFinite(ko) && (earliest === null || ko < earliest)) earliest = ko;
  }
  return earliest === null ? null : new Date(earliest - 60 * 60 * 1000);
}

function isFinalPickLocked() {
  const dl = finalPickDeadline();
  return dl ? Date.now() >= dl.getTime() : false;
}

// Formatea un Date como "dom 11 jun · 16:00 hs"
function fmtDeadline(d) {
  if (!d) return '';
  const fecha = d.toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short' });
  const hora = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'America/Argentina/Buenos_Aires' });
  return `${fecha} · ${hora} hs`;
}

const API_BASE = (
  window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8000'
    : window.location.origin
);

function getToken() { return localStorage.getItem('prode_token'); }
function setToken(t) { localStorage.setItem('prode_token', t); }
function clearAuth() {
  localStorage.removeItem('prode_token');
  localStorage.removeItem('prode_user');
}

async function apiFetch(endpoint, options = {}) {
  const token = getToken();
  const headers = {
    'Content-Type': 'application/json',
    ...(token && { 'Authorization': `Bearer ${token}` }),
    ...(options.headers || {})
  };
  let response;
  try {
    response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  } catch (e) {
    const err = new Error('No se pudo conectar al servidor');
    err.status = 0;
    throw err;
  }

  if (response.status === 401) {
    clearAuth();
    location.reload();
    return;
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(data.detail || `Error ${response.status}`);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

// Debounce sencillo por key
function debounce(key, fn, ms = 500) {
  if (state.pendingTimers[key]) clearTimeout(state.pendingTimers[key]);
  state.pendingTimers[key] = setTimeout(() => {
    delete state.pendingTimers[key];
    fn();
  }, ms);
}

function setButtonBusy(id, busyText) {
  const btn = document.getElementById(id);
  if (!btn) return null;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyText;
  return () => { btn.disabled = false; btn.textContent = original; };
}

// Mismo cálculo que backend/app/scoring.py (3 exacto / 1 mismo signo / 0)
function calcPoints(prediction, official, matchOrId) {
  if (!prediction || !official) return 0;
  if (prediction.home == null || prediction.away == null) return 0;
  if (official.home == null || official.away == null) return 0;
  const pH = +prediction.home, pA = +prediction.away;
  const oH = +official.home, oA = +official.away;

  // Detectar si es knockout. matchOrId puede ser el objeto match o un id string.
  let match = null;
  if (matchOrId && typeof matchOrId === 'object') match = matchOrId;
  else if (typeof matchOrId === 'string') match = FIXTURE.find(m => m.id === matchOrId);
  const isKnockout = match && match.phase && match.phase !== 'grupos';

  if (isKnockout) {
    const homeTla = (match.home || '').toUpperCase();
    const awayTla = (match.away || '').toUpperCase();
    const pPw = (prediction.penalty_winner || '').toUpperCase() || null;
    const oPw = (official.penalty_winner || '').toUpperCase() || null;
    let exact = (pH === oH && pA === oA);
    if (exact && pH === pA) {
      // Empate exacto: requiere también acertar penalty_winner
      exact = (pPw && oPw && pPw === oPw);
    }
    const passer = (h, a, pw) => h > a ? homeTla : (a > h ? awayTla : (pw || null));
    const pred_passer = passer(pH, pA, pPw);
    const off_passer = passer(oH, oA, oPw);
    if (exact) return 3;
    if (pred_passer && off_passer && pred_passer === off_passer) return 1;
    return 0;
  }

  // Grupos
  if (pH === oH && pA === oA) return 3;
  const sign = (x) => x > 0 ? 1 : (x < 0 ? -1 : 0);
  if (sign(pH - pA) === sign(oH - oA)) return 1;
  return 0;
}

function bindAuth() {
  document.getElementById('modeLogin').onclick = () => { state.authMode = 'login'; render(); };
  document.getElementById('modeReg').onclick = () => { state.authMode = 'register'; render(); };

  if (state.authMode === 'login') {
    document.getElementById('btnLogin').onclick = handleLogin;
    document.getElementById('loginPwd').onkeydown = (e) => { if (e.key === 'Enter') handleLogin(); };
  } else {
    function _reRenderRegPreservingInputs() {
      const snapshot = {};
      ['regUser','regDisplay','regDni','regEmail','regSector','regPwd'].forEach(id => {
        const el = document.getElementById(id);
        if (el) snapshot[id] = el.value;
      });
      render();
      Object.entries(snapshot).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) el.value = val;
      });
    }
    document.querySelectorAll('.company-option').forEach(opt => {
      opt.onclick = () => {
        const company = opt.dataset.company;
        const changed = state.regCompany !== company;
        if (changed) {
          state.regCompany = company;
          state.regCity = null; // forzar re-elección de sede al cambiar empresa
        }
        if (changed) confetti({ intensity: 'small', palette: company });
        _reRenderRegPreservingInputs();
      };
    });
    document.querySelectorAll('.city-option').forEach(opt => {
      opt.onclick = () => {
        state.regCity = opt.dataset.city;
        _reRenderRegPreservingInputs();
      };
    });
    const btnReg = document.getElementById('btnReg');
    if (btnReg) btnReg.onclick = handleRegister;
    const pwdEl = document.getElementById('regPwd');
    if (pwdEl) pwdEl.onkeydown = (e) => { if (e.key === 'Enter') handleRegister(); };
  }
}

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  if (box) box.innerHTML = `<div class="alert ${type === 'success' ? 'success' : ''}">${msg}</div>`;
}

async function handleLogin() {
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const pwd = document.getElementById('loginPwd').value;
  if (!username || !pwd) { showAlert('Completá usuario y contraseña'); return; }
  const reset = setButtonBusy('btnLogin', 'Ingresando...');
  try {
    const res = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password: pwd })
    });
    setToken(res.access_token);
    localStorage.setItem('prode_user', JSON.stringify(res.user));
    state.currentUser = res.user;
    await loadAppData();
    _routeAfterLoad();
    startBackgroundPolling();
    refreshMyStandings();
    showToast('¡Bienvenido, ' + (res.user.display_name || res.user.username) + '!');
    confetti({ intensity: 'big', palette: 'prode' });
    render();
    _handlePostLoginEffects();
  } catch (e) {
    showAlert(e.message || 'Error al ingresar');
  } finally {
    if (reset) reset();
  }
}

function mapRegisterError(e) {
  if (e && e.status === 409 && e.message) {
    const m = e.message.toLowerCase();
    if (m.includes('dni')) return { msg: 'Ya hay alguien registrado con ese DNI', field: 'regDni' };
    if (m.includes('email')) return { msg: 'Ese email ya está en uso', field: 'regEmail' };
    if (m.includes('username')) return { msg: '⚠️ Ese nombre de usuario ya está tomado, elegí otro', field: 'regUser' };
    return { msg: e.message };
  }
  if (e && e.status === 422) {
    const errs = e.data && e.data.errors;
    if (Array.isArray(errs) && errs.length) {
      const first = errs[0];
      const field = (first.loc || []).slice(-1)[0] || 'campo';
      return { msg: `Dato inválido en "${field}": ${first.msg}` };
    }
  }
  return { msg: (e && e.message) || 'Error al registrar' };
}

function flashFieldError(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('field-error-flash');
  setTimeout(() => el.classList.remove('field-error-flash'), 1600);
  try { el.focus({ preventScroll: true }); el.select && el.select(); } catch (e) {}
}

async function handleRegister() {
  const company = state.regCompany;
  const city = state.regCity;
  if (!company) { showAlert('Elegí una empresa primero'); return; }
  if (!city) { showAlert('Elegí tu sede (Isidro Casanova o Esteban Echeverría)'); return; }

  const username = (document.getElementById('regUser').value || '').trim().toLowerCase();
  const displayName = (document.getElementById('regDisplay').value || '').trim();
  const dniRaw = (document.getElementById('regDni').value || '');
  const email = (document.getElementById('regEmail').value || '').trim().toLowerCase();
  const sector = (document.getElementById('regSector').value || '').trim();
  const pwd = document.getElementById('regPwd').value || '';

  // Normalizar DNI: solo dígitos (saca puntos, espacios, guiones)
  const dni = dniRaw.replace(/\D/g, '');

  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    showAlert('Usuario inválido: solo minúsculas, números y _ (3-30 caracteres)'); return;
  }
  if (displayName.length < 3) { showAlert('Ingresá nombre y apellido (mín. 3 caracteres)'); return; }
  if (!/^\d{7,10}$/.test(dni)) { showAlert('DNI inválido: 7 a 10 dígitos'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Email inválido'); return; }
  if (sector.length < 2) { showAlert('Completá tu sector'); return; }
  if (pwd.length < 8) { showAlert('La contraseña debe tener al menos 8 caracteres'); return; }

  const reset = setButtonBusy('btnReg', 'Creando cuenta...');
  try {
    const res = await apiFetch('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        username, password: pwd, display_name: displayName,
        dni, email, sector, company, city
      })
    });
    setToken(res.access_token);
    localStorage.setItem('prode_user', JSON.stringify(res.user));
    state.currentUser = res.user;
    state.regCompany = null;
    state.regCity = null;
    await loadAppData();
    _routeAfterLoad();
    startBackgroundPolling();
    refreshMyStandings();
    showToast('¡Cuenta creada! Bienvenido ' + (res.user.display_name || username));
    confetti({ intensity: 'big', palette: 'prode' });
    render();
    _handlePostLoginEffects();
  } catch (e) {
    const mapped = mapRegisterError(e);
    showAlert(mapped.msg);
    showToast(mapped.msg, 'error');
    if (mapped.field) flashFieldError(mapped.field);
  } finally {
    if (reset) reset();
  }
}

async function loadAppData() {
  try {
    const [fixturesData, predictions, finalPick, leaderboard, officialResults] = await Promise.all([
      apiFetch('/api/fixtures'),
      apiFetch('/api/predictions/me'),
      apiFetch('/api/final-pick/me'),
      apiFetch('/api/leaderboard'),
      apiFetch('/api/results').catch(() => []), // público; si falla, vacío
    ]);
    state.cache.deadlinesUtc = (fixturesData && fixturesData.deadlines_utc) || {};
    state.cache.matchDeadlinesUtc = (fixturesData && fixturesData.match_deadlines_utc) || {};
    state.cache.finalPickDeadlineUtc = fixturesData && fixturesData.final_pick_deadline_utc;
    // Overlay de asignaciones de cruces eliminatorios (16vos, octavos, etc).
    // El backend pobla esto automáticamente desde football-data.org cuando
    // FIFA define los enfrentamientos. Reemplaza los TBD del FIXTURE local
    // por equipos concretos y actualiza date/time/venue si difieren.
    const _knAssign = (fixturesData && fixturesData.knockout_assignments) || {};
    for (const m of FIXTURE) {
      const a = _knAssign[m.id];
      if (!a) continue;
      if (a.home) m.home = a.home;
      if (a.away) m.away = a.away;
      if (a.venue) m.venue = a.venue;
      if (a.datetime_utc) {
        m.datetime_utc = a.datetime_utc;
        // Re-derivar date/time en ART (UTC-3) para que la UI los muestre bien
        try {
          const d = new Date(a.datetime_utc.replace('Z', '+00:00'));
          const artMs = d.getTime() - 3 * 60 * 60 * 1000;
          const art = new Date(artMs);
          m.date = art.toISOString().slice(0, 10);
          m.time = art.toISOString().slice(11, 16);
        } catch (e) { /* ignore */ }
      }
    }

    const predMap = {};
    (predictions || []).forEach(p => {
      predMap[p.match_id] = { home: p.home_score, away: p.away_score, penalty_winner: p.penalty_winner || null };
    });
    state.cache.predictions = predMap;

    // Resultados oficiales: array {match_id, home_score, away_score, updated_at}
    // -> dict {match_id: {home, away}} para que el admin panel y el fixture
    // los pinten al toque (antes solo quedaban en RAM de la sesión del admin
    // y se "perdían" al recargar).
    const resultsMap = {};
    (officialResults || []).forEach(r => {
      resultsMap[r.match_id] = {
        home: r.home_score,
        away: r.away_score,
        penalty_winner: r.penalty_winner || null,
      };
    });
    state.cache.officialResults = resultsMap;

    state.cache.finalPick = finalPick
      ? { champion: finalPick.champion, runnerUp: finalPick.runner_up }
      : {};
    state.cache.leaderboard = leaderboard || [];
    _captureMyStats(leaderboard);
    state.cache.loaded = true;
  } catch (e) {
    showToast('Error cargando datos: ' + (e.message || ''), 'error');
  }
}

function _captureMyStats(rows) {
  if (!state.currentUser || !Array.isArray(rows)) return;
  const row = rows.find(r => r.username === state.currentUser.username);
  if (row) state.cache.myStats = row;
}

async function refreshLeaderboard() {
  const t = state.rankingType;
  let qs = '';
  if (t === 'grupo_gestion' || t === 'carrefour') qs = '?company=' + encodeURIComponent(t);
  else if (t === 'isidro_casanova' || t === 'esteban_echeverria') qs = '?city=' + encodeURIComponent(t);
  try {
    const rows = await apiFetch('/api/leaderboard' + qs) || [];
    state.cache.leaderboard = rows;
    _captureMyStats(rows);
  } catch (e) { /* no romper UI */ }
}

const _COMPANY_SHORT = { grupo_gestion: 'GG', carrefour: 'Carr' };
const _CITY_SHORT = { isidro_casanova: 'I.Cas', esteban_echeverria: 'Eche' };

function _findMyRow(rows, username) {
  if (!Array.isArray(rows)) return { pos: null, total: 0, row: null };
  const idx = rows.findIndex(r => r.username === username);
  return { pos: idx >= 0 ? idx + 1 : null, total: rows.length, row: idx >= 0 ? rows[idx] : null };
}

async function refreshMyStandings() {
  const u = state.currentUser;
  if (!u) return;
  try {
    const [general, company, city] = await Promise.all([
      apiFetch('/api/leaderboard'),
      apiFetch('/api/leaderboard?company=' + encodeURIComponent(u.company)),
      apiFetch('/api/leaderboard?city=' + encodeURIComponent(u.city)),
    ]);
    // Guardamos la lista general aparte para la pestaña de transparencia
    state.cache.leaderboardGeneral = Array.isArray(general) ? general : [];
    const gen = _findMyRow(general, u.username);
    const com = _findMyRow(company, u.username);
    const cit = _findMyRow(city, u.username);
    state.cache.myStandings = {
      points: (gen.row && gen.row.points) || 0,
      posGeneral: gen.pos, totalGeneral: gen.total,
      posCompany: com.pos, totalCompany: com.total,
      posCity: cit.pos, totalCity: cit.total,
    };
    // Sincronizar myStats (fixture lo lee para "Mis Puntos")
    if (gen.row) state.cache.myStats = gen.row;
  } catch (e) { /* silent */ }
  updateHeaderStats();
}

    render();
  };
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.view = t.dataset.view; renderContent(); };
  });
  try { mountSidebars(); } catch (e) { console.error('mountSidebars failed:', e); }
  try { updateHeaderStats(); } catch (e) { console.error('updateHeaderStats failed:', e); }
  try { await renderContent(); }
  catch (e) {
    console.error('renderContent failed:', e);
    const c = document.getElementById('content');
    if (c) c.innerHTML = `<div class="empty-state"><span class="icon">⚠️</span>Ocurrió un error mostrando esta vista.<br><small style="opacity:0.5">${(e && e.message) || ''}</small></div>`;
  }
}

async function renderContent() {
  const c = document.getElementById('content');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.view);
  });

  if (!state.cache.loaded) {
    c.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>Cargando datos...</div>';
    return;
  }

  // Refrescar leaderboard al entrar al ranking (la cache del backend dura 30s igual)
  if (state.view === 'ranking') await refreshLeaderboard();
  if (state.view === 'transparencia') {
    await Promise.all([refreshResults(), refreshAudit()]);
  }

  if (state.view === 'fixture') c.innerHTML = renderFixture();
  else if (state.view === 'campeon') c.innerHTML = renderCampeon();
  else if (state.view === 'ranking') c.innerHTML = renderRanking();
  else if (state.view === 'reglas') c.innerHTML = renderReglas();
  else if (state.view === 'transparencia') c.innerHTML = renderTransparencia();
  else if (state.view === 'admin') c.innerHTML = renderAdmin();
  else if (state.view === 'live') c.innerHTML = '<div class="tab-fullview" data-live-content></div>';
  else if (state.view === 'comments') c.innerHTML = '<div class="tab-fullview" data-comments-content></div>';

  bindContent();
  // Re-poblar slots (sidebars en desktop + tab content en mobile)
  mountLeftSidebar();
  mountRightSidebar();
}
