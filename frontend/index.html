function _commentsListHTML() {
  const items = state.comments || [];
  if (items.length === 0) {
    return '<div class="side-empty">No hay comentarios todavía. Sé el primero.</div>';
  }
  const cu = state.currentUser;

  // Construir árbol: top-level (parent_id == null) + map de hijos por parent_id
  const byParent = {};
  const topLevel = [];
  for (const c of items) {
    if (c.parent_id == null) topLevel.push(c);
    else (byParent[c.parent_id] = byParent[c.parent_id] || []).push(c);
  }
  // Top-level: orden por fecha desc (newest first). Réplicas: orden cronológico asc.
  topLevel.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  for (const arr of Object.values(byParent)) {
    arr.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  }

  function renderOne(c, depth) {
    const time = new Date(c.created_at + (c.created_at.endsWith('Z') ? '' : 'Z'));
    const when = time.toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    const tags = [
      c.sector ? `<span class="comment-tag">${c.sector}</span>` : '',
      companyTag(c.company),
      cityTag(c.city)
    ].filter(Boolean).join(' ');
    const safe = _escHtml(c.body);
    const isMine = cu && (c.username === cu.username);
    const canModify = isMine || (cu && cu.is_admin);
    const editedBadge = c.updated_at ? '<span class="comment-edited" title="Comentario editado">· editado</span>' : '';
    const actions = canModify ? `
      <div class="comment-actions">
        <button class="comment-action-btn" type="button" data-comment-edit="${c.id}" title="Editar">✏️</button>
        <button class="comment-action-btn" type="button" data-comment-delete="${c.id}" title="Borrar">🗑️</button>
      </div>` : '';
    const isEditing = state.editingCommentId === c.id;
    const isReplying = state.replyingToId === c.id;
    const liked = !!c.liked_by_me;
    const likesCount = c.likes_count || 0;
    const heartBtn = `<button class="comment-like-btn ${liked ? 'liked' : ''}" type="button" data-comment-like="${c.id}" title="${liked ? 'Quitar me gusta' : 'Me gusta'}">${liked ? '❤️' : '🤍'} <span class="comment-likes-count">${likesCount}</span></button>`;
    const likersBtn = likesCount > 0 ? `<button class="comment-likers-btn" type="button" data-comment-likers="${c.id}" title="Ver quién dio like">👥</button>` : '';
    const replyBtn = cu ? `<button class="comment-reply-btn" type="button" data-comment-reply="${c.id}" title="Responder">💬 Responder</button>` : '';
    const depthClass = `comment-depth-${Math.min(depth, 5)}`;

    let inner;
    if (isEditing) {
      inner = `
        <div class="comment-head">
          <span class="comment-name">${c.display_name || c.username}</span>
          ${tags}
          <span class="comment-meta">${when}${editedBadge}</span>
        </div>
        <form class="comment-edit-form" data-comment-edit-form="${c.id}">
          <textarea class="comment-edit-input" data-comment-edit-input maxlength="500" rows="3">${safe}</textarea>
          <div class="comment-edit-buttons">
            <button type="button" class="comment-action-btn comment-edit-cancel" data-comment-edit-cancel="${c.id}">Cancelar</button>
            <button type="submit" class="comment-action-btn comment-edit-save">Guardar</button>
          </div>
        </form>`;
    } else {
      inner = `
        <div class="comment-head">
          <span class="comment-name">${c.display_name || c.username}</span>
          ${tags}
          <span class="comment-meta">${when}${editedBadge}</span>
          ${actions}
        </div>
        <div class="comment-body">${safe}</div>
        <div class="comment-footer">${heartBtn}${likersBtn}${replyBtn}</div>`;
    }

    const replyFormHtml = isReplying ? `
      <form class="comment-reply-form" data-comment-reply-form="${c.id}">
        <textarea class="comment-edit-input" data-comment-reply-input maxlength="500" rows="2" placeholder="Respondiendo a @${c.username}…"></textarea>
        <div class="comment-edit-buttons">
          <button type="button" class="comment-action-btn comment-reply-cancel" data-comment-reply-cancel="${c.id}">Cancelar</button>
          <button type="submit" class="comment-action-btn comment-edit-save">Responder</button>
        </div>
      </form>` : '';

    const children = (byParent[c.id] || []).map(child => renderOne(child, depth + 1)).join('');

    return `<div class="comment-card ${isEditing ? 'editing' : ''} ${depthClass}" data-comment-card="${c.id}">
      ${inner}
      ${replyFormHtml}
      ${children}
    </div>`;
  }

  return topLevel.map(c => renderOne(c, 0)).join('');
}

function renderCommentsList() {
  const html = _commentsListHTML();
  document.querySelectorAll('[data-comments-list]').forEach(el => { el.innerHTML = html; });
  _trackCommentsSeen();
}

function _commentsBlockHTML() {
  return `<div class="side-block comments-side">
    <div class="comments-header"><h3>💬 Comentarios</h3></div>
    <form class="comments-form" data-comments-form>
      <textarea data-comment-input placeholder="Escribí algo…" maxlength="500" rows="2"></textarea>
      <button type="submit" data-comment-send>Enviar</button>
    </form>
    <div class="comments-list" data-comments-list>${_commentsListHTML()}</div>
  </div>`;
}

function mountRightSidebar() {
  document.querySelectorAll('[data-comments-content]').forEach(el => {
    el.innerHTML = _commentsBlockHTML();
  });
  bindCommentsForms();
  _trackCommentsSeen();
}

function _trackCommentsSeen() {
  const isDesktop = !!(window.matchMedia && window.matchMedia('(min-width: 1100px)').matches);
  if (state.view !== 'comments' && !isDesktop) return;
  const newest = (state.comments && state.comments[0]) ? state.comments[0].id : 0;
  if (newest > state.commentsLastSeenId) {
    state.commentsLastSeenId = newest;
    try { localStorage.setItem('prode_comments_last', String(newest)); } catch (e) {}
  }
}

async function loadComments() {
  try {
    state.comments = await apiFetch('/api/comments?limit=500') || [];
    // No re-renderizar la lista si hay un comentario abierto en modo edición
    // o si hay un form de respuesta abierto (perdería el texto del textarea).
    // La próxima acción del usuario (guardar/cancelar/responder) refresca todo.
    if (state.editingCommentId == null && state.replyingToId == null) renderCommentsList();
  } catch (e) { /* silent */ }
}

async function postComment(body) {
  const trimmed = (body || '').trim();
  if (!trimmed) return;
  document.querySelectorAll('[data-comment-send]').forEach(b => b.disabled = true);
  try {
    const created = await apiFetch('/api/comments', {
      method: 'POST',
      body: JSON.stringify({ body: trimmed })
    });
    state.comments.unshift(created);
    renderCommentsList();
    document.querySelectorAll('[data-comment-input]').forEach(i => { i.value = ''; });
  } catch (e) {
    showToast(e.message || 'Error al enviar comentario', 'error');
  } finally {
    document.querySelectorAll('[data-comment-send]').forEach(b => b.disabled = false);
  }
}

function bindCommentsForms() {
  document.querySelectorAll('[data-comments-form]').forEach(form => {
    if (form._bound) return;
    form._bound = true;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = form.querySelector('[data-comment-input]');
      postComment(input ? input.value : '');
    });
    const input = form.querySelector('[data-comment-input]');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          postComment(input.value);
        }
      });
    }
  });
  // Event delegation en el contenedor para todos los botones inline
  document.querySelectorAll('[data-comments-list]').forEach(list => {
    if (list._modBound) return;
    list._modBound = true;
    list.addEventListener('click', (e) => {
      const ed = e.target.closest('[data-comment-edit]');
      if (ed) {
        state.editingCommentId = parseInt(ed.dataset.commentEdit, 10);
        state.replyingToId = null;
        renderCommentsList();
        setTimeout(() => {
          const inp = document.querySelector('[data-comment-edit-input]');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }, 30);
        return;
      }
      const ca = e.target.closest('[data-comment-edit-cancel]');
      if (ca) {
        state.editingCommentId = null;
        renderCommentsList();
        return;
      }
      const del = e.target.closest('[data-comment-delete]');
      if (del) {
        const id = parseInt(del.dataset.commentDelete, 10);
        if (confirm('¿Borrar este comentario? Se borran también sus respuestas. No se puede deshacer.')) deleteComment(id);
        return;
      }
      const lk = e.target.closest('[data-comment-like]');
      if (lk) {
        const id = parseInt(lk.dataset.commentLike, 10);
        toggleCommentLike(id);
        return;
      }
      const lkrs = e.target.closest('[data-comment-likers]');
      if (lkrs) {
        const id = parseInt(lkrs.dataset.commentLikers, 10);
        showLikers(id);
        return;
      }
      const rp = e.target.closest('[data-comment-reply]');
      if (rp) {
        state.replyingToId = parseInt(rp.dataset.commentReply, 10);
        state.editingCommentId = null;
        renderCommentsList();
        setTimeout(() => {
          const inp = document.querySelector('[data-comment-reply-input]');
          if (inp) inp.focus();
        }, 30);
        return;
      }
      const rpc = e.target.closest('[data-comment-reply-cancel]');
      if (rpc) {
        state.replyingToId = null;
        renderCommentsList();
        return;
      }
    });
    list.addEventListener('submit', (e) => {
      const editForm = e.target.closest('[data-comment-edit-form]');
      if (editForm) {
        e.preventDefault();
        const id = parseInt(editForm.dataset.commentEditForm, 10);
        const inp = editForm.querySelector('[data-comment-edit-input]');
        updateComment(id, inp ? inp.value : '');
        return;
      }
      const replyForm = e.target.closest('[data-comment-reply-form]');
      if (replyForm) {
        e.preventDefault();
        const parentId = parseInt(replyForm.dataset.commentReplyForm, 10);
        const inp = replyForm.querySelector('[data-comment-reply-input]');
        postReply(parentId, inp ? inp.value : '');
        return;
      }
    });
  });
}

async function toggleCommentLike(id) {
  const c = (state.comments || []).find(x => x.id === id);
  if (!c) return;
  const wasLiked = !!c.liked_by_me;
  // Optimistic
  c.liked_by_me = !wasLiked;
  c.likes_count = Math.max(0, (c.likes_count || 0) + (wasLiked ? -1 : 1));
  renderCommentsList();
  try {
    await apiFetch(`/api/comments/${id}/like`, { method: wasLiked ? 'DELETE' : 'POST' });
  } catch (e) {
    // Revert
    c.liked_by_me = wasLiked;
    c.likes_count = Math.max(0, (c.likes_count || 0) + (wasLiked ? 1 : -1));
    renderCommentsList();
    showToast(e.message || 'No se pudo registrar el like', 'error');
  }
}

async function postReply(parentId, body) {
  const trimmed = (body || '').trim();
  if (!trimmed) { showToast('No puede estar vacío', 'error'); return; }
  try {
    const created = await apiFetch('/api/comments', {
      method: 'POST',
      body: JSON.stringify({ body: trimmed, parent_id: parentId })
    });
    state.comments.push(created);
    state.replyingToId = null;
    renderCommentsList();
    showToast('Respuesta enviada ✓');
  } catch (e) {
    showToast(e.message || 'Error al responder', 'error');
  }
}

async function showLikers(commentId) {
  let likers;
  try {
    likers = await apiFetch(`/api/comments/${commentId}/likes`);
  } catch (e) {
    showToast(e.message || 'No se pudo obtener la lista', 'error');
    return;
  }
  if (!Array.isArray(likers) || likers.length === 0) {
    showToast('Nadie dio like todavía');
    return;
  }
  const overlay = document.getElementById('likersModal');
  const list = document.getElementById('likersModalList');
  if (!overlay || !list) return;
  list.innerHTML = likers.map(l => `
    <li class="likers-modal-item">
      <span class="likers-modal-heart">❤️</span>
      <span class="likers-modal-name">${_escHtml(l.display_name || l.username)}</span>
    </li>`).join('');
  overlay.hidden = false;
  void overlay.offsetWidth;
  overlay.classList.add('visible');
  function close() {
    overlay.classList.remove('visible');
    setTimeout(() => { overlay.hidden = true; }, 280);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  const closeBtn = document.getElementById('likersModalClose');
  closeBtn?.addEventListener('click', close, { once: true });
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); }, { once: true });
  document.addEventListener('keydown', onKey);
}

async function updateComment(id, body) {
  const trimmed = (body || '').trim();
  if (!trimmed) { showToast('No puede estar vacío', 'error'); return; }
  try {
    const updated = await apiFetch(`/api/comments/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ body: trimmed })
    });
    // Reemplazar en el cache local
    const idx = state.comments.findIndex(c => c.id === id);
    if (idx >= 0) state.comments[idx] = updated;
    state.editingCommentId = null;
    renderCommentsList();
    showToast('Comentario editado ✓');
  } catch (e) {
    showToast(e.message || 'Error al editar', 'error');
  }
}

async function deleteComment(id) {
  try {
    await apiFetch(`/api/comments/${id}`, { method: 'DELETE' });
    state.comments = state.comments.filter(c => c.id !== id);
    if (state.editingCommentId === id) state.editingCommentId = null;
    renderCommentsList();
    showToast('Comentario borrado');
  } catch (e) {
    showToast(e.message || 'Error al borrar', 'error');
  }
}

function startCommentsPolling() {
  if (_commentsPollTimer) return;
  loadComments();
  _commentsPollTimer = setInterval(loadComments, 30_000);
}
function stopCommentsPolling() {
  if (_commentsPollTimer) { clearInterval(_commentsPollTimer); _commentsPollTimer = null; }
}

// =================================================================
// SIDEBARS — montaje
// =================================================================
function mountSidebars() {
  // Re-inyecta contenido en los slots fijos (desktop) o nada (los slots no existen en
  // pantallas chicas donde sidebars están display:none — el contenido entra como tab)
  const left = document.getElementById('sidebarLeft');
  if (left) left.innerHTML = `<div data-live-content></div>`;
  const right = document.getElementById('sidebarRight');
  if (right) right.innerHTML = `<div data-comments-content style="display:flex;flex-direction:column;flex:1;min-height:0;"></div>`;
  mountLeftSidebar();
  mountRightSidebar();
}

// =================================================================
// POLLING LIFECYCLE
// =================================================================
function startBackgroundPolling() {
  startLivePolling();
  startCommentsPolling();
}
function stopBackgroundPolling() {
  stopLivePolling();
  stopCommentsPolling();
}

// =================================================================
// INIT — validar token y cargar datos antes de renderizar
// =================================================================
function _routeAfterLoad() {
  const fp = state.cache.finalPick || {};
  state.view = (fp.champion && fp.runnerUp) ? 'fixture' : 'campeon';
}

async function appBoot() {
  const token = getToken();
  if (!token) { render(); return; }
  try {
    const user = await apiFetch('/api/auth/me');
    state.currentUser = user;
    await loadAppData();
    _routeAfterLoad();
    startBackgroundPolling();
    refreshMyStandings();
    _handlePostLoginEffects();
  } catch (e) {
    clearAuth();
    state.currentUser = null;
  }
  render();
}

appBoot();

// =================================================================
// SPLASH / INTRO — botón Entrar + música + animación
// =================================================================
// Estado y helpers de audio del intro — accesibles desde cualquier parte
let _audioPlaying = false;
function _syncAudioStopButtons() {
  document.querySelectorAll('#audioToggleBtn').forEach(b => {
    b.classList.toggle('playing', _audioPlaying);
    b.textContent = _audioPlaying ? '🔇' : '🎵';
    b.setAttribute('title', _audioPlaying ? 'Cortar música' : 'Activar música');
  });
}
function stopIntroAudio() {
  const audio = document.getElementById('splashAudio');
  if (audio) { try { audio.pause(); audio.currentTime = 0; } catch (e) {} }
  _audioPlaying = false;
  _syncAudioStopButtons();
}
function playIntroAudio() {
  const audio = document.getElementById('splashAudio');
  if (!audio) return;
  try {
    audio.currentTime = 0;
    audio.volume = 0.25;
    const p = audio.play();
    const onPlaying = () => { _audioPlaying = true; _syncAudioStopButtons(); };
    if (p && p.then) p.then(onPlaying).catch(() => {});
    else onPlaying();
    const target = 0.55;
    const steps = 20;
    let i = 0;
    const inc = (target - audio.volume) / steps;
    const iv = setInterval(() => {
      i++;
      try { audio.volume = Math.min(target, audio.volume + inc); } catch (e) {}
      if (i >= steps || audio.paused) clearInterval(iv);
    }, 60);
  } catch (e) {}
}
function toggleIntroAudio() {
  if (_audioPlaying) stopIntroAudio();
  else playIntroAudio();
}
// Event delegation — el botón aparece/desaparece con el render del SPA
document.addEventListener('click', (e) => {
  if (e.target.closest('#audioToggleBtn')) toggleIntroAudio();
});
// Sincronizar cuando el track termina o lo pausa otra cosa
(function bindAudioElement() {
  const audio = document.getElementById('splashAudio');
  if (!audio) return;
  audio.addEventListener('ended', () => { _audioPlaying = false; _syncAudioStopButtons(); });
  audio.addEventListener('pause', () => {
    if (audio.currentTime === 0 || audio.ended) { _audioPlaying = false; _syncAudioStopButtons(); }
  });
})();

(function setupSplash() {
  const splash = document.getElementById('splash');
  const btn = document.getElementById('splashEnter');
  if (!splash || !btn) return;

  function dismiss() {
    btn.disabled = true;
    splash.classList.add('exploding');
    setTimeout(() => splash.classList.add('dismissed'), 700);
    setTimeout(() => { splash.style.display = 'none'; }, 1500);
  }

  btn.addEventListener('click', dismiss, { once: true });
})();

// =================================================================
// MODAL PUBLICITARIO — aparece una vez por carga, después del splash
// =================================================================
let _promoShown = false;
function showPromoModal() {
  if (_promoShown) return;
  const overlay = document.getElementById('promoModal');
  if (!overlay) return;
  _promoShown = true;
  overlay.hidden = false;
  overlay.setAttribute('aria-hidden', 'false');
  // Forzar reflow para que la transición CSS se dispare
  void overlay.offsetWidth;
  overlay.classList.add('visible');

  const closeBtn = document.getElementById('promoModalClose');
  function close() {
    overlay.classList.remove('visible');
    overlay.setAttribute('aria-hidden', 'true');
    setTimeout(() => { overlay.hidden = true; }, 360);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  closeBtn?.addEventListener('click', close, { once: true });
  // Click fuera de la tarjeta cierra
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); }, { once: true });
  document.addEventListener('keydown', onKey);
  // Fallback si la imagen no carga
  const img = overlay.querySelector('.promo-modal-img');
  if (img) img.addEventListener('error', () => img.classList.add('errored'), { once: true });
}

// =================================================================
// CAMBIO FORZADO DE CONTRASEÑA — si el admin reseteó la pwd del usuario
// =================================================================
function _handlePostLoginEffects() {
  if (state.currentUser && state.currentUser.must_change_password) {
    showForceChangePasswordModal();
  } else {
    setTimeout(showPromoModal, 2500);
  }
}

function _isPwdChangeRequired() {
  return !!(state.currentUser && state.currentUser.must_change_password);
}

function _openPwdChangeOverlay() {
  const overlay = document.getElementById('pwdChangeModal');
  if (!overlay) return;
  overlay.hidden = false;
  void overlay.offsetWidth;
  overlay.classList.add('visible');
  setTimeout(() => { document.getElementById('pwdCurrent')?.focus(); }, 100);
}

function showForceChangePasswordModal() {
  const overlay = document.getElementById('pwdChangeModal');
  if (!overlay) return;
  _openPwdChangeOverlay();

  const form = document.getElementById('pwdChangeForm');
  const errBox = document.getElementById('pwdChangeError');
  const submit = document.getElementById('pwdChangeSubmit');
  if (!form || form._bound) return;
  form._bound = true;

  // Bloquear Esc en captura (no se cierra el modal ni por accidente).
  const blockEsc = (e) => {
    if (e.key === 'Escape' && _isPwdChangeRequired()) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
    }
  };
  document.addEventListener('keydown', blockEsc, true);
  document.addEventListener('keyup', blockEsc, true);

  // Auto-reapertura: si por cualquier motivo (extensión, código externo,
  // re-render) el modal se cierra mientras la pwd sigue siendo obligatoria,
  // lo volvemos a abrir.
  const mo = new MutationObserver(() => {
    if (_isPwdChangeRequired()) {
      if (overlay.hidden) overlay.hidden = false;
      if (!overlay.classList.contains('visible')) {
        void overlay.offsetWidth;
        overlay.classList.add('visible');
      }
    }
  });
  mo.observe(overlay, { attributes: true, attributeFilter: ['hidden', 'class', 'style'] });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.textContent = '';
    const cur = document.getElementById('pwdCurrent').value;
    const nw = document.getElementById('pwdNew').value;
    const cf = document.getElementById('pwdConfirm').value;
    if (nw.length < 8) { errBox.textContent = 'La nueva debe tener al menos 8 caracteres.'; return; }
    if (nw !== cf) { errBox.textContent = 'Las contraseñas nuevas no coinciden.'; return; }
    if (nw === cur) { errBox.textContent = 'La nueva no puede ser igual a la actual.'; return; }
    submit.disabled = true; submit.textContent = 'Guardando…';
    try {
      const updated = await apiFetch('/api/auth/change-password', {
        method: 'POST',
        body: JSON.stringify({ current_password: cur, new_password: nw }),
      });
      state.currentUser = updated;
      try { localStorage.setItem('prode_user', JSON.stringify(updated)); } catch (e2) {}
      overlay.classList.remove('visible');
      setTimeout(() => { overlay.hidden = true; }, 280);
      showToast('Contraseña actualizada ✓');
      form.reset();
      setTimeout(showPromoModal, 1500);
    } catch (err) {
      errBox.textContent = err.message || 'No se pudo cambiar la contraseña';
    } finally {
      submit.disabled = false; submit.textContent = 'Cambiar contraseña';
    }
  });
}
