<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRODE MUNDIAL 2026 ⚽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta Grupo Gestión: naranja + gris + verde lima */
    --naranja: #FC9935;
    --naranja-dark: #D17715;
    --naranja-light: #FFB066;
    --verde-lima: #BACA48;
    --verde-lima-dark: #95A52E;
    --gris-claro: #CBCBCA;
    /* Aliases por compatibilidad: rojo y celeste ahora son naranja, dorado pasa a ser verde lima */
    --rojo: var(--naranja);
    --rojo-dark: var(--naranja-dark);
    --celeste: var(--naranja);
    --celeste-dark: var(--naranja-dark);
    --celeste-light: var(--naranja-light);
    --dorado: var(--verde-lima);
    --dorado-dark: var(--verde-lima-dark);
    --azul: #2F2F2F;
    --negro: #0A0A0A;
    --gris: #1a1a1a;
    --gris-2: #2a2a2a;
    --blanco: #FFFFFF;
    --verde: #00C853;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--negro);
    color: var(--blanco);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(ellipse at top left, rgba(252, 153, 53, 0.15), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(186, 202, 72, 0.08), transparent 50%),
      repeating-linear-gradient(90deg, transparent 0, transparent 80px, rgba(255,255,255,0.015) 80px, rgba(255,255,255,0.015) 81px);
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px, 70px 70px;
  }

  /* === HEADER === */
  .header {
    background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-dark) 100%);
    padding: 14px 20px;
    box-shadow: 0 4px 20px rgba(252, 153, 53, 0.4);
    position: sticky; top: 0; z-index: 100;
    border-bottom: 3px solid var(--dorado);
  }
  .header-content {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px; cursor: pointer; flex-wrap: wrap;
  }
  .logo-img {
    height: 56px; width: auto;
    filter: drop-shadow(0 3px 10px rgba(186, 202, 72, 0.3)) drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }
  .logo-text {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 1.5px;
    line-height: 1;
  }
  .logo-author {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 500;
    color: rgba(186, 202, 72, 0.85);
    letter-spacing: 1px;
    margin-top: 5px;
    font-style: italic;
    text-transform: none;
  }
  .logo-text small {
    display: block;
    font-size: 10px;
    color: var(--dorado);
    letter-spacing: 2.5px;
    margin-top: 3px;
  }
  /* Separador entre logo Mundial y logo Grupo Gestión en el header */
  .logo-divider {
    width: 1px;
    height: 42px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 4px;
  }
  .logo-gg {
    height: 36px; width: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    opacity: 0.95;
  }
  .user-info {
    display: flex; align-items: center; gap: 10px; font-size: 14px;
  }
  .user-badge {
    background: rgba(0,0,0,0.3);
    padding: 6px 12px; border-radius: 20px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,0.2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-logout {
    background: var(--negro); color: var(--blanco);
    border: none; padding: 8px 14px; border-radius: 6px;
    cursor: pointer; font-weight: 600; font-size: 12px; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .btn-logout:hover { background: var(--dorado); color: var(--negro); }

  /* === TABS === */
  .tabs {
    display: flex; max-width: 1200px; margin: 20px auto 0;
    gap: 4px; padding: 0 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--gris); color: rgba(255,255,255,0.6);
    border: 2px solid transparent;
    padding: 12px 18px; cursor: pointer;
    font-family: 'Anton', sans-serif;
    font-size: 14px; letter-spacing: 1.5px;
    border-radius: 8px 8px 0 0;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab:hover { color: var(--blanco); background: var(--gris-2); }
  .tab.active {
    background: var(--rojo); color: var(--blanco);
    border-color: var(--dorado);
    box-shadow: 0 -4px 16px rgba(252, 153, 53, 0.3);
  }

  .container {
    max-width: 1200px; margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* === AUTH === */
  .auth-screen {
    min-height: calc(100vh - 80px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .auth-card {
    background: linear-gradient(145deg, var(--gris) 0%, #0f0f0f 100%);
    border: 2px solid rgba(186, 202, 72, 0.3);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(252, 153, 53, 0.15);
    position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--rojo), var(--dorado), var(--rojo));
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .auth-hero { text-align: center; margin-bottom: 24px; }
  .auth-logo {
    width: auto; height: 160px;
    margin: 0 auto 12px;
    display: block;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 12px 28px rgba(186, 202, 72, 0.4)) drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .auth-title {
    font-family: 'Anton', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    line-height: 1;
  }
  .auth-title .red { color: var(--rojo); }
  .auth-title .gold { color: var(--dorado); }
  .auth-subtitle {
    color: rgba(255,255,255,0.5);
    font-size: 11px; letter-spacing: 2.5px;
    margin-top: 8px; text-transform: uppercase;
  }
  .auth-author {
    color: var(--dorado);
    font-size: 12px;
    font-weight: 500;
    font-style: italic;
    letter-spacing: 1.5px;
    margin-top: 6px;
    opacity: 0.85;
  }
  /* Bloque "Presenta: GRUPO GESTIÓN" debajo del logo */
  .powered-by {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .powered-by-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    font-weight: 600;
  }
  .powered-by-logo {
    height: 36px; width: auto;
    filter: drop-shadow(0 2px 8px rgba(252, 153, 53, 0.2));
    opacity: 0.95;
  }
  .auth-toggle {
    display: flex; background: var(--negro);
    border-radius: 8px; padding: 4px; margin-bottom: 22px;
  }
  .auth-toggle button {
    flex: 1; background: transparent; color: rgba(255,255,255,0.5);
    border: none; padding: 10px; cursor: pointer;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    border-radius: 6px; transition: all 0.2s;
  }
  .auth-toggle button.active { background: var(--rojo); color: var(--blanco); }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 11px; font-weight: 700;
    letter-spacing: 1.5px; margin-bottom: 6px;
    color: rgba(255,255,255,0.7); text-transform: uppercase;
  }
  .form-group input, .form-group select {
    width: 100%; background: var(--negro);
    border: 2px solid var(--gris-2); color: var(--blanco);
    padding: 11px 14px; border-radius: 8px;
    font-size: 15px; font-family: inherit;
    transition: all 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--dorado);
    box-shadow: 0 0 0 3px rgba(186, 202, 72, 0.15);
  }
  .category-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .category-option {
    background: var(--negro); border: 2px solid var(--gris-2);
    color: var(--blanco); padding: 14px 10px;
    border-radius: 8px; cursor: pointer; text-align: center;
    transition: all 0.2s; font-size: 13px; font-weight: 600;
  }
  .category-option .emoji { display: block; font-size: 24px; margin-bottom: 4px; }
  .category-option:hover { border-color: rgba(186, 202, 72, 0.5); }
  .category-option.selected {
    border-color: var(--dorado);
    background: rgba(186, 202, 72, 0.1);
    box-shadow: 0 0 0 3px rgba(186, 202, 72, 0.15);
  }
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--rojo) 0%, var(--rojo-dark) 100%);
    color: var(--blanco); border: none; padding: 14px;
    border-radius: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 18px; letter-spacing: 2px;
    cursor: pointer; margin-top: 10px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(252, 153, 53, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(252, 153, 53, 0.5);
  }
  .alert {
    background: rgba(227, 6, 19, 0.15); border: 1px solid #E30613;
    color: #FFB3B8; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; margin-bottom: 14px;
  }
  .alert.success {
    background: rgba(0, 200, 83, 0.15); border-color: var(--verde);
    color: #B3F5C9;
  }

  /* === STATS BAR === */
  .stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 16px 12px;
    text-align: center; transition: all 0.2s;
  }
  .stat-card:hover { border-color: var(--dorado); transform: translateY(-2px); }
  .stat-value {
    font-family: 'Anton', sans-serif;
    font-size: 28px; color: var(--dorado); line-height: 1;
  }
  .stat-label {
    font-size: 10px; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5); margin-top: 6px; text-transform: uppercase;
  }

  /* === FILTROS === */
  .phase-filter {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .phase-btn {
    background: var(--gris); color: rgba(255,255,255,0.6);
    border: 1px solid var(--gris-2);
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    transition: all 0.2s;
  }
  .phase-btn:hover { color: var(--blanco); border-color: var(--dorado); }
  .phase-btn.active {
    background: var(--dorado); color: var(--negro); border-color: var(--dorado);
  }

  /* === MATCHES === */
  .match-group { margin-bottom: 28px; }
  .match-group-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 2px;
    color: var(--dorado);
    margin-bottom: 12px; padding-bottom: 8px;
    border-bottom: 2px solid var(--gris-2);
    display: flex; align-items: center; gap: 10px;
  }
  .match-group-title::before {
    content: ''; width: 4px; height: 24px;
    background: var(--rojo); border-radius: 2px;
  }
  .match-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 16px;
    margin-bottom: 12px; transition: all 0.2s;
    position: relative;
  }
  .match-card:hover {
    border-color: rgba(186, 202, 72, 0.4);
    transform: translateX(2px);
  }
  .match-card.predicted {
    border-color: rgba(0, 200, 83, 0.4);
    background: linear-gradient(145deg, rgba(0, 200, 83, 0.05), #141414);
  }
  .match-card.finished {
    border-color: rgba(186, 202, 72, 0.5);
  }
  .match-meta {
    display: flex; justify-content: space-between;
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase;
    gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .match-meta .group-tag {
    background: var(--rojo); color: var(--blanco);
    padding: 2px 8px; border-radius: 10px; font-weight: 700;
  }
  .match-meta .match-datetime strong {
    color: var(--dorado); font-weight: 700;
  }
  .match-venue {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 12px;
    letter-spacing: 0.3px;
    border-left: 2px solid var(--gris-2);
    padding-left: 8px;
  }
  /* === BOTÓN DE TEST (ingreso rápido como admin) === */
  .btn-test {
    width: 100%;
    margin-top: 14px;
    background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 100%);
    color: var(--dorado);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    padding: 10px;
    border-radius: 8px;
    font-family: 'Anton', sans-serif;
    font-size: 13px; letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-test:hover {
    border-color: var(--dorado);
    background: linear-gradient(135deg, #5a5a5a 0%, #3a3a3a 100%);
    transform: translateY(-1px);
  }
  .test-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 18px 0 4px;
    font-size: 10px; letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
  }
  .test-divider::before, .test-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.1);
  }
  /* === WORKPLACE PICKER === */
  .workplace-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .workplace-option {
    background: var(--negro); border: 2px solid var(--gris-2);
    color: var(--blanco); padding: 12px 8px;
    border-radius: 8px; cursor: pointer; text-align: center;
    transition: all 0.2s; font-size: 12px; font-weight: 600;
    line-height: 1.3;
  }
  .workplace-option .emoji { display: block; font-size: 22px; margin-bottom: 4px; }
  .workplace-option:hover { border-color: rgba(0, 47, 108, 0.7); }
  .workplace-option.selected {
    border-color: var(--azul);
    background: rgba(0, 47, 108, 0.25);
    box-shadow: 0 0 0 3px rgba(0, 47, 108, 0.2);
  }
  /* === SELECTOR DE EMPRESA (registro) === */
  .company-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .company-option {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 16px 8px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    cursor: pointer; transition: all 0.18s ease; min-height: 110px;
    opacity: 0.6;
  }
  .company-option img { height: 56px; max-width: 100%; object-fit: contain; }
  .company-option .company-name { font-size: 12px; letter-spacing: 0.6px; text-transform: uppercase; color: rgba(255,255,255,0.85); font-weight: 700; }
  .company-option:hover { border-color: rgba(255,138,76,0.55); opacity: 0.9; }
  .company-option.selected {
    border-color: var(--naranja, #ff8a4c);
    background: rgba(255,138,76,0.10);
    box-shadow: 0 0 0 3px rgba(255,138,76,0.18), 0 8px 24px rgba(255,138,76,0.25);
    opacity: 1;
  }
  .form-group input[disabled], .form-group select[disabled] {
    opacity: 0.45; cursor: not-allowed;
  }
  .form-group .hint { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 4px; display: block; }
  .ranking-company-tag {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; padding: 3px 7px; border-radius: 6px;
    background: rgba(255,138,76,0.18); color: #ffb98a; border: 1px solid rgba(255,138,76,0.35);
  }
  .ranking-company-tag.carrefour {
    background: rgba(0,113,206,0.18); color: #8ec8ff; border-color: rgba(0,113,206,0.35);
  }

  .workplace-badge {
    background: rgba(0, 47, 108, 0.4);
    color: #B3D4FF;
    padding: 3px 8px; border-radius: 8px;
    font-size: 10px; letter-spacing: 1px;
    font-weight: 700; text-transform: uppercase;
  }
  .match-row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 12px;
  }
  .team { display: flex; align-items: center; gap: 10px; }
  .team.home { justify-content: flex-end; text-align: right; }
  .team.away { justify-content: flex-start; }
  .team-flag {
    width: 36px; height: 26px; object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    flex-shrink: 0;
    background: var(--gris-2);
  }
  .team-flag-placeholder {
    width: 36px; height: 26px;
    border-radius: 4px;
    background: var(--gris-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; color: rgba(255,255,255,0.4);
    flex-shrink: 0;
  }
  .team-name {
    font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
  }
  .score-input {
    width: 44px; height: 44px;
    background: var(--negro);
    border: 2px solid var(--gris-2);
    color: var(--blanco); text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 22px; border-radius: 8px;
    transition: all 0.2s;
  }
  .score-input:focus {
    outline: none; border-color: var(--dorado);
    background: rgba(186, 202, 72, 0.05);
  }
  .score-input:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Display de score guardado (no editable) */
  .score-display {
    width: 44px; height: 44px;
    background: rgba(0, 200, 83, 0.12);
    border: 2px solid rgba(0, 200, 83, 0.5);
    color: var(--blanco); text-align: center;
    font-family: 'Anton', sans-serif;
    font-size: 22px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .score-display.locked {
    background: rgba(186, 202, 72, 0.08);
    border-color: rgba(186, 202, 72, 0.5);
    color: var(--dorado);
  }
  .vs {
    font-family: 'Anton', sans-serif;
    color: var(--dorado); font-size: 14px; padding: 0 4px;
  }
  .score-block { display: flex; align-items: center; gap: 6px; }
  .match-footer {
    margin-top: 12px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 10px;
  }
  .btn-save {
    background: var(--rojo); color: var(--blanco);
    border: none; padding: 8px 16px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .btn-save:hover { background: var(--dorado); color: var(--negro); }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Botón Modificar (re-abrir un pronóstico ya guardado) */
  .btn-modify {
    background: transparent;
    color: var(--dorado);
    border: 1px solid var(--dorado);
    padding: 7px 14px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .btn-modify:hover {
    background: var(--dorado); color: var(--negro);
  }
  /* Botón Cancelar (volver al modo bloqueado sin guardar) */
  .btn-cancel {
    background: transparent;
    color: rgba(255,255,255,0.6);
    border: 1px solid var(--gris-2);
    padding: 7px 12px; border-radius: 6px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    transition: all 0.2s;
  }
  .btn-cancel:hover {
    color: var(--blanco);
    border-color: rgba(255,255,255,0.4);
  }
  /* Pildoras de estado */
  .status-pill {
    padding: 4px 10px; border-radius: 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .status-pill.saved {
    background: rgba(0, 200, 83, 0.15);
    color: var(--verde);
    border: 1px solid rgba(0, 200, 83, 0.4);
  }
  .status-pill.locked {
    background: rgba(186, 202, 72, 0.12);
    color: var(--dorado);
    border: 1px solid rgba(186, 202, 72, 0.4);
  }
  .status-pill.missed {
    background: rgba(227, 6, 19, 0.15);
    color: #FFB3B8;
    border: 1px solid rgba(227, 6, 19, 0.4);
  }
  /* Banner de fase cerrada */
  .phase-locked-banner {
    background: rgba(186, 202, 72, 0.08);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--dorado);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.3px;
  }
  .match-card.predicted.locked {
    border-color: rgba(186, 202, 72, 0.4);
    background: linear-gradient(145deg, rgba(186, 202, 72, 0.04), #141414);
  }
  .points-badge {
    background: var(--verde); color: var(--negro);
    padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
  }
  .points-badge.zero { background: var(--gris-2); color: rgba(255,255,255,0.5); }
  .official-result {
    background: rgba(186, 202, 72, 0.1);
    border: 1px dashed var(--dorado);
    padding: 6px 10px; border-radius: 6px;
    font-size: 11px; color: var(--dorado); font-weight: 600;
  }

  /* === RANKING === */
  .ranking-tabs {
    display: flex; gap: 4px;
    background: var(--gris);
    padding: 4px; border-radius: 10px;
    margin-bottom: 20px;
  }
  .ranking-tab {
    flex: 1; background: transparent; color: rgba(255,255,255,0.5);
    border: none; padding: 12px 8px; cursor: pointer;
    font-family: 'Anton', sans-serif;
    font-size: 13px; letter-spacing: 1.2px;
    border-radius: 6px; transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  }
  .ranking-tab small {
    font-size: 10px;
    opacity: 0.7;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0;
  }
  .ranking-tab.active { background: var(--rojo); color: var(--blanco); }
  .podium {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; align-items: end;
    margin-bottom: 24px; min-height: 200px;
  }
  .podium-spot {
    background: linear-gradient(180deg, var(--gris) 0%, #141414 100%);
    border: 2px solid var(--gris-2);
    border-radius: 12px 12px 0 0;
    padding: 16px 8px 12px; text-align: center;
    position: relative;
    animation: rise 0.6s ease-out backwards;
  }
  @keyframes rise {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .podium-spot.first {
    border-color: var(--dorado);
    background: linear-gradient(180deg, rgba(186, 202, 72, 0.2) 0%, #141414 100%);
    min-height: 200px; animation-delay: 0.4s;
  }
  .podium-spot.second {
    border-color: #C0C0C0;
    background: linear-gradient(180deg, rgba(192, 192, 192, 0.15) 0%, #141414 100%);
    min-height: 170px; animation-delay: 0.2s;
  }
  .podium-spot.third {
    border-color: #CD7F32;
    background: linear-gradient(180deg, rgba(205, 127, 50, 0.15) 0%, #141414 100%);
    min-height: 140px; animation-delay: 0s;
  }
  .podium-medal { font-size: 36px; display: block; margin-bottom: 6px; }
  .podium-name {
    font-weight: 700; font-size: 13px;
    margin-bottom: 4px; word-break: break-word;
  }
  .podium-points {
    font-family: 'Anton', sans-serif;
    font-size: 24px; color: var(--dorado);
  }
  .podium-cat {
    font-size: 9px; color: rgba(255,255,255,0.5);
    letter-spacing: 1px; margin-top: 4px; text-transform: uppercase;
  }
  .ranking-list {
    background: var(--gris); border-radius: 12px; overflow: hidden;
  }
  .ranking-row {
    display: grid;
    grid-template-columns: 50px 1fr auto auto;
    align-items: center; padding: 14px 16px; gap: 12px;
    border-bottom: 1px solid var(--gris-2); transition: all 0.15s;
  }
  .ranking-row:last-child { border-bottom: none; }
  .ranking-row:hover { background: var(--gris-2); }
  .ranking-row.me {
    background: rgba(252, 153, 53, 0.1);
    border-left: 3px solid var(--rojo);
  }
  .ranking-pos {
    font-family: 'Anton', sans-serif;
    font-size: 18px; color: rgba(255,255,255,0.5);
  }
  .ranking-user { font-weight: 600; font-size: 14px; }
  .ranking-username {
    font-weight: 600; font-size: 14px;
    line-height: 1.2;
  }
  .ranking-sector {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.3px;
    margin-top: 2px;
    font-weight: 400;
  }
  .ranking-tags {
    display: flex; flex-direction: column; gap: 3px;
    align-items: flex-end;
  }
  .ranking-cat-tag {
    font-size: 9px; background: var(--gris-2);
    padding: 3px 8px; border-radius: 8px;
    letter-spacing: 1px; color: rgba(255,255,255,0.6); text-transform: uppercase;
    white-space: nowrap;
  }
  .ranking-cat-tag.fc {
    background: rgba(252, 153, 53, 0.25);
    color: var(--celeste);
    border: 1px solid rgba(252, 153, 53, 0.4);
  }
  .ranking-cat-tag.pe {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .ranking-cat-tag.wp {
    background: rgba(186, 202, 72, 0.15);
    color: var(--dorado);
    letter-spacing: 0.5px;
  }
  .podium-wp {
    font-size: 9px;
    color: var(--dorado);
    letter-spacing: 0.5px;
    margin-top: 2px;
    opacity: 0.85;
  }
  .ranking-pts {
    font-family: 'Anton', sans-serif;
    font-size: 22px; color: var(--dorado);
    min-width: 60px; text-align: right;
  }

  /* === REGLAS / CARDS === */
  .rules-card {
    background: linear-gradient(145deg, var(--gris), #141414);
    border: 1px solid var(--gris-2);
    border-radius: 12px; padding: 24px; margin-bottom: 16px;
  }
  .rules-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 1.5px;
    color: var(--dorado); margin-bottom: 16px;
  }
  .rule-item {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 12px;
    font-size: 14px; line-height: 1.5;
  }
  .rule-points {
    background: var(--rojo); color: var(--blanco);
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif;
    font-size: 14px; flex-shrink: 0;
  }
  .empty-state {
    text-align: center; padding: 40px 20px;
    color: rgba(255,255,255,0.4);
  }
  .empty-state .icon {
    font-size: 56px; display: block; margin-bottom: 12px; opacity: 0.5;
  }

  /* === CAMPEÓN / SUBCAMPEÓN === */
  .champion-card {
    background: linear-gradient(145deg, rgba(186, 202, 72, 0.08), #0f0f0f);
    border: 2px solid rgba(186, 202, 72, 0.3);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .champion-card::after {
    content: ''; position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(186, 202, 72, 0.15), transparent 70%);
    pointer-events: none;
  }
  .champion-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px;
  }
  .champion-trophy {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--dorado), var(--dorado-dark));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 14px rgba(186, 202, 72, 0.5);
    flex-shrink: 0;
  }
  .champion-title {
    font-family: 'Anton', sans-serif;
    font-size: 20px; letter-spacing: 2px;
    color: var(--dorado);
    line-height: 1;
  }
  .champion-subtitle {
    font-size: 11px; color: rgba(255,255,255,0.5);
    letter-spacing: 1.5px;
    margin-top: 4px; text-transform: uppercase;
  }
  .champion-select-wrap {
    background: var(--negro);
    border: 2px solid var(--gris-2);
    border-radius: 10px;
    padding: 4px;
    position: relative;
    z-index: 1;
  }
  .champion-select-wrap select {
    width: 100%;
    background: transparent;
    color: var(--blanco);
    border: none;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23BACA48'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 22px;
    padding-right: 38px;
  }
  .champion-select-wrap select:focus { outline: none; }
  .champion-select-wrap select option {
    background: var(--gris); color: var(--blanco);
  }
  .champion-current {
    display: flex; align-items: center; gap: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
    position: relative; z-index: 1;
    border: 2px solid transparent;
    transition: all 0.2s;
  }
  .champion-current.saved {
    background: rgba(0, 200, 83, 0.1);
    border-color: rgba(0, 200, 83, 0.4);
  }
  .champion-current.locked {
    background: rgba(186, 202, 72, 0.08);
    border-color: rgba(186, 202, 72, 0.4);
  }
  .champion-current img {
    width: 44px; height: 32px; border-radius: 4px; object-fit: cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .champion-current-name {
    font-weight: 700; font-size: 16px;
    flex: 1;
  }
  .champion-current .status-pill {
    margin-left: auto;
  }
  .champion-info-banner {
    background: rgba(186, 202, 72, 0.08);
    border: 1px dashed rgba(186, 202, 72, 0.4);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: rgba(186, 202, 72, 0.9);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .champion-info-banner strong { color: var(--dorado); }

  .admin-banner {
    background: linear-gradient(90deg, rgba(186, 202, 72, 0.15), transparent);
    border: 1px solid var(--dorado);
    padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 13px;
  }
  .admin-banner strong { color: var(--dorado); }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--verde); color: var(--negro);
    padding: 12px 24px; border-radius: 30px;
    font-weight: 700; font-size: 13px; letter-spacing: 1px;
    box-shadow: 0 8px 24px rgba(0, 200, 83, 0.4);
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-transform: uppercase;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error {
    background: #E30613; color: var(--blanco);
    box-shadow: 0 8px 24px rgba(227, 6, 19, 0.4);
  }

  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* === RESPONSIVE === */
  @media (max-width: 640px) {
    .header-content { flex-direction: column; gap: 10px; }
    .logo-text { font-size: 18px; }
    .logo-img { height: 40px; }
    .logo-gg { height: 28px; }
    .logo-divider { height: 32px; }
    .powered-by-logo { height: 30px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .match-row { gap: 6px; }
    .team-name { font-size: 12px; }
    .team-flag, .team-flag-placeholder { width: 30px; height: 22px; }
    .score-input { width: 38px; height: 38px; font-size: 18px; }
    .podium { gap: 4px; }
    .podium-spot { padding: 10px 4px 8px; }
    .podium-medal { font-size: 28px; }
    .podium-points { font-size: 18px; }
    .podium-name { font-size: 11px; }
    .ranking-row { grid-template-columns: 36px 1fr auto; padding: 12px; gap: 8px; }
    .ranking-tags { display: none; }
    .ranking-tab { font-size: 11px; padding: 10px 4px; letter-spacing: 0.5px; }
    .ranking-tab small { font-size: 9px; }
    .container { padding: 16px 12px 40px; }
    .auth-card { padding: 28px 20px; }
    .auth-title { font-size: 26px; }
    .auth-logo { height: 130px; width: auto; }
    .tab { font-size: 12px; padding: 10px 14px; }
    .champion-title { font-size: 17px; }
  }
  /* === SEDE / CITY PICKER === */
  .city-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 6px; }
  .city-option {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 14px 8px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    cursor: pointer; transition: all 0.18s ease; min-height: 88px; opacity: 0.7;
  }
  .city-emoji { font-size: 22px; }
  .city-name { font-size: 11.5px; letter-spacing: 0.4px; text-transform: uppercase; color: rgba(255,255,255,0.85); font-weight: 700; text-align: center; }
  .city-option:hover { border-color: rgba(255,138,76,0.5); opacity: 0.95; }
  .city-option.selected {
    border-color: var(--naranja, #ff8a4c);
    background: rgba(255,138,76,0.10);
    box-shadow: 0 0 0 2px rgba(255,138,76,0.18);
    opacity: 1;
  }

  /* === COMMENTS PANEL === */
  .comments-fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 800;
    width: 56px; height: 56px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff8a4c, #ff6a2c);
    color: #fff; font-size: 22px; cursor: pointer;
    box-shadow: 0 8px 28px rgba(255,138,76,0.45);
    transition: transform 0.18s ease;
  }
  .comments-fab:hover { transform: scale(1.05); }
  .comments-fab .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--rojo, #c0392b); color: #fff; font-size: 10px;
    border-radius: 10px; padding: 2px 6px; font-weight: 800;
  }
  .comments-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
    background: linear-gradient(180deg, #15102a 0%, #0c0820 100%);
    border-left: 1px solid rgba(255,138,76,0.18);
    box-shadow: -20px 0 60px rgba(0,0,0,0.45);
    z-index: 850; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.32s cubic-bezier(0.2,0.8,0.2,1);
  }
  .comments-panel.open { transform: translateX(0); }
  .comments-header {
    padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
  }
  .comments-header h3 { margin: 0; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #ffd0a8; }
  .comments-close { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 22px; cursor: pointer; }
  .comments-list { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .comment-card {
    background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .comment-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .comment-name { font-weight: 800; font-size: 13px; color: #fff; }
  .comment-meta { font-size: 10px; color: rgba(255,255,255,0.45); margin-left: auto; }
  .comment-body { font-size: 13px; line-height: 1.45; color: rgba(255,255,255,0.88); word-wrap: break-word; }
  .comment-tag {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 5px;
    background: rgba(255,138,76,0.16); color: #ffb98a; border: 1px solid rgba(255,138,76,0.3);
  }
  .comment-tag.carrefour { background: rgba(0,113,206,0.16); color: #8ec8ff; border-color: rgba(0,113,206,0.3); }
  .comment-tag.sede { background: rgba(186,202,72,0.14); color: #d6e394; border-color: rgba(186,202,72,0.28); }
  .comments-form { padding: 10px 14px 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 6px; }
  .comments-form textarea {
    flex: 1; resize: none; padding: 10px; border-radius: 10px;
    background: rgba(255,255,255,0.04); color: #fff; border: 1px solid rgba(255,255,255,0.1);
    font-family: inherit; font-size: 13px; min-height: 42px; max-height: 100px;
  }
  .comments-form button {
    background: var(--naranja, #ff8a4c); color: #fff; border: none;
    border-radius: 10px; padding: 0 14px; font-weight: 800; cursor: pointer;
    font-size: 13px;
  }
  .comments-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  @media (max-width: 600px) {
    .comments-panel { width: 100%; }
    .comments-fab { right: 14px; bottom: 14px; }
  }

  /* === LIVE WIDGET === */
  .live-widget {
    background: linear-gradient(135deg, rgba(204, 41, 54, 0.18), rgba(204, 41, 54, 0.04));
    border: 1px solid rgba(204, 41, 54, 0.45);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .live-widget.next { background: linear-gradient(135deg, rgba(186,202,72,0.12), rgba(186,202,72,0.03)); border-color: rgba(186,202,72,0.35); }
  .live-widget-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: #ff8a8a;
  }
  .live-widget.next .live-widget-title { color: #d6e394; }
  .live-widget-title .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3838;
    animation: liveDot 1.2s ease-in-out infinite;
  }
  .live-widget.next .live-widget-title .dot { background: #bacab8; animation: none; }
  @keyframes liveDot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; font-size: 13px;
  }
  .live-row + .live-row { border-top: 1px solid rgba(255,255,255,0.06); }
  .live-teams { font-weight: 700; flex: 1; min-width: 0; }
  .live-score { font-weight: 900; font-size: 16px; color: #ffd0a8; white-space: nowrap; }
  .live-minute { font-size: 11px; color: rgba(255,255,255,0.6); }
  .live-countdown { font-weight: 900; color: #d6e394; }

  /* === CONFETTI === */
  .confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9000; }

  /* === SPLASH / INTRO (logo GG CUP + botón Entrar + música) === */
  .splash-overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 28px 18px;
    background: radial-gradient(ellipse at center, #1a1530 0%, #0a0518 65%, #000 100%);
    transition: opacity 0.7s ease;
  }
  .splash-overlay.dismissed { opacity: 0; pointer-events: none; }
  .splash-logo {
    max-width: min(80vw, 520px);
    max-height: 62vh;
    object-fit: contain;
    filter: drop-shadow(0 0 28px rgba(255, 138, 76, 0.35));
    animation: splashLogoIn 1.2s cubic-bezier(0.2,0.8,0.2,1) backwards;
    transition: transform 0.9s cubic-bezier(0.2,0.8,0.2,1), filter 0.9s ease;
    will-change: transform, filter;
  }
  .splash-overlay.exploding .splash-logo {
    transform: scale(2.4);
    filter: drop-shadow(0 0 90px rgba(255, 210, 130, 0.95)) drop-shadow(0 0 30px rgba(255, 138, 76, 0.7));
  }
  @keyframes splashLogoIn {
    0%   { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }
  .splash-tagline {
    color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; text-align: center; margin: 0;
    animation: splashFadeUp 1.0s 0.5s cubic-bezier(0.2,0.8,0.2,1) backwards;
  }
  .splash-overlay.exploding .splash-tagline { opacity: 0; transition: opacity 0.35s ease; }
  .splash-enter-btn {
    font-family: inherit; font-size: 15px; font-weight: 900; letter-spacing: 3px;
    padding: 16px 52px; border: 2px solid #ff8a4c; color: #ffd0a8;
    background: linear-gradient(135deg, rgba(255,138,76,0.18), rgba(255,138,76,0.05));
    border-radius: 32px; cursor: pointer; text-transform: uppercase;
    animation: splashFadeUp 1.0s 0.8s cubic-bezier(0.2,0.8,0.2,1) backwards,
               splashPulse 1.9s 2s infinite;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .splash-enter-btn:hover { transform: translateY(-2px) scale(1.02); background: linear-gradient(135deg, rgba(255,138,76,0.28), rgba(255,138,76,0.10)); }
  .splash-enter-btn:active { transform: translateY(0) scale(0.98); }
  .splash-overlay.exploding .splash-enter-btn {
    opacity: 0; transform: scale(0.85);
    transition: opacity 0.3s ease, transform 0.3s ease;
    animation: none;
  }
  @keyframes splashFadeUp {
    0%   { opacity: 0; transform: translateY(18px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes splashPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,76,0.55); }
    50%      { box-shadow: 0 0 0 18px rgba(255,138,76,0); }
  }
  @media (max-width: 480px) {
    .splash-logo { max-width: 88vw; max-height: 55vh; }
    .splash-enter-btn { padding: 14px 40px; font-size: 14px; letter-spacing: 2.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash-logo, .splash-tagline, .splash-enter-btn { animation: none !important; }
    .splash-overlay.exploding .splash-logo { transform: none; }
  }
</style>
</head>

// Helper para renderizar una bandera con fallback
function flagHtml(teamCode, big = false) {
  const t = TEAMS[teamCode];
  if (!t) return '<span class="team-flag-placeholder">?</span>';

}

// DEADLINES POR FASE — se cierra al inicio del primer partido de la fase
// =================================================================
// Devuelve un Date con el inicio del primer partido de la fase dada (en hora ARG / UTC-3)
function phaseDeadline(phase) {
  // Preferí siempre la deadline del backend (fuente de verdad)
  const iso = state.cache.deadlinesUtc[phase];
  if (iso) return new Date(iso);
  // Fallback (antes de que la API responda): cálculo local
  const phMatches = FIXTURE.filter(m => m.phase === phase);
  if (phMatches.length === 0) return null;
  // Ordenar por fecha+hora y tomar el primero
  const sorted = phMatches.slice().sort((a, b) => {
    const ta = a.date + 'T' + (a.time || '00:00');
    const tb = b.date + 'T' + (b.time || '00:00');
    return ta.localeCompare(tb);
  });
  const first = sorted[0];
  // Construir Date interpretando como hora ARG (UTC-3)
  return new Date(`${first.date}T${first.time || '00:00'}:00-03:00`);
}

// True si la fase ya está cerrada (su primer partido ya empezó)
function isPhaseLocked(phase) {
  const dl = phaseDeadline(phase);
  if (!dl) return false;
  return Date.now() >= dl.getTime();
}

// Formatea un Date como "dom 11 jun · 16:00 hs"
function fmtDeadline(d) {
  if (!d) return '';
  const fecha = d.toLocaleDateString('es-AR', { weekday:'short', day:'2-digit', month:'short' });
  const hora = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'America/Argentina/Buenos_Aires' });
  return `${fecha} · ${hora} hs`;
}

const API_BASE = (
  window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8000'
    : window.location.origin
);

function getToken() { return localStorage.getItem('prode_token'); }
function setToken(t) { localStorage.setItem('prode_token', t); }
function clearAuth() {
  localStorage.removeItem('prode_token');
  localStorage.removeItem('prode_user');
}

async function apiFetch(endpoint, options = {}) {
  const token = getToken();
  const headers = {
    'Content-Type': 'application/json',
    ...(token && { 'Authorization': `Bearer ${token}` }),
    ...(options.headers || {})
  };
  let response;
  try {
    response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  } catch (e) {
    const err = new Error('No se pudo conectar al servidor');
    err.status = 0;
    throw err;
  }

  if (response.status === 401) {
    clearAuth();
    location.reload();
    return;
  }

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    const error = new Error(data.detail || `Error ${response.status}`);
    error.status = response.status;
    error.data = data;
    throw error;
  }
  return data;
}

// Debounce sencillo por key
function debounce(key, fn, ms = 500) {
  if (state.pendingTimers[key]) clearTimeout(state.pendingTimers[key]);
  state.pendingTimers[key] = setTimeout(() => {
    delete state.pendingTimers[key];
    fn();
  }, ms);
}

function setButtonBusy(id, busyText) {
  const btn = document.getElementById(id);
  if (!btn) return null;
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyText;
  return () => { btn.disabled = false; btn.textContent = original; };
}

// Partidos: 5 exacto / 3 ganador+diferencia / 1 ganador
// Campeón: +10 pts. Subcampeón: +5 pts.
const PTS_CAMPEON = 10;
const PTS_SUBCAMPEON = 5;

function calcPoints(prediction, official) {
  if (!prediction || !official) return 0;
  if (prediction.home == null || prediction.away == null) return 0;
  if (official.home == null || official.away == null) return 0;
  const pH = +prediction.home, pA = +prediction.away;
  const oH = +official.home, oA = +official.away;
  if (pH === oH && pA === oA) return 5;
  const pW = pH > pA ? 'H' : (pH < pA ? 'A' : 'E');
  const oW = oH > oA ? 'H' : (oH < oA ? 'A' : 'E');
  if (pW !== oW) return 0;
  if ((pH - pA) === (oH - oA)) return 3;
  return 1;
}

    document.getElementById('btnLogin').onclick = handleLogin;
    document.getElementById('loginPwd').onkeydown = (e) => { if (e.key === 'Enter') handleLogin(); };
  } else {
    function _reRenderRegPreservingInputs() {
      const snapshot = {};
      ['regUser','regDisplay','regDni','regEmail','regSector','regPwd'].forEach(id => {
        const el = document.getElementById(id);
        if (el) snapshot[id] = el.value;
      });
      render();
      Object.entries(snapshot).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el) el.value = val;
      });
    }
    document.querySelectorAll('.company-option').forEach(opt => {
      opt.onclick = () => {
        if (state.regCompany !== opt.dataset.company) {
          state.regCompany = opt.dataset.company;
          state.regCity = null; // forzar re-elección de sede al cambiar empresa
        }
        _reRenderRegPreservingInputs();
      };
    });
    document.querySelectorAll('.city-option').forEach(opt => {
      opt.onclick = () => {
        state.regCity = opt.dataset.city;
        _reRenderRegPreservingInputs();
      };
    });
    const btnReg = document.getElementById('btnReg');
    if (btnReg) btnReg.onclick = handleRegister;
    const pwdEl = document.getElementById('regPwd');
    if (pwdEl) pwdEl.onkeydown = (e) => { if (e.key === 'Enter') handleRegister(); };
  }
}

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  if (box) box.innerHTML = `<div class="alert ${type === 'success' ? 'success' : ''}">${msg}</div>`;
}

async function handleLogin() {
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const pwd = document.getElementById('loginPwd').value;
  if (!username || !pwd) { showAlert('Completá usuario y contraseña'); return; }
  const reset = setButtonBusy('btnLogin', 'Ingresando...');
  try {
    const res = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password: pwd })
    });
    setToken(res.access_token);
    localStorage.setItem('prode_user', JSON.stringify(res.user));
    state.currentUser = res.user;
    state.view = 'fixture';
    await loadAppData();
    startBackgroundPolling();
    showToast('¡Bienvenido, ' + (res.user.display_name || res.user.username) + '!');
    render();
  } catch (e) {
    showAlert(e.message || 'Error al ingresar');
  } finally {
    if (reset) reset();
  }
}

function mapRegisterError(e) {
  if (e && e.status === 409 && e.message) {
    const m = e.message.toLowerCase();
    if (m.includes('dni')) return 'Ya hay alguien registrado con ese DNI';
    if (m.includes('email')) return 'Ese email ya está en uso';
    if (m.includes('username')) return 'Ese nombre de usuario ya existe, elegí otro';
    return e.message;
  }
  if (e && e.status === 422) {
    const errs = e.data && e.data.errors;
    if (Array.isArray(errs) && errs.length) {
      const first = errs[0];
      const field = (first.loc || []).slice(-1)[0] || 'campo';
      return `Dato inválido en "${field}": ${first.msg}`;
    }
  }
  return (e && e.message) || 'Error al registrar';
}

async function handleRegister() {
  const company = state.regCompany;
  const city = state.regCity;
  if (!company) { showAlert('Elegí una empresa primero'); return; }
  if (!city) { showAlert('Elegí tu sede (Isidro Casanova o Esteban Echeverría)'); return; }

  const username = (document.getElementById('regUser').value || '').trim().toLowerCase();
  const displayName = (document.getElementById('regDisplay').value || '').trim();
  const dniRaw = (document.getElementById('regDni').value || '');
  const email = (document.getElementById('regEmail').value || '').trim().toLowerCase();
  const sector = (document.getElementById('regSector').value || '').trim();
  const pwd = document.getElementById('regPwd').value || '';

  // Normalizar DNI: solo dígitos (saca puntos, espacios, guiones)
  const dni = dniRaw.replace(/\D/g, '');

  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    showAlert('Usuario inválido: solo minúsculas, números y _ (3-30 caracteres)'); return;
  }
  if (displayName.length < 3) { showAlert('Ingresá nombre y apellido (mín. 3 caracteres)'); return; }
  if (!/^\d{7,10}$/.test(dni)) { showAlert('DNI inválido: 7 a 10 dígitos'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('Email inválido'); return; }
  if (sector.length < 2) { showAlert('Completá tu sector'); return; }
  if (pwd.length < 8) { showAlert('La contraseña debe tener al menos 8 caracteres'); return; }

  const reset = setButtonBusy('btnReg', 'Creando cuenta...');
  try {
    const res = await apiFetch('/api/auth/register', {
      method: 'POST',
      body: JSON.stringify({
        username, password: pwd, display_name: displayName,
        dni, email, sector, company, city
      })
    });
    setToken(res.access_token);
    localStorage.setItem('prode_user', JSON.stringify(res.user));
    state.currentUser = res.user;
    state.view = 'fixture';
    state.regCompany = null;
    state.regCity = null;
    await loadAppData();
    startBackgroundPolling();
    showToast('¡Cuenta creada! Bienvenido ' + (res.user.display_name || username));
    render();
  } catch (e) {
    const msg = mapRegisterError(e);
    showAlert(msg);
    showToast(msg, 'error');
  } finally {
    if (reset) reset();
  }
}

async function loadAppData() {
  try {
    const [fixturesData, predictions, finalPick, leaderboard] = await Promise.all([
      apiFetch('/api/fixtures'),
      apiFetch('/api/predictions/me'),
      apiFetch('/api/final-pick/me'),
      apiFetch('/api/leaderboard')
    ]);
    state.cache.deadlinesUtc = (fixturesData && fixturesData.deadlines_utc) || {};

    const predMap = {};
    (predictions || []).forEach(p => {
      predMap[p.match_id] = { home: p.home_score, away: p.away_score };
    });
    state.cache.predictions = predMap;

    state.cache.finalPick = finalPick
      ? { champion: finalPick.champion, runnerUp: finalPick.runner_up }
      : {};
    state.cache.leaderboard = leaderboard || [];
    _captureMyStats(leaderboard);
    state.cache.loaded = true;
  } catch (e) {
    showToast('Error cargando datos: ' + (e.message || ''), 'error');
  }
}

function _captureMyStats(rows) {
  if (!state.currentUser || !Array.isArray(rows)) return;
  const row = rows.find(r => r.username === state.currentUser.username);
  if (row) state.cache.myStats = row;
}

async function refreshLeaderboard() {
  const t = state.rankingType;
  let qs = '';
  if (t === 'grupo_gestion' || t === 'carrefour') qs = '?company=' + encodeURIComponent(t);
  else if (t === 'isidro_casanova' || t === 'esteban_echeverria') qs = '?city=' + encodeURIComponent(t);
  try {
    const rows = await apiFetch('/api/leaderboard' + qs) || [];
    state.cache.leaderboard = rows;
    _captureMyStats(rows);
  } catch (e) { /* no romper UI */ }
}

async function bindApp() {
  document.getElementById('btnLogout').onclick = () => {
    stopBackgroundPolling();
    clearAuth();
    state.currentUser = null;
    state.view = 'login';
    state.authMode = 'login';
    state.cache = { predictions: {}, officialResults: {}, officialFinal: {}, finalPick: {}, leaderboard: [], myStats: null, deadlinesUtc: {}, loaded: false };
    state.comments = [];
    state.live = null;
    render();
  };
  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => { state.view = t.dataset.view; renderContent(); };
  });
  await renderContent();
}

async function renderContent() {
  const c = document.getElementById('content');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.view);
  });

  if (!state.cache.loaded) {
    c.innerHTML = '<div class="empty-state"><span class="icon">⏳</span>Cargando datos...</div>';
    return;
  }

  // Refrescar leaderboard al entrar al ranking (la cache del backend dura 30s igual)
  if (state.view === 'ranking') await refreshLeaderboard();

  if (state.view === 'fixture') c.innerHTML = renderFixture();
  else if (state.view === 'campeon') c.innerHTML = renderCampeon();
  else if (state.view === 'ranking') c.innerHTML = renderRanking();
  else if (state.view === 'reglas') c.innerHTML = renderReglas();
  else if (state.view === 'admin') c.innerHTML = renderAdmin();

  bindContent();
}

function renderFixture() {
  const u = state.currentUser;
  const predictions = state.cache.predictions;
  const officialResults = state.cache.officialResults;

  // Puntos: el backend los manda en /api/leaderboard (cache de la fila propia)
  const myPoints = state.cache.myStats ? state.cache.myStats.points : 0;

  const totalMatches = FIXTURE.length;
  const predicted = Object.keys(predictions).length;
  const played = Object.keys(officialResults).length;

  const phases = [
    { key: 'all', label: 'Todos' },
    { key: 'grupos', label: 'Grupos' },
    { key: 'dieciseisavos', label: '16vos' },
    { key: 'octavos', label: 'Octavos' },
    { key: 'cuartos', label: 'Cuartos' },
    { key: 'semis', label: 'Semis' },
    { key: 'tercerpuesto', label: '3er Puesto' },
    { key: 'final', label: 'FINAL' }
  ];

  let filtered = state.phaseFilter === 'all' ? FIXTURE : FIXTURE.filter(m => m.phase === state.phaseFilter);

  // Helper: banner de estado por fase (cerrada / deadline)
  function phaseBanner(phaseKey, phaseLabel) {
    const dl = phaseDeadline(phaseKey);
    if (!dl) return '';
    const locked = Date.now() >= dl.getTime();
    if (locked) {
      return `<div class="phase-locked-banner">
        🔒 <span><strong>${phaseLabel}:</strong> Pronósticos cerrados (la fase ya comenzó)</span>
      </div>`;
    }
    return `<div class="phase-locked-banner" style="border-color:rgba(0,200,83,0.4);color:#B3F5C9;background:rgba(0,200,83,0.06);">
      ⏳ <span><strong>${phaseLabel}:</strong> Podés cargar y modificar hasta <strong>${fmtDeadline(dl)}</strong></span>
    </div>`;
  }

  let groupedHtml = '';
  if (state.phaseFilter === 'all' || state.phaseFilter === 'grupos') {
    const byGroup = {};
    filtered.filter(m => m.phase === 'grupos').forEach(m => {
      if (!byGroup[m.group]) byGroup[m.group] = [];
      byGroup[m.group].push(m);
    });
    // Banner único para la fase de grupos (antes del primer grupo)
    const groupsBanner = Object.keys(byGroup).length ? phaseBanner('grupos', 'Fase de Grupos') : '';
    if (groupsBanner) groupedHtml += groupsBanner;
    for (const g of Object.keys(byGroup)) {
      groupedHtml += `<div class="match-group">
        <div class="match-group-title">GRUPO ${g}</div>
        ${byGroup[g].map(m => renderMatch(m, predictions, officialResults)).join('')}
      </div>`;
    }
  }

  const knockoutPhases = ['dieciseisavos','octavos','cuartos','semis','tercerpuesto','final'];
  for (const ph of knockoutPhases) {
    if (state.phaseFilter !== 'all' && state.phaseFilter !== ph) continue;
    const phMatches = filtered.filter(m => m.phase === ph);
    if (phMatches.length === 0) continue;
    const label = phases.find(p => p.key === ph)?.label || ph;
    groupedHtml += `<div class="match-group">
      <div class="match-group-title">${label.toUpperCase()}</div>
      ${phaseBanner(ph, label)}
      ${phMatches.map(m => renderMatch(m, predictions, officialResults)).join('')}
    </div>`;
  }

  return `
  ${renderLiveWidget()}

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-value">${myPoints}</div><div class="stat-label">Mis Puntos</div></div>
    <div class="stat-card"><div class="stat-value">${predicted}</div><div class="stat-label">Pronosticados</div></div>
    <div class="stat-card"><div class="stat-value">${played}</div><div class="stat-label">Jugados</div></div>
    <div class="stat-card"><div class="stat-value">${totalMatches}</div><div class="stat-label">Total</div></div>
  </div>

  <div class="champion-info-banner">
    🏆 <span>No te olvides de elegir <strong>Campeón</strong> y <strong>Subcampeón</strong> en su pestaña: suman <strong>+10</strong> y <strong>+5</strong> puntos extra.</span>
  </div>

  <div class="phase-filter">
    ${phases.map(p => `<button class="phase-btn ${state.phaseFilter === p.key ? 'active' : ''}" data-phase="${p.key}">${p.label}</button>`).join('')}
  </div>

  ${groupedHtml || '<div class="empty-state"><span class="icon">⚽</span>No hay partidos para mostrar.</div>'}`;
}

function renderMatch(m, predictions, officialResults) {
  const homeT = TEAMS[m.home];
  const awayT = TEAMS[m.away];
  const homeName = homeT ? homeT.name : (m.homeLabel || 'Por definir');
  const awayName = awayT ? awayT.name : (m.awayLabel || 'Por definir');

  const homeFlagEl = homeT ? flagHtml(m.home) : '<span class="team-flag-placeholder">?</span>';
  const awayFlagEl = awayT ? flagHtml(m.away) : '<span class="team-flag-placeholder">?</span>';

  const pred = predictions[m.id] || {};
  const off = officialResults[m.id];
  const hasOfficial = off && off.home != null && off.away != null;
  const hasPrediction = pred.home != null && pred.away != null;
  const phaseLocked = isPhaseLocked(m.phase);
  const isEditing = state.editingMatches.has(m.id);

  // Decisión de modo:
  //  - hasOfficial → vista de resultado final, sin editar
  //  - phaseLocked && hasPrediction → vista bloqueada con candado, sin botón modificar
  //  - phaseLocked && !hasPrediction → vista bloqueada, sin pronóstico cargado
  //  - !phaseLocked && hasPrediction && !isEditing → vista bloqueada CON botón "Modificar"
  //  - !phaseLocked && (!hasPrediction || isEditing) → editable
  const canEditNow = !hasOfficial && !phaseLocked && homeT && awayT && (isEditing || !hasPrediction);
  const showModifyBtn = !hasOfficial && !phaseLocked && hasPrediction && !isEditing && homeT && awayT;
  const showLockBadge = !hasOfficial && phaseLocked;

  let cardClass = 'match-card';
  if (hasOfficial) cardClass += ' finished';
  else if (hasPrediction && phaseLocked) cardClass += ' predicted locked';
  else if (hasPrediction) cardClass += ' predicted';

  const dateObj = new Date(m.date + 'T12:00');
  const dateStr = dateObj.toLocaleDateString('es-AR', {
    weekday: 'short', day: '2-digit', month: 'short'
  });
  const timeStr = m.time ? `${m.time} hs` : '';
  const venueStr = m.venue || '';

  let pointsBadge = '';
  let officialDisp = '';
  if (hasOfficial) {
    const pts = hasPrediction ? calcPoints(pred, off) : 0;
    pointsBadge = `<span class="points-badge ${pts > 0 ? '' : 'zero'}">${pts} PTS</span>`;
    officialDisp = `<div class="official-result">⚽ Resultado oficial: ${off.home} - ${off.away}</div>`;
  }

  // Badge de estado para que el usuario entienda qué le pasa al partido
  let statusBadge = '';
  if (showLockBadge && hasPrediction) {
    statusBadge = `<span class="status-pill locked">🔒 Cerrado</span>`;
  } else if (showLockBadge && !hasPrediction) {
    statusBadge = `<span class="status-pill missed">⏰ Sin pronóstico</span>`;
  } else if (showModifyBtn) {
    statusBadge = `<span class="status-pill saved">✓ Guardado</span>`;
  }

  // Valores a mostrar en los inputs/celdas de score
  const homeVal = pred.home != null ? pred.home : '';
  const awayVal = pred.away != null ? pred.away : '';

  // Bloque de score: si está editando → inputs; si tiene pronóstico bloqueado → cajas de display
  let scoreBlock = '';
  if (canEditNow) {
    scoreBlock = `
      <input type="number" min="0" max="20" class="score-input" data-side="home" data-id="${m.id}" value="${homeVal}">
      <span class="vs">VS</span>
      <input type="number" min="0" max="20" class="score-input" data-side="away" data-id="${m.id}" value="${awayVal}">`;
  } else if (hasPrediction) {
    // mostrar como cajas estilo "display" con los valores
    scoreBlock = `
      <div class="score-display ${phaseLocked && !hasOfficial ? 'locked' : ''}">${homeVal}</div>
      <span class="vs">VS</span>
      <div class="score-display ${phaseLocked && !hasOfficial ? 'locked' : ''}">${awayVal}</div>`;
  } else {
    // sin pronóstico y sin permitir editar (fase cerrada o partido sin equipos)
    scoreBlock = `
      <input type="number" class="score-input" value="" disabled>
      <span class="vs">VS</span>
      <input type="number" class="score-input" value="" disabled>`;
  }

  // Footer: depende del estado
  let footerBtns = '';
  if (hasOfficial) {
    footerBtns = pointsBadge; // sólo puntos
  } else if (showModifyBtn) {
    footerBtns = `${statusBadge}<button class="btn-modify" data-modify="${m.id}">✏️ Modificar</button>`;
  } else if (canEditNow && hasPrediction) {
    // está editando un pronóstico ya guardado → Guardar + Cancelar
    footerBtns = `
      <button class="btn-cancel" data-cancel="${m.id}">Cancelar</button>
      <button class="btn-save" data-save="${m.id}">💾 Actualizar</button>`;
  } else if (canEditNow) {
    // primera vez cargando
    footerBtns = `<button class="btn-save" data-save="${m.id}">Guardar</button>`;
  } else if (showLockBadge) {
    footerBtns = statusBadge;
  }

  return `
  <div class="${cardClass}" data-match-id="${m.id}">
    <div class="match-meta">
      <span class="match-datetime">📅 ${dateStr} ${timeStr ? `· 🕐 <strong>${timeStr}</strong>` : ''}</span>
      ${m.group ? `<span class="group-tag">GRUPO ${m.group}</span>` : ''}
    </div>
    ${venueStr ? `<div class="match-venue">📍 ${venueStr}</div>` : ''}
    <div class="match-row">
      <div class="team home">
        <span class="team-name">${homeName}</span>
        ${homeFlagEl}
      </div>
      <div class="score-block">
        ${scoreBlock}
      </div>
      <div class="team away">
        ${awayFlagEl}
        <span class="team-name">${awayName}</span>
      </div>
    </div>
    <div class="match-footer">
      ${officialDisp || '<span></span>'}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        ${footerBtns}
      </div>
    </div>
  </div>`;
}

function renderCampeon() {
  const myPick = state.cache.finalPick || {};
  const officialFinal = state.cache.officialFinal || {};

  // Cerrado por resultado oficial cargado por admin
  const lockedByAdmin = !!(officialFinal.champion || officialFinal.runnerUp);
  // Cerrado por tiempo: el backend usa el inicio de semifinales como deadline del final pick
  const lockedByTime = isPhaseLocked('semis');
  const locked = lockedByAdmin || lockedByTime;
  // ¿Está en modo edición? — usamos la misma key 'final' en editingMatches
  const isEditing = state.editingMatches.has('final');
  const hasPicks = !!(myPick.champion || myPick.runnerUp);
  // Se puede editar si: no está bloqueado, y o bien (no hay picks) o (hay picks y pidió editar)
  const canEdit = !locked && (isEditing || !hasPicks);
  const showModify = !locked && hasPicks && !isEditing;

  // Lista ordenada alfabéticamente
  const teamList = Object.keys(TEAMS).sort((a, b) => TEAMS[a].name.localeCompare(TEAMS[b].name));

  function teamOptions(selectedCode) {
    return teamList.map(code => {
      const t = TEAMS[code];
      return `<option value="${code}" ${selectedCode === code ? 'selected' : ''}>${t.name}</option>`;
    }).join('');
  }

  function selectionDisplay(code, fallback, statusType) {
    // statusType: 'saved' | 'locked' | 'official' | null
    let extraClass = '';
    let pill = '';
    if (statusType === 'saved') {
      extraClass = ' saved';
      pill = `<span class="status-pill saved">✓ Guardado</span>`;
    } else if (statusType === 'locked') {
      extraClass = ' locked';
      pill = `<span class="status-pill locked">🔒 Cerrado</span>`;
    }
    if (!code || !TEAMS[code]) {
      return `<div class="champion-current${extraClass}" style="opacity:0.5;">
        <span class="team-flag-placeholder">?</span>
        <span class="champion-current-name">${fallback}</span>
        ${pill}
      </div>`;
    }
    const t = TEAMS[code];
    return `<div class="champion-current${extraClass}">
      <img src="${flagUrl(t.iso, 'w160')}" alt="${t.name}">
      <span class="champion-current-name">${t.name}</span>
      ${pill}
    </div>`;
  }

  let officialBanner = '';
  if (officialFinal.champion || officialFinal.runnerUp) {
    const champName = officialFinal.champion ? TEAMS[officialFinal.champion]?.name : '?';
    const runName = officialFinal.runnerUp ? TEAMS[officialFinal.runnerUp]?.name : '?';
    let myExtra = 0;
    if (officialFinal.champion && myPick.champion === officialFinal.champion) myExtra += PTS_CAMPEON;
    if (officialFinal.runnerUp && myPick.runnerUp === officialFinal.runnerUp) myExtra += PTS_SUBCAMPEON;
    officialBanner = `<div class="champion-info-banner">
      ✅ <span>Resultado oficial: <strong>🥇 ${champName}</strong> · <strong>🥈 ${runName}</strong>. Sumaste <strong>+${myExtra}</strong> puntos extra.</span>
    </div>`;
  }

  // Banner de estado de la elección
  let stateBanner = '';
  if (lockedByTime && !lockedByAdmin) {
    stateBanner = `<div class="phase-locked-banner">
      🔒 <span><strong>Elección cerrada:</strong> empezaron las semifinales.</span>
    </div>`;
  } else if (!locked) {
    const dl = phaseDeadline('semis');
    stateBanner = `<div class="champion-info-banner">

async function saveFinalPick() {
  if (isPhaseLocked('semis')) {
    showToast('Las semifinales ya empezaron, no podés modificar', 'error');
    state.editingMatches.delete('final');
    renderContent();
    return;
  }
  const selChamp = document.getElementById('selectChampion');
  const selRun = document.getElementById('selectRunnerUp');
  if (!selChamp || !selRun) { showToast('Error: faltan campos', 'error'); return; }
  const champion = selChamp.value;
  const runnerUp = selRun.value;
  if (!champion || !runnerUp) { showToast('Elegí campeón y subcampeón', 'error'); return; }
  if (champion === runnerUp) { showToast('Campeón y subcampeón deben ser distintos', 'error'); return; }

  const reset = setButtonBusy('btnSaveFinal', 'Guardando...');
  try {
    const res = await apiFetch('/api/final-pick', {
      method: 'PUT',
      body: JSON.stringify({ champion, runner_up: runnerUp })
    });
    state.cache.finalPick = { champion: res.champion, runnerUp: res.runner_up };
    state.editingMatches.delete('final');
    await refreshLeaderboard();
    confetti({ intensity: 'big' });
    showToast('🏆 ¡Campeón y subcampeón guardados!');
    renderContent();
  } catch (e) {
    showToast(e.message || 'Error al guardar', 'error');
  } finally {
    if (reset) reset();
  }
}

const COMPANY_LABELS = { grupo_gestion: 'GG', carrefour: 'Carr' };
const COMPANY_NAMES = { grupo_gestion: 'Grupo Gestión', carrefour: 'Carrefour' };
const CITY_LABELS = { isidro_casanova: 'Casanova', esteban_echeverria: 'Echeverría' };
const CITY_NAMES = { isidro_casanova: 'Isidro Casanova', esteban_echeverria: 'Esteban Echeverría' };

function companyTag(company) {
  if (!company) return '';
  const cls = company === 'carrefour' ? 'carrefour' : '';
  const label = COMPANY_LABELS[company] || company;
  const full = COMPANY_NAMES[company] || company;
  return `<span class="ranking-company-tag ${cls}" title="${full}">${label}</span>`;
}

function cityTag(city) {
  if (!city) return '';
  const label = CITY_LABELS[city] || city;
  const full = CITY_NAMES[city] || city;
  return `<span class="comment-tag sede" title="${full}">${label}</span>`;
}

function renderRanking() {
  const me = state.currentUser.username;
  const sorted = (state.cache.leaderboard || []).slice();
  const podio = sorted.slice(0, 3);
  const active = state.rankingType || 'general';

  let podioHtml = '';
  if (podio.length > 0) {
    const order = ['second', 'first', 'third'];
    const idx = [1, 0, 2];
    const medals = ['🥈', '🥇', '🥉'];
    podioHtml = '<div class="podium">';
    for (let i = 0; i < 3; i++) {
      const u = podio[idx[i]];
      if (!u) podioHtml += `<div class="podium-spot ${order[i]}"></div>`;
      else {
        podioHtml += `<div class="podium-spot ${order[i]}">
          <span class="podium-medal">${medals[i]}</span>
          <div class="podium-name">${u.display_name || u.username}</div>
          <div class="podium-points">${u.points}</div>
          <div class="podium-cat">${u.correct_exact} exactos · ${u.correct_result} resultado</div>
        </div>`;
      }
    }
    podioHtml += '</div>';
  }

  let listHtml = '';
  if (sorted.length === 0) {
    listHtml = '<div class="empty-state"><span class="icon">📊</span>Todavía no hay participantes en este ranking.</div>';
  } else {
    listHtml = '<div class="ranking-list">';
    sorted.forEach((u, i) => {

      const tags = [
        `<span class="ranking-cat-tag fc">${u.correct_exact} exactos</span>`,
        `<span class="ranking-cat-tag pe">${u.correct_result} resultado</span>`,
        companyTag(u.company),
        cityTag(u.city)

      listHtml += `<div class="ranking-row ${isMe ? 'me' : ''}">

        <div class="ranking-user">
          <div class="ranking-username">${u.display_name || u.username} ${isMe ? '👈' : ''}</div>

        </div>
        <div class="ranking-tags">${tags.join('')}</div>
        <div class="ranking-pts">${u.points}</div>
      </div>`;
    });
    listHtml += '</div>';
  }

  return `
  <div class="ranking-tabs">
    <button class="ranking-tab ${active === 'general' ? 'active' : ''}" data-type="general">🌍 General</button>
    <button class="ranking-tab ${active === 'grupo_gestion' ? 'active' : ''}" data-type="grupo_gestion">🏭 Grupo Gestión</button>
    <button class="ranking-tab ${active === 'carrefour' ? 'active' : ''}" data-type="carrefour">🛒 Carrefour</button>

  <div class="ranking-tabs" style="margin-top:-12px;">
    <button class="ranking-tab ${active === 'isidro_casanova' ? 'active' : ''}" data-type="isidro_casanova">🏭 I. Casanova</button>
    <button class="ranking-tab ${active === 'esteban_echeverria' ? 'active' : ''}" data-type="esteban_echeverria">🏢 E. Echeverría</button>
  </div>
  <div style="text-align:center;font-size:11px;color:rgba(255,255,255,0.55);margin:6px 0 12px;">
    ${sorted.length} participante${sorted.length === 1 ? '' : 's'}
  </div>
  ${podioHtml}
  ${listHtml}`;
}

async function savePrediction(matchId, opts = {}) {
  const match = FIXTURE.find(m => m.id === matchId);
  if (match && isPhaseLocked(match.phase)) {
    showToast('La fase ya está cerrada, no podés modificar', 'error');
    state.editingMatches.delete(matchId);
    renderContent();
    return;
  }
  const homeInp = document.querySelector(`input[data-id="${matchId}"][data-side="home"]`);
  const awayInp = document.querySelector(`input[data-id="${matchId}"][data-side="away"]`);
  if (!homeInp || !awayInp) return;
  const home = homeInp.value, away = awayInp.value;
  if (home === '' || away === '') {
    if (!opts.silent) showToast('Cargá ambos goles', 'error');
    return;
  }
  const homeN = parseInt(home), awayN = parseInt(away);
  if (homeN < 0 || awayN < 0 || homeN > 20 || awayN > 20) {
    if (!opts.silent) showToast('Goles entre 0 y 20', 'error');
    return;
  }

  const card = document.querySelector(`[data-match-id="${matchId}"]`);
  if (card) card.dataset.saving = '1';

  const wasNew = !state.cache.predictions[matchId];
  try {
    const res = await apiFetch(`/api/predictions/${encodeURIComponent(matchId)}`, {
      method: 'PUT',
      body: JSON.stringify({ home_score: homeN, away_score: awayN })
    });
    state.cache.predictions[matchId] = { home: res.home_score, away: res.away_score };
    confetti({ intensity: 'small' });
    if (wasNew) {
      const total = Object.keys(state.cache.predictions).length;
      if (total === 10 || total === 50 || total === 104) {
        setTimeout(() => confetti({ intensity: 'big' }), 250);
        showToast(total === 104 ? '🎉 ¡Cargaste TODOS los pronósticos! 🏆' : `🎉 ¡Llegaste a ${total} pronósticos!`);
      }
    }
    if (!opts.silent) {
      state.editingMatches.delete(matchId);
      showToast('Pronóstico guardado ✓');
      renderContent();
    } else {
      // En auto-save (debounce) no re-renderizo para no romper el foco del input
      if (card) card.dataset.saving = '0';
    }
  } catch (e) {
    if (e.status === 403) {
      showToast(e.message || 'La fase ya cerró', 'error');
      const prev = state.cache.predictions[matchId];
      if (prev) { homeInp.value = prev.home; awayInp.value = prev.away; }
      else { homeInp.value = ''; awayInp.value = ''; }
      renderContent();
    } else {
      showToast(e.message || 'Error al guardar', 'error');
    }
  } finally {
    if (card) card.dataset.saving = '0';
  }
}

function bindContent() {
  document.querySelectorAll('.phase-btn').forEach(b => {
    b.onclick = () => { state.phaseFilter = b.dataset.phase; renderContent(); };
  });
  document.querySelectorAll('[data-save]').forEach(btn => {
    btn.onclick = () => savePrediction(btn.dataset.save);
  });
  document.querySelectorAll('[data-modify]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.modify;
      const match = FIXTURE.find(m => m.id === id);
      if (match && isPhaseLocked(match.phase)) {
        showToast('La fase ya está cerrada', 'error');
        return;
      }
      state.editingMatches.add(id);
      renderContent();
    };
  });
  document.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = () => {
      state.editingMatches.delete(btn.dataset.cancel);
      renderContent();
    };
  });
  document.querySelectorAll('.ranking-tab').forEach(t => {
    t.onclick = () => {
      state.rankingType = t.dataset.type;
      try { localStorage.setItem('prode_lb_company', state.rankingType); } catch (e) {}
      renderContent();
    };
  });
  document.querySelectorAll('[data-admin-save]').forEach(btn => {
    btn.onclick = () => saveOfficialResult(btn.dataset.adminSave);
  });
  document.querySelectorAll('[data-admin-delete]').forEach(btn => {
    btn.onclick = () => deleteOfficialResult(btn.dataset.adminDelete);
  });

  // Auto-save debounced de predicciones al tipear en los inputs
  document.querySelectorAll('input.score-input[data-id]').forEach(input => {
    input.addEventListener('input', () => {
      const id = input.dataset.id;
      debounce('pred:' + id, () => savePrediction(id, { silent: true }), 500);
    });
  });

  const btnSaveFinal = document.getElementById('btnSaveFinal');
  if (btnSaveFinal) btnSaveFinal.onclick = saveFinalPick;
  const btnModifyFinal = document.getElementById('btnModifyFinal');
  if (btnModifyFinal) btnModifyFinal.onclick = () => {
    if (isPhaseLocked('semis')) { showToast('Las semifinales ya empezaron', 'error'); return; }
    state.editingMatches.add('final');
    renderContent();
  };
  const btnCancelFinal = document.getElementById('btnCancelFinal');
  if (btnCancelFinal) btnCancelFinal.onclick = () => {
    state.editingMatches.delete('final');
    renderContent();
  };
  const btnSaveFinalOfficial = document.getElementById('btnSaveFinalOfficial');
  if (btnSaveFinalOfficial) btnSaveFinalOfficial.onclick = saveOfficialFinal;
}

// INIT — validar token y cargar datos antes de renderizar
