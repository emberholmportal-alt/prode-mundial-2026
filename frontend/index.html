function renderFixture() {
  const u = state.currentUser;
  const predictions = state.cache.predictions;
  const officialResults = state.cache.officialResults;
  const fp = state.cache.finalPick || {};
  const hasFinalPick = !!(fp.champion && fp.runnerUp);

  if (!hasFinalPick) {
    return `<div class="empty-state" style="padding:48px 24px;">
      <span class="icon">🏆</span>
      <h2 style="margin:0 0 10px;font-size:18px;letter-spacing:1.5px;color:#ffd0a8;">PRIMERO ELEGÍ CAMPEÓN Y SUBCAMPEÓN</h2>
      <p style="font-size:13px;color:rgba(255,255,255,0.7);max-width:420px;margin:0 auto 18px;line-height:1.5;">
        No podés cargar pronósticos de partidos hasta que elijas <strong>Campeón</strong> y <strong>Subcampeón</strong>.
        Tenés tiempo hasta <strong>1 hora antes del primer partido</strong> para cambiarlo.
      </p>
      <button class="btn-primary" id="goToCampeon" style="max-width:280px;margin:0 auto;display:block;">🏆 Ir a Campeón</button>
    </div>`;
  }

  // Puntos: el backend los manda en /api/leaderboard (cache de la fila propia)
  const myPoints = state.cache.myStats ? state.cache.myStats.points : 0;

  const totalMatches = FIXTURE.length;
  const predicted = Object.keys(predictions).length;
  const played = Object.keys(officialResults).length;

  const todayArt = _todayArtDate();
  const tomorrowArt = _tomorrowArtDate();
  const todayMatches = FIXTURE.filter(m => m.date === todayArt);
  const tomorrowMatches = FIXTURE.filter(m => m.date === tomorrowArt);
  const hasMatchesToday = todayMatches.length > 0;

  const phases = [
    { key: 'all', label: 'Todos' },
    { key: 'hoy', label: `⚡ Hoy${hasMatchesToday ? ` (${todayMatches.length})` : ''}` },
    { key: 'grupos', label: 'Grupos' },
    { key: 'dieciseisavos', label: '16vos' },
    { key: 'octavos', label: 'Octavos' },
    { key: 'cuartos', label: 'Cuartos' },
    { key: 'semis', label: 'Semis' },
    { key: 'tercerpuesto', label: '3er Puesto' },
    { key: 'final', label: 'FINAL' }
  ];

  let filtered;
  if (state.phaseFilter === 'hoy') filtered = [...todayMatches, ...tomorrowMatches];
  else if (state.phaseFilter === 'all') filtered = FIXTURE;
  else filtered = FIXTURE.filter(m => m.phase === state.phaseFilter);

  // Banner informativo de la fase. El cierre real ahora es por PARTIDO
  // individual (kickoff − 1h), no por fase, así que el banner solo recuerda
  // la regla. Cada card del partido muestra su propio estado de lock.
  function phaseBanner(phaseKey, phaseLabel) {
    const dl = phaseDeadline(phaseKey);
    if (!dl) return '';
    return `<div class="phase-locked-banner" style="border-color:rgba(0,200,83,0.4);color:#B3F5C9;background:rgba(0,200,83,0.06);">
      ⏳ <span><strong>${phaseLabel}:</strong> cada partido se puede cargar o modificar hasta <strong>1 hora antes de su kickoff</strong>.</span>
    </div>`;
  }

  let groupedHtml = '';
  if (state.phaseFilter === 'hoy') {
    const todaySorted = [...todayMatches].sort((a, b) => _matchKickoffMs(a) - _matchKickoffMs(b));
    const tomorrowSorted = [...tomorrowMatches].sort((a, b) => _matchKickoffMs(a) - _matchKickoffMs(b));
    if (todaySorted.length === 0 && tomorrowSorted.length === 0) {
      groupedHtml = `<div class="empty-state"><span class="icon">📅</span>No hay partidos hoy ni mañana. Volvé otro día o mirá las próximas fases.</div>`;
    } else {
      if (todaySorted.length > 0) {
        groupedHtml += `<div class="match-group">
          <div class="match-group-title">⚡ PARTIDOS DE HOY</div>
          <div class="phase-locked-banner" style="border-color:rgba(255,76,76,0.45);color:#ffd4d4;background:rgba(255,76,76,0.08);">
            ⏳ <span>Cada partido se puede cargar o modificar hasta <strong>1 hora antes de su kickoff</strong>. ¡No te quedes afuera!</span>
          </div>
          ${todaySorted.map(m => renderMatch(m, predictions, officialResults)).join('')}
        </div>`;
      } else {
        groupedHtml += `<div class="empty-state" style="margin-bottom:18px;"><span class="icon">📅</span>Hoy no hay partidos.</div>`;
      }
      if (tomorrowSorted.length > 0) {
        groupedHtml += `<div class="match-group">
          <div class="match-group-title">📅 PARTIDOS DE MAÑANA</div>
          ${tomorrowSorted.map(m => renderMatch(m, predictions, officialResults)).join('')}
        </div>`;
      }
    }
  }
  if (state.phaseFilter === 'all' || state.phaseFilter === 'grupos') {
    const byGroup = {};
    filtered.filter(m => m.phase === 'grupos').forEach(m => {
      if (!byGroup[m.group]) byGroup[m.group] = [];
      byGroup[m.group].push(m);
    });
    // Banner único para la fase de grupos (antes del primer grupo)
    const groupsBanner = Object.keys(byGroup).length ? phaseBanner('grupos', 'Fase de Grupos') : '';
    if (groupsBanner) groupedHtml += groupsBanner;
    for (const g of Object.keys(byGroup)) {
      groupedHtml += `<div class="match-group">
        <div class="match-group-title">GRUPO ${g}</div>
        ${byGroup[g].map(m => renderMatch(m, predictions, officialResults)).join('')}
      </div>`;
    }
  }

  const knockoutPhases = ['dieciseisavos','octavos','cuartos','semis','tercerpuesto','final'];
  for (const ph of knockoutPhases) {
    if (state.phaseFilter !== 'all' && state.phaseFilter !== ph) continue;
    const phMatches = filtered.filter(m => m.phase === ph);
    if (phMatches.length === 0) continue;
    const label = phases.find(p => p.key === ph)?.label || ph;
    groupedHtml += `<div class="match-group">
      <div class="match-group-title">${label.toUpperCase()}</div>
      ${phaseBanner(ph, label)}
      ${phMatches.map(m => renderMatch(m, predictions, officialResults)).join('')}
    </div>`;
  }

  return `
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-value">${myPoints}</div><div class="stat-label">Mis Puntos</div></div>
    <div class="stat-card"><div class="stat-value">${predicted}</div><div class="stat-label">Pronosticados</div></div>
    <div class="stat-card"><div class="stat-value">${played}</div><div class="stat-label">Jugados</div></div>
    <div class="stat-card"><div class="stat-value">${totalMatches}</div><div class="stat-label">Total</div></div>
  </div>

  <div class="champion-info-banner">
    🏆 <span>No te olvides de elegir <strong>Campeón</strong> y <strong>Subcampeón</strong> en su pestaña: suman <strong>+10</strong> y <strong>+5</strong> puntos extra.</span>
  </div>

  <div class="phase-filter">
    ${phases.map(p => {
      const isActive = state.phaseFilter === p.key;
      const isToday = p.key === 'hoy';
      const extra = isToday ? ` phase-today${hasMatchesToday && !isActive ? ' beats' : ''}` : '';
      return `<button class="phase-btn${isActive ? ' active' : ''}${extra}" data-phase="${p.key}">${p.label}</button>`;
    }).join('')}
  </div>

  ${groupedHtml || '<div class="empty-state"><span class="icon">⚽</span>No hay partidos para mostrar.</div>'}`;
}

function _penaltyWinnerBlock(m, pred, off, ctx) {
  // Solo aplica a knockouts.
  if (!ctx.isKnockout) return '';
  const homeTla = (m.home || '').toUpperCase();
  const awayTla = (m.away || '').toUpperCase();
  if (homeTla === 'TBD' || awayTla === 'TBD') return '';
  const tName = (tla) => (TEAMS[tla] && TEAMS[tla].name) || tla;
  const predPw = pred && pred.penalty_winner ? pred.penalty_winner.toUpperCase() : '';
  const offPw = off && off.penalty_winner ? off.penalty_winner.toUpperCase() : '';

  if (ctx.canEditNow) {
    // Solo visible cuando el marcador previsto es empate (home === away, ambos
    // cargados). Si no, queda oculto y se muestra/oculta dinámicamente con
    // _togglePenBlock al tipear los goles.
    const ph = pred && pred.home;
    const pa = pred && pred.away;
    const isDraw = ph != null && pa != null && ph !== '' && pa !== '' && +ph === +pa;
    return `
    <div class="pen-block" data-pen-id="${m.id}" ${isDraw ? '' : 'style="display:none;"'}>
      <div class="pen-label">Empate: ¿quién pasa por penales?</div>
      <div class="pen-options">
        <label class="pen-opt ${predPw === homeTla ? 'selected' : ''}">
          <input type="radio" name="pw-${m.id}" value="${homeTla}" data-pen-input="${m.id}" ${predPw === homeTla ? 'checked' : ''}>
          <span>${tName(homeTla)}</span>
        </label>
        <label class="pen-opt ${predPw === awayTla ? 'selected' : ''}">
          <input type="radio" name="pw-${m.id}" value="${awayTla}" data-pen-input="${m.id}" ${predPw === awayTla ? 'checked' : ''}>
          <span>${tName(awayTla)}</span>
        </label>
      </div>
      <div class="pen-hint">Obligatorio porque predecís empate.</div>
    </div>`;
  }
  if (ctx.hasPrediction && predPw) {
    return `<div class="pen-display">⚽ Tu pase por penales: <strong>${tName(predPw)}</strong></div>`;
  }
  return '';
}

// Muestra/oculta el bloque de penales de un partido según si el marcador
// cargado en los inputs es empate. Si deja de ser empate, limpia la selección.
function _togglePenBlockGeneric(block, homeInp, awayInp) {
  if (!block || !homeInp || !awayInp) return;
  const h = homeInp.value, a = awayInp.value;
  const isDraw = h !== '' && a !== '' && parseInt(h) === parseInt(a);
  if (isDraw) {
    block.style.display = '';
  } else {
    block.style.display = 'none';
    block.querySelectorAll('input[type="radio"]').forEach(r => { r.checked = false; });
    block.querySelectorAll('.pen-opt').forEach(o => o.classList.remove('selected'));
  }
}
function _togglePenBlock(matchId) {
  _togglePenBlockGeneric(
    document.querySelector(`.pen-block[data-pen-id="${matchId}"]`),
    document.querySelector(`input[data-id="${matchId}"][data-side="home"]`),
    document.querySelector(`input[data-id="${matchId}"][data-side="away"]`)
  );
}
function _togglePenBlockAdmin(matchId) {
  _togglePenBlockGeneric(
    document.querySelector(`.pen-block[data-admin-pen-id="${matchId}"]`),
    document.querySelector(`input[data-admin-id="${matchId}"][data-side="home"]`),
    document.querySelector(`input[data-admin-id="${matchId}"][data-side="away"]`)
  );
}

function renderMatch(m, predictions, officialResults) {
  const homeT = TEAMS[m.home];
  const awayT = TEAMS[m.away];
  const homeName = homeT ? homeT.name : (m.homeLabel || 'Por definir');
  const awayName = awayT ? awayT.name : (m.awayLabel || 'Por definir');

  const homeFlagEl = homeT ? flagHtml(m.home) : '<span class="team-flag-placeholder">?</span>';
  const awayFlagEl = awayT ? flagHtml(m.away) : '<span class="team-flag-placeholder">?</span>';

  const pred = predictions[m.id] || {};
  const off = officialResults[m.id];
  const hasOfficial = off && off.home != null && off.away != null;
  const hasPrediction = pred.home != null && pred.away != null;
  const phaseLocked = isMatchLocked(m.id);
  const isEditing = state.editingMatches.has(m.id);

  // Decisión de modo:
  //  - hasOfficial → vista de resultado final, sin editar
  //  - phaseLocked && hasPrediction → vista bloqueada con candado, sin botón modificar
  //  - phaseLocked && !hasPrediction → vista bloqueada, sin pronóstico cargado
  //  - !phaseLocked && hasPrediction && !isEditing → vista bloqueada CON botón "Modificar"
  //  - !phaseLocked && (!hasPrediction || isEditing) → editable
  const canEditNow = !hasOfficial && !phaseLocked && homeT && awayT && (isEditing || !hasPrediction);
  const showModifyBtn = !hasOfficial && !phaseLocked && hasPrediction && !isEditing && homeT && awayT;
  const showLockBadge = !hasOfficial && phaseLocked;

  let cardClass = 'match-card';
  if (hasOfficial) cardClass += ' finished';
  else if (hasPrediction && phaseLocked) cardClass += ' predicted locked';
  else if (hasPrediction) cardClass += ' predicted';

  const dateObj = new Date(m.date + 'T12:00');
  const dateStr = dateObj.toLocaleDateString('es-AR', {
    weekday: 'short', day: '2-digit', month: 'short'
  });
  const timeStr = m.time ? `${m.time} hs` : '';
  const venueStr = m.venue || '';

  const isKnockout = m.phase && m.phase !== 'grupos';
  let pointsBadge = '';
  let officialDisp = '';
  if (hasOfficial) {
    const pts = hasPrediction ? calcPoints(pred, off, m) : 0;
    pointsBadge = `<span class="points-badge ${pts > 0 ? '' : 'zero'}">${pts} PTS</span>`;
    const offPwLbl = (isKnockout && off.penalty_winner && off.home === off.away)
      ? ` · pasó por penales: <strong>${(TEAMS[off.penalty_winner] && TEAMS[off.penalty_winner].name) || off.penalty_winner}</strong>`
      : '';
    officialDisp = `<div class="official-result">⚽ Resultado oficial (90' + alargue): ${off.home} - ${off.away}${offPwLbl}</div>`;
  }

  // Badge de estado para que el usuario entienda qué le pasa al partido
  let statusBadge = '';
  if (showLockBadge && hasPrediction) {
    statusBadge = `<span class="status-pill locked">🔒 Cerrado</span>`;
  } else if (showLockBadge && !hasPrediction) {
    statusBadge = `<span class="status-pill missed">⏰ Sin pronóstico</span>`;
  } else if (showModifyBtn) {
    statusBadge = `<span class="status-pill saved">✓ Guardado</span>`;
  }

  // Valores a mostrar en los inputs/celdas de score
  const homeVal = pred.home != null ? pred.home : '';
  const awayVal = pred.away != null ? pred.away : '';

  // Bloque de score: si está editando → inputs; si tiene pronóstico bloqueado → cajas de display
  let scoreBlock = '';
  if (canEditNow) {
    scoreBlock = `
      <input type="number" min="0" max="20" class="score-input" data-side="home" data-id="${m.id}" value="${homeVal}">
      <span class="vs">VS</span>
      <input type="number" min="0" max="20" class="score-input" data-side="away" data-id="${m.id}" value="${awayVal}">`;
  } else if (hasPrediction) {
    // mostrar como cajas estilo "display" con los valores
    scoreBlock = `
      <div class="score-display ${phaseLocked && !hasOfficial ? 'locked' : ''}">${homeVal}</div>
      <span class="vs">VS</span>
      <div class="score-display ${phaseLocked && !hasOfficial ? 'locked' : ''}">${awayVal}</div>`;
  } else {
    // sin pronóstico y sin permitir editar (fase cerrada o partido sin equipos)
    scoreBlock = `
      <input type="number" class="score-input" value="" disabled>
      <span class="vs">VS</span>
      <input type="number" class="score-input" value="" disabled>`;
  }

  // Footer: depende del estado
  let footerBtns = '';
  if (hasOfficial) {
    footerBtns = pointsBadge; // sólo puntos
  } else if (showModifyBtn) {
    footerBtns = `${statusBadge}<button class="btn-modify" data-modify="${m.id}">✏️ Modificar</button>`;
  } else if (canEditNow && hasPrediction) {
    // está editando un pronóstico ya guardado → Guardar + Cancelar
    footerBtns = `
      <button class="btn-cancel" data-cancel="${m.id}">Cancelar</button>
      <button class="btn-save" data-save="${m.id}">💾 Actualizar</button>`;
  } else if (canEditNow) {
    // primera vez cargando
    footerBtns = `<button class="btn-save" data-save="${m.id}">Guardar</button>`;
  } else if (showLockBadge) {
    footerBtns = statusBadge;
  }

  return `
  <div class="${cardClass}" data-match-id="${m.id}">
    <div class="match-meta">
      <span class="match-datetime">📅 ${dateStr} ${timeStr ? `· 🕐 <strong>${timeStr}</strong>` : ''}</span>
      ${m.group ? `<span class="group-tag">GRUPO ${m.group}</span>` : ''}
    </div>
    ${venueStr ? `<div class="match-venue">📍 ${venueStr}</div>` : ''}
    <div class="match-row">
      <div class="team home">
        <span class="team-name">${homeName}</span>
        ${homeFlagEl}
      </div>
      <div class="score-block">
        ${scoreBlock}
      </div>
      <div class="team away">
        ${awayFlagEl}
        <span class="team-name">${awayName}</span>
      </div>
    </div>
    ${_penaltyWinnerBlock(m, pred, off, { canEditNow, hasPrediction, hasOfficial, isKnockout, homeName, awayName })}
    <div class="match-footer">
      ${officialDisp || '<span></span>'}
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
        ${footerBtns}
      </div>
    </div>
  </div>`;
}

// =================================================================
// CAMPEÓN / SUBCAMPEÓN
// =================================================================
function renderCampeon() {
  const myPick = state.cache.finalPick || {};
  const officialFinal = state.cache.officialFinal || {};

  // Cerrado por resultado oficial cargado por admin
  const lockedByAdmin = !!(officialFinal.champion || officialFinal.runnerUp);
  // Cerrado por tiempo: el backend usa el inicio de semifinales como deadline del final pick
  const lockedByTime = isFinalPickLocked();
  const locked = lockedByAdmin || lockedByTime;
  // ¿Está en modo edición? — usamos la misma key 'final' en editingMatches
  const isEditing = state.editingMatches.has('final');
  const hasPicks = !!(myPick.champion || myPick.runnerUp);
  // Se puede editar si: no está bloqueado, y o bien (no hay picks) o (hay picks y pidió editar)
  const canEdit = !locked && (isEditing || !hasPicks);
  const showModify = !locked && hasPicks && !isEditing;

  // Lista ordenada alfabéticamente
  const teamList = Object.keys(TEAMS).sort((a, b) => TEAMS[a].name.localeCompare(TEAMS[b].name));

  function teamOptions(selectedCode, excludeCode) {
    return teamList.map(code => {
      const t = TEAMS[code];
      const disabled = excludeCode && code === excludeCode ? ' disabled' : '';
      return `<option value="${code}" ${selectedCode === code ? 'selected' : ''}${disabled}>${t.name}${disabled ? ' — ya elegido' : ''}</option>`;
    }).join('');
  }

  function selectionDisplay(code, fallback, statusType) {
    // statusType: 'saved' | 'locked' | 'official' | null
    let extraClass = '';
    let pill = '';
    if (statusType === 'saved') {
      extraClass = ' saved';
      pill = `<span class="status-pill saved">✓ Guardado</span>`;
    } else if (statusType === 'locked') {
      extraClass = ' locked';
      pill = `<span class="status-pill locked">🔒 Cerrado</span>`;
    }
    if (!code || !TEAMS[code]) {
      return `<div class="champion-current${extraClass}" style="opacity:0.5;">
        <span class="team-flag-placeholder">?</span>
        <span class="champion-current-name">${fallback}</span>
        ${pill}
      </div>`;
    }
    const t = TEAMS[code];
    return `<div class="champion-current${extraClass}">
      <img src="${flagUrl(t.iso, 'w160')}" alt="${t.name}">
      <span class="champion-current-name">${t.name}</span>
      ${pill}
    </div>`;
  }

  let officialBanner = '';
  if (officialFinal.champion || officialFinal.runnerUp) {
    const champName = officialFinal.champion ? TEAMS[officialFinal.champion]?.name : '?';
    const runName = officialFinal.runnerUp ? TEAMS[officialFinal.runnerUp]?.name : '?';
    let myExtra = 0;
    if (officialFinal.champion && myPick.champion === officialFinal.champion) myExtra += PTS_CAMPEON;
    if (officialFinal.runnerUp && myPick.runnerUp === officialFinal.runnerUp) myExtra += PTS_SUBCAMPEON;
    officialBanner = `<div class="champion-info-banner">
      ✅ <span>Resultado oficial: <strong>🥇 ${champName}</strong> · <strong>🥈 ${runName}</strong>. Sumaste <strong>+${myExtra}</strong> puntos extra.</span>
    </div>`;
  }

  // Banner de estado de la elección
  let stateBanner = '';
  if (lockedByTime && !lockedByAdmin) {
    stateBanner = `<div class="phase-locked-banner">
      🔒 <span><strong>Elección cerrada:</strong> el Mundial está por empezar.</span>
    </div>`;
  } else if (!locked) {
    const dl = finalPickDeadline();
    stateBanner = `<div class="champion-info-banner">
      🎯 <span>Elegí tu <strong>Campeón (+${PTS_CAMPEON} pts)</strong> y <strong>Subcampeón (+${PTS_SUBCAMPEON} pts)</strong>. Podés cambiarlo hasta <strong>1 hora antes del primer partido</strong>${dl ? ` (${fmtDeadline(dl)})` : ''}.</span>
    </div>`;
  }

  // Helper para determinar el statusType de cada display
  function pickStatus(hasIt) {
    if (!hasIt) return null;
    if (lockedByAdmin) return 'official';
    if (lockedByTime) return 'locked';
    return 'saved';
  }

  return `
  ${officialBanner}
  ${stateBanner}

  <div class="champion-card">
    <div class="champion-header">
      <div class="champion-trophy">🥇</div>
      <div>
        <div class="champion-title">CAMPEÓN DEL MUNDO</div>
        <div class="champion-subtitle">+${PTS_CAMPEON} puntos si acertás</div>
      </div>
    </div>
    ${canEdit ? `<div class="champion-select-wrap">
      <select id="selectChampion">
        <option value="">-- Elegí tu campeón --</option>
        ${teamOptions(myPick.champion, myPick.runnerUp)}

async function saveFinalPick() {
  if (isFinalPickLocked()) {
    showToast('Ya cerró: pasó 1h antes del primer partido', 'error');
    state.editingMatches.delete('final');
    renderContent();
    return;
  }
  const selChamp = document.getElementById('selectChampion');
  const selRun = document.getElementById('selectRunnerUp');
  if (!selChamp || !selRun) { showToast('Error: faltan campos', 'error'); return; }
  const champion = selChamp.value;
  const runnerUp = selRun.value;
  if (!champion || !runnerUp) { showToast('Elegí campeón y subcampeón', 'error'); return; }
  if (champion === runnerUp) { showToast('Campeón y subcampeón deben ser distintos', 'error'); return; }

  const reset = setButtonBusy('btnSaveFinal', 'Guardando...');
  try {
    const res = await apiFetch('/api/final-pick', {
      method: 'PUT',
      body: JSON.stringify({ champion, runner_up: runnerUp })
    });
    state.cache.finalPick = { champion: res.champion, runnerUp: res.runner_up };
    state.editingMatches.delete('final');
    await refreshLeaderboard();
    refreshMyStandings();
    // Confetti con los colores de la bandera del campeón elegido
    confetti({ intensity: 'big', colors: _teamColors(res.champion) });
    // Siempre llevamos al usuario al Fixture después de guardar la elección
    state.view = 'fixture';
    const champName = (TEAMS[res.champion] && TEAMS[res.champion].name) || res.champion;
    showToast(`🏆 ¡Listo! Tu campeón: ${champName}. Ahora cargá tus pronósticos.`);
    renderContent();
  } catch (e) {
    showToast(e.message || 'Error al guardar', 'error');
  } finally {
    if (reset) reset();
  }
}

const _resultsCache = { at: 0, payload: null };
const _auditCache = { at: 0, payload: null };

async function refreshAudit() {
  if (_auditCache.payload && (Date.now() - _auditCache.at) < 30_000) return _auditCache.payload;
  try {
    const data = await apiFetch('/api/audit/users') || [];
    _auditCache.at = Date.now();
    _auditCache.payload = data;
    return data;
  } catch (e) {
    return _auditCache.payload || [];
  }
}
const _PHASE_LABELS = {
  grupos: 'Grupos', dieciseisavos: '16vos', octavos: 'Octavos',
  cuartos: 'Cuartos', semis: 'Semis', tercerpuesto: '3er Puesto', final: 'Final'
};
const _PHASES_ORDER = ['grupos', 'dieciseisavos', 'octavos', 'cuartos', 'semis', 'tercerpuesto', 'final'];

async function refreshResults() {
  if (_resultsCache.payload && (Date.now() - _resultsCache.at) < 30_000) return _resultsCache.payload;
  try {
    const data = await apiFetch('/api/results') || [];
    _resultsCache.at = Date.now();
    _resultsCache.payload = data;
    return data;
  } catch (e) {
    return _resultsCache.payload || [];
  }
}

function _fmtAuditTs(iso) {
  if (!iso) return '—';
  const s = iso.endsWith('Z') ? iso : (iso + 'Z');
  const d = new Date(s);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('es-AR', {
    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
    timeZone: 'America/Argentina/Buenos_Aires'
  });
}

function _matchTeamsLabel(matchId) {
  const m = FIXTURE.find(x => x.id === matchId);
  if (!m) return matchId;
  const h = (TEAMS[m.home] && TEAMS[m.home].name) || m.home;
  const a = (TEAMS[m.away] && TEAMS[m.away].name) || m.away;
  return `${h} vs ${a}`;
}

    if (matches.length === 0) continue;
    html += `<div class="match-group"><div class="match-group-title">${ph.label.toUpperCase()}</div>`;
    for (const m of matches) {
      const homeT = TEAMS[m.home];
      const awayT = TEAMS[m.away];
      const homeName = homeT ? homeT.name : (m.homeLabel || 'TBD');
      const awayName = awayT ? awayT.name : (m.awayLabel || 'TBD');
      const homeFlagEl = homeT ? flagHtml(m.home) : '<span class="team-flag-placeholder">?</span>';
      const awayFlagEl = awayT ? flagHtml(m.away) : '<span class="team-flag-placeholder">?</span>';
      const off = officialResults[m.id] || {};

      html += `<div class="match-card ${off.home != null ? 'finished' : ''}">
        <div class="match-meta">
          <span>${m.id}</span>
          ${m.group ? `<span class="group-tag">G${m.group}</span>` : ''}
        </div>
        <div class="match-row">
          <div class="team home">
            <span class="team-name">${homeName}</span>
            ${homeFlagEl}
          </div>
          <div class="score-block">
            <input type="number" min="0" max="20" class="score-input" data-admin-id="${m.id}" data-side="home" value="${off.home != null ? off.home : ''}" ${!homeT ? 'disabled' : ''}>
            <span class="vs">VS</span>
            <input type="number" min="0" max="20" class="score-input" data-admin-id="${m.id}" data-side="away" value="${off.away != null ? off.away : ''}" ${!awayT ? 'disabled' : ''}>
          </div>
          <div class="team away">
            ${awayFlagEl}
            <span class="team-name">${awayName}</span>
          </div>
        </div>
        ${(m.phase && m.phase !== 'grupos' && homeT && awayT) ? `
        <div class="pen-block" data-admin-pen-id="${m.id}" ${(off.home != null && off.away != null && off.home === off.away) ? '' : 'style="display:none;"'}>
          <div class="pen-label">Empate: ¿quién pasó por penales?</div>
          <div class="pen-options">
            <label class="pen-opt ${(off.penalty_winner || '').toUpperCase() === (m.home || '').toUpperCase() ? 'selected' : ''}">
              <input type="radio" name="admin-pw-${m.id}" value="${m.home}" data-admin-pen-input="${m.id}" ${(off.penalty_winner || '').toUpperCase() === (m.home || '').toUpperCase() ? 'checked' : ''}>
              <span>${homeName}</span>
            </label>
            <label class="pen-opt ${(off.penalty_winner || '').toUpperCase() === (m.away || '').toUpperCase() ? 'selected' : ''}">
              <input type="radio" name="admin-pw-${m.id}" value="${m.away}" data-admin-pen-input="${m.id}" ${(off.penalty_winner || '').toUpperCase() === (m.away || '').toUpperCase() ? 'checked' : ''}>
              <span>${awayName}</span>
            </label>
          </div>
        </div>` : ''}
        <div class="match-footer">
          <span></span>
          <div style="display:flex;gap:6px;align-items:center;">
            ${off.home != null ? `<button class="btn-cancel" data-admin-delete="${m.id}">Borrar</button>` : ''}
            ${homeT && awayT ? `<button class="btn-save" data-admin-save="${m.id}">${off.home != null ? '✓ Actualizar' : 'Cargar Resultado'}</button>` : ''}
          </div>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  return html;
}

async function saveOfficialFinal() {
  const champion = document.getElementById('adminChampion').value;
  const runnerUp = document.getElementById('adminRunnerUp').value;
  if (!champion || !runnerUp) { showToast('Elegí campeón y subcampeón', 'error'); return; }
  if (champion === runnerUp) { showToast('Campeón y subcampeón deben ser distintos', 'error'); return; }
  const reset = setButtonBusy('btnSaveFinalOfficial', 'Guardando...');
  try {
    const res = await apiFetch('/api/admin/final', {
      method: 'POST',
      body: JSON.stringify({ champion, runner_up: runnerUp })
    });
    state.cache.officialFinal = { champion: res.champion, runnerUp: res.runner_up };
    await refreshLeaderboard();
    showToast('Resultado final oficial guardado ✓');
    renderContent();
  } catch (e) {
    showToast(e.message || 'Error al guardar', 'error');
  } finally {
    if (reset) reset();
  }
}

async function saveOfficialResult(matchId) {
  const homeInp = document.querySelector(`input[data-admin-id="${matchId}"][data-side="home"]`);
  const awayInp = document.querySelector(`input[data-admin-id="${matchId}"][data-side="away"]`);
  const home = homeInp.value, away = awayInp.value;
  if (home === '' || away === '') { showToast('Completá ambos goles', 'error'); return; }
  const homeN = parseInt(home), awayN = parseInt(away);

  // Penalty winner para knockouts con empate
  const match = FIXTURE.find(m => m.id === matchId);
  const isKnockout = match && match.phase && match.phase !== 'grupos';
  let penaltyWinner = null;
  if (isKnockout && homeN === awayN) {
    const pwInp = document.querySelector(`input[name="admin-pw-${matchId}"]:checked`);
    if (!pwInp) {
      showToast('Empate en eliminatoria: elegí quién pasó por penales', 'error');
      return;
    }
    penaltyWinner = pwInp.value;
  } else if (isKnockout) {
    const pwInp = document.querySelector(`input[name="admin-pw-${matchId}"]:checked`);
    if (pwInp) penaltyWinner = pwInp.value;
  }

  try {
    const body = { home_score: homeN, away_score: awayN };
    if (penaltyWinner) body.penalty_winner = penaltyWinner;
    const res = await apiFetch(`/api/admin/result/${encodeURIComponent(matchId)}`, {
      method: 'POST',
      body: JSON.stringify(body)
    });
    state.cache.officialResults[matchId] = {
      home: res.home_score,
      away: res.away_score,
      penalty_winner: res.penalty_winner || null,
    };
    _resultsCache.at = 0; // forzá refetch en Transparencia
    await refreshLeaderboard();
    showToast('Resultado oficial cargado ✓');
    renderContent();
  } catch (e) {
    showToast(e.message || 'Error al guardar', 'error');
  }
}

async function deleteOfficialResult(matchId) {
  try {
    await apiFetch(`/api/admin/result/${encodeURIComponent(matchId)}`, { method: 'DELETE' });
    delete state.cache.officialResults[matchId];
    _resultsCache.at = 0; // forzá refetch en Transparencia
    await refreshLeaderboard();
    showToast('Resultado borrado ✓');
    renderContent();
  } catch (e) {
    showToast(e.message || 'Error al borrar', 'error');
  }
}

async function savePrediction(matchId, opts = {}) {
  const match = FIXTURE.find(m => m.id === matchId);
  if (match && isMatchLocked(matchId)) {
    showToast('La predicción ya cerró (faltaba 1h para el partido)', 'error');
    state.editingMatches.delete(matchId);
    renderContent();
    return;
  }
  const homeInp = document.querySelector(`input[data-id="${matchId}"][data-side="home"]`);
  const awayInp = document.querySelector(`input[data-id="${matchId}"][data-side="away"]`);
  if (!homeInp || !awayInp) return;
  const home = homeInp.value, away = awayInp.value;
  if (home === '' || away === '') {
    if (!opts.silent) showToast('Cargá ambos goles', 'error');
    return;
  }
  const homeN = parseInt(home), awayN = parseInt(away);
  if (homeN < 0 || awayN < 0 || homeN > 20 || awayN > 20) {
    if (!opts.silent) showToast('Goles entre 0 y 20', 'error');
    return;
  }

  // Penalty winner: SOLO aplica en eliminatorias cuando el marcador es empate.
  // Si no es empate, nunca se manda (evita la contradicción de elegir un
  // pasador distinto al ganador del marcador).
  const isKnockout = match && match.phase && match.phase !== 'grupos';
  let penaltyWinner = null;
  if (isKnockout && homeN === awayN) {
    const pwInp = document.querySelector(`input[name="pw-${matchId}"]:checked`);
    if (pwInp) {
      penaltyWinner = pwInp.value;
    } else {
      if (!opts.silent) showToast('Empate: elegí quién pasa por penales', 'error');
      return;
    }
  }

  const card = document.querySelector(`[data-match-id="${matchId}"]`);
  if (card) card.dataset.saving = '1';

  const wasNew = !state.cache.predictions[matchId];
  try {
    const body = { home_score: homeN, away_score: awayN };
    if (penaltyWinner) body.penalty_winner = penaltyWinner;
    const res = await apiFetch(`/api/predictions/${encodeURIComponent(matchId)}`, {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    state.cache.predictions[matchId] = {
      home: res.home_score,
      away: res.away_score,
      penalty_winner: res.penalty_winner || null,
    };
    refreshMyStandings();
    confetti({ intensity: 'small' });
    if (wasNew) {
      const total = Object.keys(state.cache.predictions).length;
      if (total === 10 || total === 50 || total === 104) {
        setTimeout(() => confetti({ intensity: 'big' }), 250);
        showToast(total === 104 ? '🎉 ¡Cargaste TODOS los pronósticos! 🏆' : `🎉 ¡Llegaste a ${total} pronósticos!`);
      }
    }
    if (!opts.silent) {
      state.editingMatches.delete(matchId);
      showToast('Pronóstico guardado ✓');
      renderContent();
    } else {
      // En auto-save (debounce) no re-renderizo para no romper el foco del input
      if (card) card.dataset.saving = '0';
    }
  } catch (e) {
    if (e.status === 403) {
      showToast(e.message || 'La fase ya cerró', 'error');
      const prev = state.cache.predictions[matchId];
      if (prev) { homeInp.value = prev.home; awayInp.value = prev.away; }
      else { homeInp.value = ''; awayInp.value = ''; }
      renderContent();
    } else {
      showToast(e.message || 'Error al guardar', 'error');
    }
  } finally {
    if (card) card.dataset.saving = '0';
  }
}

function bindContent() {
  document.querySelectorAll('.phase-btn').forEach(b => {
    b.onclick = () => { state.phaseFilter = b.dataset.phase; renderContent(); };
  });
  // Radios de penalty winner: actualizar visualmente la opción seleccionada.
  document.querySelectorAll('[data-pen-input], [data-admin-pen-input]').forEach(rad => {
    rad.onchange = () => {
      const name = rad.name;
      document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
        const lbl = r.closest('.pen-opt');
        if (lbl) lbl.classList.toggle('selected', r.checked);
      });
    };
  });
  document.querySelectorAll('[data-save]').forEach(btn => {
    btn.onclick = () => savePrediction(btn.dataset.save);
  });
  document.querySelectorAll('[data-modify]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.modify;
      const match = FIXTURE.find(m => m.id === id);
      if (match && isMatchLocked(id)) {
        showToast('La predicción ya cerró (faltaba 1h para el partido)', 'error');
        return;
      }
      state.editingMatches.add(id);
      renderContent();
    };
  });
  document.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.onclick = () => {
      state.editingMatches.delete(btn.dataset.cancel);
      renderContent();
    };
  });
  document.querySelectorAll('.ranking-tab').forEach(t => {
    t.onclick = () => {
      state.rankingType = t.dataset.type;
      try { localStorage.setItem('prode_lb_company', state.rankingType); } catch (e) {}
      renderContent();
    };
  });
  document.querySelectorAll('[data-admin-save]').forEach(btn => {
    btn.onclick = () => saveOfficialResult(btn.dataset.adminSave);
  });
  document.querySelectorAll('[data-admin-delete]').forEach(btn => {
    btn.onclick = () => deleteOfficialResult(btn.dataset.adminDelete);
  });
  // Mostrar/ocultar selector de penales en el form admin según empate
  document.querySelectorAll('input.score-input[data-admin-id]').forEach(input => {
    input.addEventListener('input', () => _togglePenBlockAdmin(input.dataset.adminId));
  });

  // Auto-save debounced de predicciones al tipear en los inputs
  document.querySelectorAll('input.score-input[data-id]').forEach(input => {
    input.addEventListener('input', () => {
      const id = input.dataset.id;
      _togglePenBlock(id); // mostrar/ocultar selector de penales según empate
      debounce('pred:' + id, () => savePrediction(id, { silent: true }), 500);
    });
  });

  // Elegir quién pasa por penales también persiste la predicción (el empate
  // sin penal no se guarda en el auto-save).
  document.querySelectorAll('input[data-pen-input]').forEach(rad => {
    rad.addEventListener('change', () => {
      const id = rad.dataset.penInput;
      debounce('pred:' + id, () => savePrediction(id, { silent: true }), 300);
    });
  });

  // Sincronizar exclusión mutua entre los selects de campeón y subcampeón
  const selChamp = document.getElementById('selectChampion');
  const selRun = document.getElementById('selectRunnerUp');
  function _syncFinalSelects() {
    if (!selChamp || !selRun) return;
    const c = selChamp.value, r = selRun.value;
    [...selChamp.options].forEach(o => { o.disabled = !!o.value && o.value === r; });
    [...selRun.options].forEach(o => { o.disabled = !!o.value && o.value === c; });
  }
  if (selChamp) selChamp.addEventListener('change', _syncFinalSelects);
  if (selRun) selRun.addEventListener('change', _syncFinalSelects);

  const btnSaveFinal = document.getElementById('btnSaveFinal');
  if (btnSaveFinal) btnSaveFinal.onclick = saveFinalPick;
  const btnModifyFinal = document.getElementById('btnModifyFinal');
  if (btnModifyFinal) btnModifyFinal.onclick = () => {
    if (isFinalPickLocked()) { showToast('Ya cerró la elección de campeón', 'error'); return; }
    state.editingMatches.add('final');
    renderContent();
  };
  const btnCancelFinal = document.getElementById('btnCancelFinal');
  if (btnCancelFinal) btnCancelFinal.onclick = () => {
    state.editingMatches.delete('final');
    renderContent();
  };
  const btnSaveFinalOfficial = document.getElementById('btnSaveFinalOfficial');
  if (btnSaveFinalOfficial) btnSaveFinalOfficial.onclick = saveOfficialFinal;
  const goToCampeon = document.getElementById('goToCampeon');
  if (goToCampeon) goToCampeon.onclick = () => { state.view = 'campeon'; renderContent(); };

  const btnSyncDebug = document.getElementById('btnSyncDebug');
  const btnSyncNow = document.getElementById('btnSyncNow');
  const syncOut = document.getElementById('syncOutput');
  async function runSyncEndpoint(path, method, btn, label) {
    if (!syncOut || !btn) return;
    const reset = setButtonBusy(btn.id, label);
    syncOut.style.display = 'block';
    syncOut.textContent = 'Llamando…';
    try {
      const data = await apiFetch(path, { method });
      syncOut.textContent = JSON.stringify(data, null, 2);
      if (path.endsWith('/sync-now')) {
        await Promise.allSettled([loadAppData(), refreshMyStandings && refreshMyStandings()]);
        renderContent();
        const msg = `Sync OK · creados: ${data.synced || 0} · sin match: ${(data.unmatched || []).length}`;
        showToast(msg, (data.synced > 0) ? 'success' : 'info');
      }
    } catch (e) {
      syncOut.textContent = 'Error: ' + (e.message || e);
      showToast('No se pudo ejecutar el sync', 'error');
    } finally {
      if (reset) reset();
    }
  }
  if (btnSyncDebug) btnSyncDebug.onclick = () => runSyncEndpoint('/api/admin/sync-debug', 'GET', btnSyncDebug, 'Consultando…');
  if (btnSyncNow) btnSyncNow.onclick = () => runSyncEndpoint('/api/admin/sync-now', 'POST', btnSyncNow, 'Sincronizando…');

  const btnResultsAudit = document.getElementById('btnResultsAudit');
  if (btnResultsAudit) btnResultsAudit.onclick = async () => {
    if (!syncOut) return;
    const reset = setButtonBusy(btnResultsAudit.id, 'Auditando…');
    syncOut.style.display = 'block';
    syncOut.textContent = 'Comparando contra football-data.org…';
    try {
      const data = await apiFetch('/api/admin/results-audit', { method: 'GET' });
      syncOut.innerHTML = _renderResultsAudit(data);
      const c = data.counts || {};
      const msg = `Auditados: ${data.total_audited || 0} · ok: ${c.ok || 0} · mismatches: ${c.mismatch || 0}`;
      showToast(msg, (c.mismatch || 0) > 0 ? 'error' : 'success');
    } catch (e) {
      syncOut.textContent = 'Error: ' + (e.message || e);
      showToast('No se pudo auditar', 'error');
    } finally {
      if (reset) reset();
    }
  };

  const btnScheduleAudit = document.getElementById('btnScheduleAudit');
  if (btnScheduleAudit) btnScheduleAudit.onclick = async () => {
    if (!syncOut) return;
    const reset = setButtonBusy(btnScheduleAudit.id, 'Verificando…');
    syncOut.style.display = 'block';
    syncOut.textContent = 'Comparando horarios contra football-data.org…';
    try {
      const data = await apiFetch('/api/admin/schedule-audit', { method: 'GET' });
      syncOut.innerHTML = _renderScheduleAudit(data);
      const c = data.counts || {};
      const problems = (c.kickoff_diff || 0) + (c.swapped_teams || 0) + (c.remote_not_found || 0);
      const msg = `Auditados: ${data.total_audited || 0} · ok: ${c.ok || 0} · problemas: ${problems} · TBD: ${c.tbd_skipped || 0}`;
      showToast(msg, problems > 0 ? 'error' : 'success');
    } catch (e) {
      syncOut.textContent = 'Error: ' + (e.message || e);
      showToast('No se pudo verificar horarios', 'error');
    } finally {
      if (reset) reset();
    }
  };
}

function _renderScheduleAudit(data) {
  const rows = data.rows || [];
  const c = data.counts || {};
  const _esc = (s) => String(s == null ? '' : s).replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
  const teamName = (tla) => (typeof TEAMS !== 'undefined' && TEAMS[tla] && TEAMS[tla].name) || tla || '?';
  const fmtArt = (iso) => {
    if (!iso) return '—';
    try {
      const d = new Date(iso.replace('Z', '+00:00'));
      return d.toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'America/Argentina/Buenos_Aires' });
    } catch (e) { return iso; }
  };
  const statusLabel = {
    ok: '✅ OK',
    kickoff_diff: '❌ HORARIO DIFERENTE',
    swapped_teams: '🔁 LOCAL/VISITANTE INVERTIDOS',
    remote_not_found: '❓ No encontrado en API',
    tbd_skipped: '🔒 TBD (sin definir)',
  };
  const statusColor = {
    ok: '#7bd97b',
    kickoff_diff: '#ff6b6b',
    swapped_teams: '#ffd178',
    remote_not_found: '#ffaa70',
    tbd_skipped: 'rgba(255,255,255,0.4)',
  };
  const header = `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:#fff;margin-bottom:8px;">
    <span>Total: <strong>${data.total_audited || 0}</strong></span>
    <span style="color:#7bd97b;">✅ ok: <strong>${c.ok || 0}</strong></span>
    <span style="color:#ff6b6b;">❌ horario distinto: <strong>${c.kickoff_diff || 0}</strong></span>
    <span style="color:#ffd178;">🔁 invertidos: <strong>${c.swapped_teams || 0}</strong></span>
    <span style="color:#ffaa70;">❓ no en API: <strong>${c.remote_not_found || 0}</strong></span>
    <span style="color:rgba(255,255,255,0.5);">🔒 TBD: <strong>${c.tbd_skipped || 0}</strong></span>
  </div>`;
  if (!data.remote_available) {
    return header + `<div style="color:#ffaa70;font-size:12px;">⚠️ No se pudo conectar con football-data.org. Revisá el token y/o el último error en "Diagnosticar sync".</div>`;
  }
  // Filtramos los TBD para no inundar la tabla (los contamos en el header)
  const visibleRows = rows.filter(r => r.status !== 'tbd_skipped');
  const table = `<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;font-size:11.5px;color:#fff;">
    <thead>
      <tr style="background:rgba(255,255,255,0.06);">
        <th style="text-align:left;padding:6px 8px;">match_id</th>
        <th style="text-align:left;padding:6px 8px;">Fase</th>
        <th style="text-align:left;padding:6px 8px;">Partido (nuestro)</th>
        <th style="text-align:left;padding:6px 8px;">Kickoff nuestro (ART)</th>
        <th style="text-align:left;padding:6px 8px;">Kickoff API (ART)</th>
        <th style="text-align:center;padding:6px 8px;">Δ min</th>
        <th style="text-align:left;padding:6px 8px;">Estado</th>
      </tr>
    </thead>
    <tbody>
    ${visibleRows.map(r => {
      const partido = (r.home_tla && r.away_tla) ? `${_esc(teamName(r.home_tla))} vs ${_esc(teamName(r.away_tla))}` : '—';
      const ourKo = fmtArt(r.kickoff_utc_local);
      const apiKo = r.kickoff_utc_remote ? fmtArt(r.kickoff_utc_remote) : '—';
      const delta = (r.diff_minutes != null) ? (r.diff_minutes > 0 ? '+' : '') + r.diff_minutes : '';
      const deltaColor = (r.diff_minutes != null && r.diff_minutes !== 0) ? '#ffb6b6' : 'rgba(255,255,255,0.5)';
      const extra = (r.status === 'swapped_teams' && r.remote_home_tla)
        ? `<div style="font-size:10px;opacity:0.7;">API: ${_esc(teamName(r.remote_home_tla))} vs ${_esc(teamName(r.remote_away_tla))}</div>`
        : '';
      return `<tr style="border-top:1px solid rgba(255,255,255,0.06);">
        <td style="padding:5px 8px;font-family:monospace;opacity:0.7;">${_esc(r.match_id)}</td>
        <td style="padding:5px 8px;font-size:10px;opacity:0.75;">${_esc(r.phase || '—')}</td>
        <td style="padding:5px 8px;">${partido}${extra}</td>
        <td style="padding:5px 8px;">${ourKo}</td>
        <td style="padding:5px 8px;">${apiKo}</td>
        <td style="padding:5px 8px;text-align:center;font-weight:800;color:${deltaColor};">${delta}</td>
        <td style="padding:5px 8px;color:${statusColor[r.status] || '#fff'};">${statusLabel[r.status] || r.status}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>
  ${c.tbd_skipped > 0 ? `<div style="margin-top:8px;font-size:11px;opacity:0.6;">Se omitieron ${c.tbd_skipped} partidos con TBD (knockouts sin equipos definidos todavía).</div>` : ''}`;
  return header + table;
}

function _renderResultsAudit(data) {
  const rows = data.rows || [];
  const c = data.counts || {};
  const _esc = (s) => String(s == null ? '' : s).replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]));
  const teamName = (tla) => (typeof TEAMS !== 'undefined' && TEAMS[tla] && TEAMS[tla].name) || tla || '?';
  const statusLabel = {
    ok: '✅ OK',
    mismatch: '❌ DIFERENTE',
    remote_unfinished: '⏳ Aún en juego/sin terminar',
    remote_not_found: '❓ No encontrado en API',
    knockout_skipped: '🔒 Knockout (no comparable)',
    fixture_not_found: '⚠️ match_id desconocido',
  };
  const statusColor = {
    ok: '#7bd97b',
    mismatch: '#ff6b6b',

function confetti(opts = {}) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const intensity = opts.intensity || 'small';
  const N = intensity === 'big' ? 360 : 140;
  const duration = intensity === 'big' ? 4500 : 2600;
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = innerWidth; canvas.height = innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let colors;
  if (Array.isArray(opts.colors) && opts.colors.length) {
    colors = opts.colors;
  } else if (opts.palette && CONFETTI_PALETTES[opts.palette]) {
    colors = CONFETTI_PALETTES[opts.palette];
  } else {
    colors = CONFETTI_PALETTES.default;
  }
  // Distribución FULL-SCREEN: partículas caen desde arriba del viewport en
  // todo el ancho. Da sensación de "papelitos en toda la pantalla".
  const W = canvas.width, H = canvas.height;
  const spread = intensity === 'big' ? H * 0.9 : H * 0.4;
  const parts = [];
  for (let i = 0; i < N; i++) {
    parts.push({
      x: Math.random() * W,
      y: -20 - Math.random() * spread,
      vx: (Math.random() - 0.5) * 4,
      vy: 1.5 + Math.random() * (intensity === 'big' ? 4.5 : 3.5),
      g: 0.05 + Math.random() * 0.06,
      r: 4 + Math.random()*5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.35,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random() < 0.55 ? 'rect' : 'circle',
    });
  }
  const start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.vy += p.g;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - t/duration);
      if (p.shape === 'rect') ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r);
      else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if (t < duration) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

let _livePollTimer = null;
const _UPCOMING_LIMIT = 5;

function _formatCountdown(ms) {
  if (ms <= 0) return 'arrancando...';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${ss}s`;
  return `${ss}s`;
}

function _teamNameOrCode(code) {
  return (TEAMS[code] && TEAMS[code].name) || code;
}

function _todayArtDate() {
  // Devuelve YYYY-MM-DD según la fecha actual en hora Argentina (UTC-3).
  // Useful para filtrar el FIXTURE cuyo `date` ya viene en ART.
  const nowArt = new Date(Date.now() - 3 * 60 * 60 * 1000);
  return nowArt.toISOString().slice(0, 10);
}

function _tomorrowArtDate() {
  // YYYY-MM-DD del día siguiente al actual en hora Argentina (UTC-3).
  const nowArt = new Date(Date.now() - 3 * 60 * 60 * 1000 + 24 * 60 * 60 * 1000);
  return nowArt.toISOString().slice(0, 10);
}

function _matchKickoffMs(m) {
  // El FIXTURE local tiene date (YYYY-MM-DD) y time (HH:MM) en hora ARG (UTC-3).
  // Si viniera del backend ya tendría datetime_utc; soportamos ambos.
  if (m.datetime_utc) return new Date(m.datetime_utc.replace('Z', '+00:00')).getTime();
  return new Date(`${m.date}T${m.time || '00:00'}:00-03:00`).getTime();
}

function _upcomingMatches(limit = _UPCOMING_LIMIT) {
  const now = Date.now();
  const arr = [];
  for (const m of FIXTURE) {
    const ko = _matchKickoffMs(m);
    if (Number.isFinite(ko) && ko > now) arr.push({ m, ko });
  }
  arr.sort((a, b) => a.ko - b.ko);
  return arr.slice(0, limit);
}

function _liveAndUpcomingHTML() {
  const data = state.live;
  let liveHtml = '';
  let next = data ? data.next_match : null;

  const remoteLive = data
    ? (data.remote_matches || []).filter(m => ['IN_PLAY','PAUSED','LIVE'].includes((m.status||'').toUpperCase()))
    : [];

  if (remoteLive.length > 0) {
    liveHtml = `<div class="side-block">
      <div class="side-title"><span class="dot"></span> En vivo ahora</div>`;
    remoteLive.forEach(m => {
      const score = (m.home_score != null && m.away_score != null) ? `${m.home_score} - ${m.away_score}` : '—';
      liveHtml += `<div class="live-row">
        <span class="live-teams">${m.home_name || m.home_tla || '?'}<br>vs ${m.away_name || m.away_tla || '?'}</span>
        <span class="live-score">${score}</span>
        ${m.minute ? `<span class="live-minute">${m.minute}'</span>` : ''}
      </div>`;
    });
    liveHtml += `</div>`;
  } else if (data && (data.live_local || []).length > 0) {
    liveHtml = `<div class="side-block">
      <div class="side-title"><span class="dot"></span> Se está jugando</div>`;
    data.live_local.forEach(m => {
      liveHtml += `<div class="live-row">
        <span class="live-teams">${_teamNameOrCode(m.home)} vs ${_teamNameOrCode(m.away)}</span>
        <span class="live-minute">~${m.minutes_in}'</span>
      </div>`;
    });
    if (!data.remote_available) {
      liveHtml += `<div style="font-size:10px;color:rgba(255,255,255,0.45);text-align:center;margin-top:4px;">marcador no disponible</div>`;
    }
    liveHtml += `</div>`;
  }

  // Próximos partidos (siempre, separado del live)
  const upcoming = _upcomingMatches(_UPCOMING_LIMIT);
  let upHtml = '';
  if (upcoming.length > 0) {
    upHtml = `<div class="side-block">
      <div class="side-title">📅 Próximos partidos</div>`;
    upcoming.forEach(({ m, ko }) => {
      const ms = ko - Date.now();
      upHtml += `<div class="upcoming-row">
        <span class="upcoming-teams">${_teamNameOrCode(m.home)} vs ${_teamNameOrCode(m.away)}</span>
        <span class="upcoming-countdown">${_formatCountdown(ms)}</span>
      </div>`;
    });
    upHtml += `</div>`;
  } else {
    upHtml = `<div class="side-block"><div class="side-empty">No quedan partidos por jugar.</div></div>`;
  }

  if (!liveHtml && next) {
    // sin live "real": ponemos al próximo destacado en el bloque de live
    const ko = _matchKickoffMs(next);
    const ms = ko - Date.now();
    liveHtml = `<div class="side-block">
      <div class="side-title" style="color:#d6e394;">⏳ Próximo</div>
      <div class="upcoming-row">
        <span class="upcoming-teams">${_teamNameOrCode(next.home)} vs ${_teamNameOrCode(next.away)}</span>
        <span class="upcoming-countdown">${_formatCountdown(ms)}</span>
      </div>
    </div>`;
  }

  return liveHtml + upHtml + _argentinaScheduleHTML() + _todayMatchesHTML() + _vivaSponsorBlockHTML();
}

// Partidos del día de hoy (en hora ARG)
function _todayARTDate() {
  // Fecha actual en formato YYYY-MM-DD según huso ART (UTC-3)
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Argentina/Buenos_Aires',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const get = (t) => parts.find(p => p.type === t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function _todayMatchesHTML() {
  const today = _todayARTDate();
  const todayMatches = FIXTURE
    .filter(m => m.date === today)
    .sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  if (todayMatches.length === 0) {
    return `<div class="side-block">
      <div class="side-title">📅 Partidos de hoy</div>
      <div class="side-empty">No hay partidos hoy.</div>
    </div>`;
  }

  const nowMs = Date.now();
  const FINISHED_AFTER = 2 * 60 * 60 * 1000; // 2h después del kickoff
  let html = `<div class="side-block">
    <div class="side-title">📅 Partidos de hoy</div>`;
  todayMatches.forEach(m => {
    const home = _teamNameOrCode(m.home);
    const away = _teamNameOrCode(m.away);
    const koMs = _matchKickoffMs(m);
    let status, statusClass;
    if (nowMs >= koMs && nowMs < koMs + FINISHED_AFTER) {
      const mins = Math.max(0, Math.floor((nowMs - koMs) / 60000));
      status = `🔴 ~${mins}'`;
      statusClass = 'today-live';
    } else if (nowMs >= koMs + FINISHED_AFTER) {
      status = '✓ Final';
      statusClass = 'today-done';
    } else {
      status = `🕐 ${m.time || '?'} hs`;
      statusClass = 'today-upcoming';
    }
    html += `<div class="today-row">
      <div class="today-teams">${home} <span class="today-vs">vs</span> ${away}</div>
      <div class="today-status ${statusClass}">${status}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

// Cronograma de Argentina en fase de grupos con canales de TV en ARG
const ARG_TV_CHANNELS = 'TV Pública · DSports · Telefe';
function _argentinaScheduleHTML() {
  // Todos los partidos donde Argentina juega: grupos siempre, y eliminatorias
  // una vez que quedó asignada (home/away === 'ARG', no TBD).
  const argMatches = FIXTURE.filter(m =>
    m.home === 'ARG' || m.away === 'ARG'
  ).sort((a, b) => _matchKickoffMs(a) - _matchKickoffMs(b));
  if (argMatches.length === 0) return '';

  const fmtDate = (m) => {
    const d = new Date(`${m.date}T${m.time || '00:00'}:00-03:00`);
    return d.toLocaleDateString('es-AR', { weekday: 'short', day: '2-digit', month: 'short' });
  };

  const nowMs = Date.now();
  // Próximo partido = el primero cuyo kickoff todavía no pasó (con margen +2h
  // por si está jugándose).
  const FINISHED_AFTER = 2 * 60 * 60 * 1000;
  const nextMatch = argMatches.find(m => _matchKickoffMs(m) + FINISHED_AFTER > nowMs);

  let html = `<div class="side-block">
    <div class="side-title">🇦🇷 Argentina en el Mundial</div>`;
  argMatches.forEach(m => {
    const home = _teamNameOrCode(m.home);
    const away = _teamNameOrCode(m.away);
    const argIsHome = m.home === 'ARG';
    const teams = argIsHome
      ? `<strong>${home}</strong> vs ${away}`
      : `${home} vs <strong>${away}</strong>`;
    const phaseLbl = _PHASE_LABELS[m.phase] || '';
    const isNext = nextMatch && m.id === nextMatch.id;
    const off = (state.cache.officialResults || {})[m.id];
    const hasResult = off && off.home != null && off.away != null;
    let resultLine = '';
    if (hasResult) {
      let extra = '';
      if (m.phase !== 'grupos' && off.penalty_winner && off.home === off.away) {
        extra = ` (pen: ${_teamNameOrCode(off.penalty_winner)})`;
      }
      resultLine = `<div class="arg-match-result">✅ ${off.home} - ${off.away}${extra}</div>`;
    }
    html += `<div class="arg-match ${isNext ? 'arg-match-next' : ''}">
      <div class="arg-match-phase">${phaseLbl}${isNext ? ' · <strong>PRÓXIMO</strong>' : ''}</div>
      <div class="arg-match-teams">${teams}</div>
      <div class="arg-match-meta">📅 ${fmtDate(m)} · 🕐 ${m.time || '?'} hs (ART)</div>
      ${resultLine || `<div class="arg-match-tv">📺 ${ARG_TV_CHANNELS}</div>`}
    </div>`;
  });
  html += `<div class="arg-match-note">Los partidos de eliminación aparecen cuando se confirma el cruce. Canales según derechos confirmados.</div>`;
  html += `</div>`;
  return html;
}
