// =================================================================
// CONFETTI
// =================================================================
function confetti(opts = {}) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const intensity = opts.intensity || 'small';
  const N = intensity === 'big' ? 220 : 80;
  const duration = intensity === 'big' ? 3400 : 2000;
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  canvas.width = innerWidth; canvas.height = innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#ff8a4c','#ffd0a8','#bacab8','#ff5f47','#ffd23f','#3aa9ff','#79e3a4','#e6479e'];
  const cx = canvas.width / 2;
  const cy = intensity === 'big' ? canvas.height / 2 : canvas.height * 0.4;
  const parts = [];
  for (let i = 0; i < N; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (Math.random() * 0.7 + 0.4) * (intensity === 'big' ? 16 : 11);
    parts.push({
      x: cx + (Math.random()-0.5)*40,
      y: cy + (Math.random()-0.5)*30,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (intensity === 'big' ? 4 : 2),
      g: 0.38 + Math.random()*0.25,
      r: 4 + Math.random()*5,
      rot: Math.random()*Math.PI*2,
      vr: (Math.random()-0.5)*0.4,
      color: colors[Math.floor(Math.random()*colors.length)],
      shape: Math.random() < 0.55 ? 'rect' : 'circle',
    });
  }
  const start = performance.now();
  function frame(now) {
    const t = now - start;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    parts.forEach(p => {
      p.vy += p.g;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - t/duration);
      if (p.shape === 'rect') ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r);
      else { ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if (t < duration) requestAnimationFrame(frame);
    else canvas.remove();
  }
  requestAnimationFrame(frame);
}

// =================================================================
// LIVE WIDGET
// =================================================================
let _livePollTimer = null;

function _formatCountdown(ms) {
  if (ms <= 0) return 'arrancando...';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${ss}s`;
  return `${ss}s`;
}

function _teamNameOrCode(code) {
  return (TEAMS[code] && TEAMS[code].name) || code;
}

function renderLiveWidget() {
  const data = state.live;
  if (!data) return '';

  // Cruce: si hay remote_matches con status IN_PLAY/LIVE/PAUSED, los priorizamos
  const remoteLive = (data.remote_matches || []).filter(m =>
    ['IN_PLAY', 'PAUSED', 'LIVE'].includes((m.status || '').toUpperCase())
  );

  let html = '';

  if (remoteLive.length > 0) {
    html += `<div class="live-widget">
      <div class="live-widget-title"><span class="dot"></span> EN VIVO AHORA</div>`;
    remoteLive.forEach(m => {
      const score = (m.home_score != null && m.away_score != null)
        ? `${m.home_score} - ${m.away_score}` : '—';
      html += `<div class="live-row">
        <span class="live-teams">${m.home_name || m.home_tla || '?'} vs ${m.away_name || m.away_tla || '?'}</span>
        <span class="live-score">${score}</span>
        ${m.minute ? `<span class="live-minute">${m.minute}'</span>` : ''}
      </div>`;
    });
    html += `</div>`;
  } else if ((data.live_local || []).length > 0) {
    html += `<div class="live-widget">
      <div class="live-widget-title"><span class="dot"></span> SE ESTÁ JUGANDO</div>`;
    data.live_local.forEach(m => {
      html += `<div class="live-row">
        <span class="live-teams">${_teamNameOrCode(m.home)} vs ${_teamNameOrCode(m.away)}</span>
        <span class="live-minute">~${m.minutes_in}' de juego</span>
      </div>`;
    });
    if (data.remote_error || !data.remote_available) {
      html += `<div style="font-size:10px;color:rgba(255,255,255,0.4);text-align:center;margin-top:4px;">marcador no disponible</div>`;
    }
    html += `</div>`;
  }

  // Próximo partido — solo si NO hay nada en vivo
  if (!html && data.next_match) {
    const m = data.next_match;
    const ko = new Date(m.datetime_utc.replace('Z', '+00:00'));
    const ms = ko.getTime() - Date.now();
    html = `<div class="live-widget next">
      <div class="live-widget-title"><span class="dot"></span> PRÓXIMO PARTIDO</div>
      <div class="live-row">
        <span class="live-teams">${_teamNameOrCode(m.home)} vs ${_teamNameOrCode(m.away)}</span>
        <span class="live-countdown">${_formatCountdown(ms)}</span>
      </div>
    </div>`;
  }
  return html;
}

async function loadLive() {
  try {
    state.live = await apiFetch('/api/live');
    if (state.view === 'fixture') {
      // re-render solo si estamos viendo el fixture y no estamos editando algo
      const c = document.getElementById('content');
      if (c && state.editingMatches.size === 0) renderContent();
    }
  } catch (e) { /* silent */ }
}

function startLivePolling() {
  if (_livePollTimer) return;
  loadLive();
  _livePollTimer = setInterval(loadLive, 60_000);
}
function stopLivePolling() {
  if (_livePollTimer) { clearInterval(_livePollTimer); _livePollTimer = null; }
}

// =================================================================
// COMMENTS PANEL
// =================================================================
let _commentsPollTimer = null;

function renderCommentsList() {
  const list = document.getElementById('commentsList');
  if (!list) return;
  const items = state.comments || [];
  if (items.length === 0) {
    list.innerHTML = '<div style="color:rgba(255,255,255,0.4);text-align:center;padding:30px 0;font-size:12px;">No hay comentarios todavía. Sé el primero.</div>';
    return;
  }
  list.innerHTML = items.map(c => {
    const time = new Date(c.created_at + (c.created_at.endsWith('Z') ? '' : 'Z'));
    const when = time.toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    const tags = [
      `<span class="comment-tag">${c.sector || ''}</span>`,
      companyTag(c.company),
      cityTag(c.city)
    ].filter(Boolean).join(' ');
    return `<div class="comment-card">
      <div class="comment-head">
        <span class="comment-name">${c.display_name || c.username}</span>
        ${tags}
        <span class="comment-meta">${when}</span>
      </div>
      <div class="comment-body">${(c.body || '').replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]))}</div>
    </div>`;
  }).join('');
}

function _updateCommentsBadge() {
  const badge = document.getElementById('commentsBadge');
  if (!badge) return;
  const newest = state.comments[0] ? state.comments[0].id : 0;
  const unread = state.comments.filter(c => c.id > state.commentsLastSeenId).length;
  if (unread > 0 && !state.commentsOpen) {
    badge.textContent = unread > 99 ? '99+' : String(unread);
    badge.hidden = false;
  } else {
    badge.hidden = true;
  }
  if (state.commentsOpen && newest > state.commentsLastSeenId) {
    state.commentsLastSeenId = newest;
    try { localStorage.setItem('prode_comments_last', String(newest)); } catch (e) {}
  }
}

async function loadComments() {
  try {
    state.comments = await apiFetch('/api/comments?limit=100') || [];
    renderCommentsList();
    _updateCommentsBadge();
  } catch (e) { /* silent */ }
}

async function postComment(body) {
  const trimmed = (body || '').trim();
  if (!trimmed) return;
  const btn = document.getElementById('commentSend');
  if (btn) btn.disabled = true;
  try {
    const created = await apiFetch('/api/comments', {
      method: 'POST',
      body: JSON.stringify({ body: trimmed })
    });
    state.comments.unshift(created);
    renderCommentsList();
    _updateCommentsBadge();
    const input = document.getElementById('commentInput');
    if (input) input.value = '';
  } catch (e) {
    showToast(e.message || 'Error al enviar comentario', 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function openComments() {
  state.commentsOpen = true;
  const panel = document.getElementById('commentsPanel');
  if (panel) { panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); }
  if (state.comments[0]) {
    state.commentsLastSeenId = state.comments[0].id;
    try { localStorage.setItem('prode_comments_last', String(state.commentsLastSeenId)); } catch (e) {}
  }
  _updateCommentsBadge();
}
function closeComments() {
  state.commentsOpen = false;
  const panel = document.getElementById('commentsPanel');
  if (panel) { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); }
}

function bindComments() {
  const fab = document.getElementById('commentsFab');
  if (fab && !fab._bound) {
    fab._bound = true;
    fab.addEventListener('click', () => state.commentsOpen ? closeComments() : openComments());
  }
  const close = document.getElementById('commentsClose');
  if (close && !close._bound) { close._bound = true; close.addEventListener('click', closeComments); }
  const form = document.getElementById('commentsForm');
  if (form && !form._bound) {
    form._bound = true;
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      postComment(input ? input.value : '');
    });
  }
  const input = document.getElementById('commentInput');
  if (input && !input._bound) {
    input._bound = true;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        postComment(input.value);
      }
    });
  }
}

function startCommentsPolling() {
  if (_commentsPollTimer) return;
  loadComments();
  _commentsPollTimer = setInterval(loadComments, 30_000);
}
function stopCommentsPolling() {
  if (_commentsPollTimer) { clearInterval(_commentsPollTimer); _commentsPollTimer = null; }
}

function showCommentsFab() {
  const fab = document.getElementById('commentsFab');
  if (fab) fab.hidden = false;
  bindComments();
}
function hideCommentsFab() {
  const fab = document.getElementById('commentsFab');
  if (fab) fab.hidden = true;
  closeComments();
}

// =================================================================
// POLLING LIFECYCLE
// =================================================================
function startBackgroundPolling() {
  startLivePolling();
  startCommentsPolling();
  showCommentsFab();
}
function stopBackgroundPolling() {
  stopLivePolling();
  stopCommentsPolling();
  hideCommentsFab();
}

// =================================================================
// INIT — validar token y cargar datos antes de renderizar
// =================================================================
async function appBoot() {
  const token = getToken();
  if (!token) { render(); return; }
  try {
    const user = await apiFetch('/api/auth/me');
    state.currentUser = user;
    state.view = 'fixture';
    await loadAppData();
    startBackgroundPolling();
  } catch (e) {
    clearAuth();
    state.currentUser = null;
  }
  render();
}

appBoot();

// =================================================================
// SPLASH / INTRO — botón Entrar + música + animación
// =================================================================
(function setupSplash() {
  const splash = document.getElementById('splash');
  const btn = document.getElementById('splashEnter');
  const audio = document.getElementById('splashAudio');
  if (!splash || !btn) return;

  function dismiss() {
    btn.disabled = true;
    if (audio) {
      try { audio.currentTime = 0; audio.play().catch(() => {}); } catch (e) {}
    }
    splash.classList.add('exploding');
    setTimeout(() => splash.classList.add('dismissed'), 700);
    setTimeout(() => { splash.style.display = 'none'; }, 1500);
  }

  btn.addEventListener('click', dismiss, { once: true });
})();
</script>
